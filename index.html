// ===================== INVOICE TAB =====================
// 상품명 통합 문자열: ★★[식품]★★[파손주의]★★ + 상품명 박스 스티커 수량개
const PREFIX = "★★[식품]★★[파손주의]★★";
// 선택 주문 → (상품명+추가)별 · 박스종류별 집계 (주문서·포장 공통)
const computeBoxSummary = (list) => {
  const map={};
  (list||[]).forEach(o=>{
    const base=o.상품명||"(미지정)";
    const add=String(o.추가||"").trim();
    const p=add?`${base}+${add}`:base;
    const b=o.박스||"미지정";
    const q=o.수량||1;
    if(!map[p])map[p]={_total:0};
    map[p][b]=(map[p][b]||0)+q;
    map[p]._total+=q;
  });
  const products=Object.keys(map).sort((a,b)=>map[b]._total-map[a]._total);
  const grand=(list||[]).reduce((s,o)=>s+(o.수량||1),0);
  return{map,products,grand,count:(list||[]).length};
};
// 집계표 인쇄 HTML (예: 5종+로+말 300박스 / 화이트 300개)
const boxSummaryPrintHTML = (bs) => {
  if(!bs||!bs.count)return "";
  return `<h3 style="color:#1d1d1f;margin:10px 0 4px">📦 선택 집계 (총 ${bs.grand}박스)</h3>
  <table style="margin-bottom:14px"><thead><tr><th class="nowrap">상품명</th><th class="nowrap">박스 구성</th><th class="nowrap">합계</th></tr></thead><tbody>
  ${bs.products.map(p=>{const boxes=Object.keys(bs.map[p]).filter(k=>k!=="_total");return `<tr><td class="nowrap"><b>${p}</b></td><td>${boxes.map(b=>`${b} ${bs.map[p][b]}개`).join(", ")}</td><td class="nowrap" style="text-align:center"><b>${bs.map[p]._total}박스</b></td></tr>`;}).join("")}
  <tr style="background:#eef4ff"><td class="nowrap"><b>총 합계</b></td><td></td><td class="nowrap" style="text-align:center"><b>${bs.grand}박스</b></td></tr>
  </tbody></table>`;
};

// 주문자·수취인 비교로 발송인/수취인/배송메모1 자동 결정
// - 주문자 ≠ 수취인(선물): 발송인=주문자, 수취인=수취인명, 배송메모1="주문자님이 보내신 쿠키답례품입니다"
// - 주문자 = 수취인 또는 수취인 미입력(본인수령): 발송인=(주)원사부, 수취인=주문자, 배송메모1=공란(기존 수동메모 유지)
const AUTO_MEMO_RE = /님이 보내신 쿠키답례품입니다$/;
const resolveShipping = (o) => {
  const orderer=(o.주문자||"").trim();
  const receiver=(o.수취인||"").trim();
  const isGift = receiver && receiver!==orderer;
  if(isGift){
    return {
      발송인: orderer,
      수취인: receiver,
      배송메모: `${orderer}님이 보내신 쿠키답례품입니다`,
    };
  }
  // 본인 수령: 기존 배송메모가 자동문구였다면 비우고, 수동 메모면 유지
  const prev=(o.배송메모||"").trim();
  return {
    발송인: "(주)원사부",
    수취인: orderer,
    배송메모: AUTO_MEMO_RE.test(prev)?"":o.배송메모||"",
  };
};

const buildProductName = (o) => {
  const parts=[o.상품명];
  if(o.추가)parts.push(`+${o.추가}`);   // 추가 구성/옵션을 상품명 뒤에 이어붙임
  if(o.박스)parts.push(o.박스);
  if(o.스티커)parts.push(o.스티커);
  const body=parts.join(" ")+` ${o.수량||1}개`;
  return PREFIX+body;
};

function InvoiceTab({orders,onSave,currentUser,notify}) {
  const today=todayStr();
  const canEdit=true; // 송장 입력(작업 리스트)은 전 직원 가능
  const isAdmin=currentUser.role==="admin";   // 완료리스트 수정/삭제/주문서이동은 관리자만
  const [locals,setLocals]=useState([]);
  const [confirmDel,setConfirmDel]=useState(null);
  const [confirmDelMany,setConfirmDelMany]=useState(false);
  const [sel,setSel]=useState([]);              // 체크된 행 id
  const [editModal,setEditModal]=useState(null);
  const [openDates,setOpenDates]=useState({});  // 아카이브 날짜별 펼침(기본 접힘)
  const [adSel,setAdSel]=useState([]);          // 아카이브 선택
  const dirty=useRef(false);

  // 인쇄(엑셀다운) 대기: 포장에서 넘어온 택배 중 아직 다운 안 한 건
  useEffect(()=>{
    if(!dirty.current){
      setLocals(orders
        .filter(o=>o.배송방법==="택배"&&o.상태==="송장대기"&&!o.invoiceExported)
        .map(o=>({...o})));
    }
  },[orders]);

  // 다운 완료 아카이브: 엑셀 다운된 택배 건 (날짜별 정리)
  const archived=useMemo(()=>orders.filter(o=>o.배송방법==="택배"&&o.invoiceExported),[orders]);
  const archiveByDate=useMemo(()=>{
    const m={};
    archived.forEach(o=>{const d=o.배송일||"기타";(m[d]=m[d]||[]).push(o);});
    return Object.keys(m).sort((a,b)=>b.localeCompare(a)).map(d=>({date:d,items:m[d]}));
  },[archived]);

  const upd=(id,k,v)=>{dirty.current=true;setLocals(ls=>ls.map(o=>o.id===id?{...o,[k]:v}:o));};
  const selOne=(id)=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const setSelVal=(id,val)=>setSel(s=>val?Array.from(new Set([...s,id])):s.filter(x=>x!==id));
  const dragSel=useDragSelect(setSelVal);
  // 전체선택 (모든 배송일 대상)
  const selAllList=()=>setSel(s=>s.length===locals.length&&locals.length>0?[]:locals.map(o=>o.id));
  // 날짜별 선택
  const dateGroups=useMemo(()=>{
    const m={};
    locals.forEach(o=>{(m[o.배송일]=m[o.배송일]||[]).push(o);});
    return Object.keys(m).sort().map(d=>({date:d,ids:m[d].map(o=>o.id)}));
  },[locals]);
  const selDate=(ids)=>setSel(s=>{
    const all=ids.every(id=>s.includes(id));
    return all?s.filter(id=>!ids.includes(id)):Array.from(new Set([...s,...ids]));
  });

  // 행 이동 (분할배송/합배송 순서 조정)
  const move=(idx,dir)=>{
    setLocals(ls=>{
      const ni=idx+dir;
      if(ni<0||ni>=ls.length)return ls;
      const copy=[...ls];[copy[idx],copy[ni]]=[copy[ni],copy[idx]];
      dirty.current=true;return copy;
    });
  };

  // 행 사이 추가 (분할배송용 새 행)
  const addRow=(idx)=>{
    const base=locals[idx];
    const nw={...emptyOrder(currentUser),배송일:today,배송방법:"택배",
      주문자:base?base.주문자:"",연락처:base?base.연락처:"",연락처2:base?base.연락처2:"",
      주소:base?base.주소:"",상품명:PRODUCTS[0],수량:1};
    setLocals(ls=>{const copy=[...ls];copy.splice(idx+1,0,nw);dirty.current=true;return copy;});
    notify("➕ 아래에 새 주문 행을 추가했습니다.");
  };

  const delRow=(o)=>setConfirmDel(o);
  // 선택 삭제 (주문 자체를 삭제)
  const deleteSelected=(ids)=>{
    const set=new Set(ids);
    onSave(orders.filter(o=>!set.has(o.id)));
    setLocals(ls=>ls.filter(o=>!set.has(o.id)));
    setSel(s=>s.filter(id=>!set.has(id)));
    setConfirmDel(null);setConfirmDelMany(false);
    notify(`🗑️ ${ids.length}건을 삭제했습니다.`);
  };

  const saveAll=async()=>{
    const locals2=locals;
    const localIds=new Set(locals2.map(o=>o.id));
    // 갱신 대상: 현재 리스트에 보이던 송장대기 택배(다운 완료된 건은 건드리지 않음)
    const activeIds=new Set(orders.filter(o=>o.배송방법==="택배"&&o.상태==="송장대기"&&!o.invoiceExported).map(o=>o.id));
    let merged=orders.map(o=>{
      const l=locals2.find(x=>x.id===o.id);
      return l?{...l,updatedBy:currentUser.name,updatedAt:nowStr()}:o;
    });
    merged=merged.filter(o=>!(activeIds.has(o.id)&&!localIds.has(o.id)));
    const existing=new Set(orders.map(o=>o.id));
    const news=locals2.filter(o=>!existing.has(o.id)).map(o=>({...o,updatedBy:currentUser.name,updatedAt:nowStr()}));
    await onSave([...merged,...news]);
    dirty.current=false;notify("✅ 송장 정보가 저장되었습니다.");
  };

  // 엑셀 다운 (rows 지정 시 그 항목만) → 하단 아카이브(날짜별)로 이동
  // 송장 엑셀 1행 생성 (주문자·수취인 비교로 발송인/수취인/배송메모1 자동 기재)
  // 합배송: 같은 mergeId 또는 '합배송' 표기+같은 주문자명은 1건으로 / 분할배송: splits만큼 여러 건
  const expandForInvoice=(list)=>{
    const rows=[];
    const seenMerge=new Set();
    const seenAuto=new Set();
    const hasMerge=(o)=>specArr(o.특이사항).includes("합배송");
    list.forEach(o=>{
      // 1) 수동 합배송 그룹 (mergeId)
      if(o.mergeId){
        if(seenMerge.has(o.mergeId))return;
        seenMerge.add(o.mergeId);
        const group=list.filter(x=>x.mergeId===o.mergeId);
        const primary=group[0];
        const names=group.map(g=>buildProductName(g)).join(" + ");
        rows.push({...primary,_invName:names,_ship:resolveShipping(primary)});
        return;
      }
      // 2) 자동 합배송: '합배송' 표기 + 같은 주문자명 → 1건 (주소/연락처/수취인은 대표 기준)
      if(hasMerge(o)){
        const key=(o.주문자||"").trim();
        if(seenAuto.has(key))return;
        seenAuto.add(key);
        const group=list.filter(x=>hasMerge(x)&&(x.주문자||"").trim()===key);
        const primary=group[0];
        const names=group.map(g=>buildProductName(g)).join(" + ");
        rows.push({...primary,_invName:names,_ship:resolveShipping(primary)});
        return;
      }
      // 3) 분할배송: 추가 배송지마다 행 생성 (수량·배송일도 나눔)
      const splits=Array.isArray(o.splits)?o.splits.filter(s=>(s.수취인||s.주소||s.연락처)):[];
      if(splits.length){
        const splitQtySum=splits.reduce((s,x)=>s+(parseInt(x.수량)||0),0);
        const baseQty=Math.max(1,(o.수량||1)-splitQtySum);
        const dests=[{수취인:o.수취인,연락처:o.연락처,연락처2:o.연락처2,주소:o.주소,수량:baseQty,배송일:o.배송일},...splits];
        dests.forEach((d,i)=>{
          const merged={...o,수취인:d.수취인||o.주문자,연락처:d.연락처||"",연락처2:d.연락처2||"",주소:d.주소||"",수량:parseInt(d.수량)||1,배송일:d.배송일||o.배송일};
          rows.push({...merged,_invName:buildProductName(merged)+(dests.length>1?` (${i+1}/${dests.length})`:""),_ship:resolveShipping(merged)});
        });
        return;
      }
      // 4) 일반
      rows.push({...o,_invName:buildProductName(o),_ship:resolveShipping(o)});
    });
    return rows;
  };

  const invoiceRow=(o)=>{
    const a=o._ship||resolveShipping(o);
    return {
      상품명:o._invName||buildProductName(o),
      발송인:a.발송인,
      수취인:a.수취인,
      연락처:o.연락처||"",연락처2:o.연락처2||"",
      주소:o.주소||"",
      배송메모:a.배송메모||o.배송메모||"",
      배송메모2:o.배송메모2||"",
    };
  };

  const exportExcel=(rows,label)=>{
    const target=rows&&rows.length?rows:locals;
    if(!target.length){notify("내보낼 데이터가 없습니다.","warn");return;}
    try{
      const data=expandForInvoice(target).map(invoiceRow);
      const ws=XLSX.utils.json_to_sheet(data);
      ws["!cols"]=[{wch:42},{wch:12},{wch:10},{wch:14},{wch:14},{wch:30},{wch:16},{wch:16}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"송장입력");
      XLSX.writeFile(wb,`원사부_송장_${today}${label?"_"+label:""}.xlsx`);
      // 다운된 항목 → invoiceExported 플래그 기록 (하단 아카이브로 이동, 배송완료)
      const ids=new Set(target.map(o=>o.id));
      setSel([]);
      onSave(orders.map(o=>ids.has(o.id)?{...o,상태:"배송완료",invoiceExported:true,invoiceExportedAt:nowStr(),updatedBy:currentUser.name,updatedAt:nowSec()}:o));
      notify(`📊 ${data.length}건 엑셀 다운 완료 · 하단 목록으로 이동했습니다.`);
    }catch(e){notify("엑셀 생성 중 오류가 발생했습니다.","error");}
  };

  // ── 아카이브 액션 ──
  const toggleAd=(d)=>setOpenDates(m=>({...m,[d]:!m[d]}));
  const adSelOne=(id)=>setAdSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const setAdSelVal=(id,val)=>setAdSel(s=>val?Array.from(new Set([...s,id])):s.filter(x=>x!==id));
  const adDrag=useDragSelect(setAdSelVal);
  const adSelAll=()=>setAdSel(s=>{
    const ids=archived.map(o=>o.id);
    const all=ids.length>0&&ids.every(id=>s.includes(id));
    return all?[]:ids;
  });
  const adSelDate=(items)=>setAdSel(s=>{
    const ids=items.map(o=>o.id);
    const all=ids.every(id=>s.includes(id));
    return all?s.filter(id=>!ids.includes(id)):Array.from(new Set([...s,...ids]));
  });
  // 재출력: 아카이브 항목만 다시 엑셀로
  const reExport=(items,label)=>{
    if(!items.length)return;
    try{
      const data=expandForInvoice(items).map(invoiceRow);
      const ws=XLSX.utils.json_to_sheet(data);
      ws["!cols"]=[{wch:42},{wch:12},{wch:10},{wch:14},{wch:14},{wch:30},{wch:16},{wch:16}];
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"송장입력");
      XLSX.writeFile(wb,`원사부_송장_재출력_${label||today}.xlsx`);
      notify(`📊 ${data.length}건을 재출력했습니다.`);
    }catch(e){notify("재출력 중 오류가 발생했습니다.","error");}
  };
  const saveArchiveEdit=(saved)=>{
    onSave(orders.map(o=>o.id===saved.id?{...saved,updatedBy:currentUser.name,updatedAt:nowSec()}:o));
    setEditModal(null);notify("✅ 수정되었습니다.");
  };
  // 주문서로 이동(취소 및 변경): 상태 주문접수로 되돌리고 다운 기록 해제
  const backToOrder=(o)=>{
    onSave(orders.map(x=>x.id===o.id?{...x,상태:"주문접수",invoiceExported:false,invoiceExportedAt:null,labelPrinted:false,updatedBy:currentUser.name,updatedAt:nowSec()}:x));
    notify(`↩️ '${o.주문자}'님 주문을 주문서로 되돌렸습니다.`);
  };

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
        <div>
          <h2 style={{margin:0,fontSize:22,fontWeight:600,color:C.amberDark}}>송장 입력</h2>
          <p style={{margin:"2px 0 0",fontSize:12,color:C.gray}}>택배 · {locals.length}건 · 날짜별로 선택해 출력하세요 · <span style={{color:"#9a5b00",fontWeight:600}}>주황색</span>은 오늘이 아닌 배송일 · 엑셀 다운 시 하단 목록으로 이동</p>
        </div>
        <div style={{flex:1}}/>
        {sel.length>0&&<>
          <button onClick={()=>exportExcel(locals.filter(o=>sel.includes(o.id)),"선택")} style={btn("#1d1d1f")}>📊 선택 다운({sel.length})</button>
          <button onClick={()=>setConfirmDelMany(true)} style={btn(C.white,{color:C.error,border:`1px solid ${C.error}`})}>🗑️ 선택 삭제({sel.length})</button>
        </>}
        <button onClick={()=>exportExcel()} style={btn(C.success)}>📊 전체 엑셀 다운({locals.length})</button>
        {canEdit&&<button onClick={()=>addRow(locals.length-1)} style={btn(C.amber)}>➕ 행 추가</button>}
        {canEdit&&<button onClick={saveAll} style={btn(C.amber,{fontWeight:600})}>💾 전체 저장</button>}
      </div>

      {dateGroups.length>0&&(
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:12,padding:"8px 12px",background:C.parchment,borderRadius:10}}>
          <span style={{fontSize:12,fontWeight:600,color:C.gray,marginRight:2}}>날짜별 선택:</span>
          {dateGroups.map(g=>{
            const allSel=g.ids.every(id=>sel.includes(id));
            return(
              <button key={g.date} onClick={()=>selDate(g.ids)}
                style={{border:`1px solid ${allSel?C.amber:C.border}`,background:allSel?C.amber:C.white,color:allSel?"#fff":(g.date===today?"#0066cc":C.ink),borderRadius:980,fontSize:12,fontWeight:600,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit"}}>
                {allSel?"✓ ":""}{shortDate(g.date)}{g.date===today?" (오늘)":""} · {g.ids.length}
              </button>
            );
          })}
        </div>
      )}

      {locals.length===0?(
        <div style={{background:C.white,borderRadius:18,padding:48,textAlign:"center",color:C.gray,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:40,marginBottom:8}}>📦</div>
          출고할 택배 주문이 없습니다. (오늘 출고 또는 포장완료 택배 건이 여기 표시됩니다)
          {canEdit&&<div style={{marginTop:12}}><button onClick={()=>addRow(-1)} style={btn(C.amber)}>➕ 새 행 추가</button></div>}
        </div>
      ):(
        <div style={{background:C.white,borderRadius:18,overflow:"hidden",border:`1px solid ${C.border}`}}>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:1060}}>
              <thead>
                <tr>
                  <th style={{...TH,width:40,textAlign:"center"}} title="전체선택">
                    {locals.length>0&&<input type="checkbox" style={CHK}
                      checked={sel.length===locals.length&&locals.length>0}
                      onChange={selAllList}/>}
                  </th>
                  <th style={{...TH,width:70,textAlign:"center"}}>순서</th>
                  <th style={TH}>상품명 (자동합성)</th>
                  <th style={TH}>발송인</th>
                  <th style={TH}>수취인</th>
                  <th style={TH}>연락처</th>
                  <th style={TH}>연락처2</th>
                  <th style={TH}>주소</th>
                  <th style={TH}>배송메모</th>
                  <th style={TH}>배송메모2</th>
                  <th style={{...TH,width:110,textAlign:"center"}}>관리</th>
                </tr>
              </thead>
              <tbody>
                {locals.map((o,i)=>{
                  const isToday=o.배송일===today;
                  return(
                  <tr key={o.id} style={{background:sel.includes(o.id)?"#eef4ff":(!isToday?"#fff7ee":(i%2===0?C.white:"#FAFAFA"))}}>
                    <td style={chkCell}
                      onMouseDown={()=>dragSel.start(o.id,sel.includes(o.id))}
                      onMouseEnter={()=>dragSel.enter(o.id)}>
                      <input type="checkbox" style={CHK} readOnly checked={sel.includes(o.id)}/>
                    </td>
                    <td style={{...TD,textAlign:"center"}}>
                      <div style={{display:"flex",flexDirection:"column",gap:2,alignItems:"center"}}>
                        <button onClick={()=>move(i,-1)} disabled={i===0} style={{border:"none",background:i===0?"#f0f0f0":C.amberLight,color:i===0?"#c7c7cc":C.amberDark,borderRadius:4,cursor:i===0?"default":"pointer",fontSize:11,padding:"1px 6px",fontFamily:"inherit"}}>▲</button>
                        <span style={{fontSize:11,color:C.gray}}>{i+1}</span>
                        <button onClick={()=>move(i,1)} disabled={i===locals.length-1} style={{border:"none",background:i===locals.length-1?"#f0f0f0":C.amberLight,color:i===locals.length-1?"#c7c7cc":C.amberDark,borderRadius:4,cursor:i===locals.length-1?"default":"pointer",fontSize:11,padding:"1px 6px",fontFamily:"inherit"}}>▼</button>
                        <span style={{fontSize:10,color:!isToday?"#9a5b00":C.gray,fontWeight:!isToday?700:400,marginTop:2}}>{(o.배송일||"").slice(5)}</span>
                      </div>
                    </td>
                    <td style={{...TD,minWidth:280}}>
                      <div style={{fontSize:12,fontWeight:700,color:C.amberDark,marginBottom:4,lineHeight:1.4,wordBreak:"keep-all"}}>{buildProductName(o)}</div>
                      <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                        <select value={o.상품명} onChange={e=>upd(o.id,"상품명",e.target.value)} style={{...inp,width:"auto",fontSize:11,padding:"3px 6px"}} disabled={!canEdit}>
                          {PRODUCTS.map(p=><option key={p} value={p}>{p}</option>)}
                        </select>
                        <select value={o.박스||""} onChange={e=>upd(o.id,"박스",e.target.value)} style={{...inp,width:"auto",fontSize:11,padding:"3px 6px"}} disabled={!canEdit}>
                          {BOXES.map(b=><option key={b||"n"} value={b}>{b||"박스-"}</option>)}
                        </select>
                        <select value={o.스티커||""} onChange={e=>upd(o.id,"스티커",e.target.value)} style={{...inp,width:"auto",fontSize:11,padding:"3px 6px"}} disabled={!canEdit}>
                          {STICKERS.map(s=><option key={s||"n"} value={s}>{s||"스티커-"}</option>)}
                        </select>
                        <input type="number" min={1} value={o.수량} onChange={e=>upd(o.id,"수량",Math.max(1,+e.target.value||1))} style={{...inp,width:52,fontSize:11,padding:"3px 6px"}} disabled={!canEdit}/>
                      </div>
                    </td>
                    <td style={{...TD,textAlign:"center"}}><span style={{fontSize:12,fontWeight:600,color:resolveShipping(o).발송인==="(주)원사부"?C.gray:"#c0348a"}}>{resolveShipping(o).발송인}</span></td>
                    <td style={TD}><input value={o.수취인||""} onChange={e=>upd(o.id,"수취인",e.target.value)} style={{...inp,width:90,fontSize:12}} placeholder={o.주문자} disabled={!canEdit}/></td>
                    <td style={TD}><input value={o.연락처||""} onChange={e=>upd(o.id,"연락처",e.target.value)} style={{...inp,width:118,fontSize:12}} placeholder="010-" disabled={!canEdit}/></td>
                    <td style={TD}><input value={o.연락처2||""} onChange={e=>upd(o.id,"연락처2",e.target.value)} style={{...inp,width:118,fontSize:12}} placeholder="추가" disabled={!canEdit}/></td>
                    <td style={TD}><input value={o.주소||""} onChange={e=>upd(o.id,"주소",e.target.value)} style={{...inp,width:180,fontSize:12}} placeholder="주소" disabled={!canEdit}/></td>
                    <td style={TD}><input value={resolveShipping(o).배송메모||o.배송메모||""} onChange={e=>upd(o.id,"배송메모",e.target.value)} style={{...inp,width:150,fontSize:12}} placeholder="선물이면 자동" disabled={!canEdit}/></td>
                    <td style={TD}><input value={o.배송메모2||""} onChange={e=>upd(o.id,"배송메모2",e.target.value)} style={{...inp,width:120,fontSize:12}} placeholder="메모2" disabled={!canEdit}/></td>
                    <td style={{...TD,textAlign:"center"}}>
                      {canEdit?(
                      <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                        <button onClick={()=>addRow(i)} title="아래에 행 추가" style={{padding:"3px 9px",background:C.amber,color:"#fff",border:"none",borderRadius:8,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>+</button>
                        <button onClick={()=>delRow(o)} style={{padding:"3px 9px",background:C.error,color:"#fff",border:"none",borderRadius:8,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>삭제</button>
                      </div>
                      ):<span style={{fontSize:11,color:"#a1a1a6"}}>-</span>}
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{padding:"10px 16px",background:"#eef4ff",borderTop:`1px solid ${C.border}`,fontSize:12,color:"#0058b8"}}>
            💡 상품명은 <strong>{PREFIX}상품명 박스 스티커 수량개</strong> 형식으로 자동 생성됩니다. 저장 후 엑셀로 내려받아 택배사 양식에 붙여넣으세요.
          </div>
        </div>
      )}

      {confirmDel&&(
        <ConfirmDialog
          msg={`'${confirmDel.주문자||"이 "}'님의 송장 행을 삭제하시겠습니까?\n주문서에서도 삭제됩니다.`}
          onYes={()=>{
            setLocals(ls=>ls.filter(x=>x.id!==confirmDel.id));
            dirty.current=true;setConfirmDel(null);
            notify("🗑️ 행이 삭제되었습니다. [전체 저장]을 눌러 반영하세요.","warn");
          }}
          onNo={()=>setConfirmDel(null)}
        />
      )}
      {confirmDelMany&&(
        <ConfirmDialog
          msg={`선택한 ${sel.length}건을 삭제하시겠습니까?\n주문서에서도 완전히 삭제되며 되돌릴 수 없습니다.`}
          onYes={()=>deleteSelected(sel)}
          onNo={()=>setConfirmDelMany(false)}
        />
      )}

      {/* ── 엑셀 다운 완료 아카이브 (날짜별, 기본 접힘) ── */}
      {archived.length>0&&(
        <div style={{marginTop:24}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:C.ink}}>📁 송장 다운 완료</h3>
            <span style={{fontSize:12,color:C.gray}}>총 {archived.length}건 · 날짜별 정리 · 재출력{isAdmin?" / 수정 / 주문서로 이동":""}{!isAdmin&&<span style={{color:"#9a5b00"}}> · 🔒 수정·주문서 이동은 관리자만</span>}</span>
            <div style={{flex:1}}/>
            <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:C.gray,cursor:"pointer"}}>
              <input type="checkbox" style={CHK} checked={archived.length>0&&archived.every(o=>adSel.includes(o.id))} onChange={adSelAll}/>
              전체선택
            </label>
            {adSel.length>0&&<button onClick={()=>reExport(archived.filter(o=>adSel.includes(o.id)),"선택")} style={{border:`1px solid ${C.success}`,background:C.success,color:"#fff",borderRadius:980,fontSize:12,fontWeight:600,padding:"5px 14px",cursor:"pointer",fontFamily:"inherit"}}>📊 선택 재출력({adSel.length})</button>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {archiveByDate.map(({date,items})=>{
              const open=!!openDates[date];
              const dateAllSel=items.length>0&&items.every(o=>adSel.includes(o.id));
              return(
                <div key={date} style={{border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",background:C.white}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:C.parchment,flexWrap:"wrap"}}>
                    <input type="checkbox" style={CHK} checked={dateAllSel} onChange={()=>adSelDate(items)} title="이 날짜 전체선택"/>
                    <button onClick={()=>toggleAd(date)} style={{border:"none",background:"none",cursor:"pointer",color:C.ink,fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:6}}>
                      <span style={{display:"inline-block",transform:open?"none":"rotate(-90deg)",transition:"transform 0.15s"}}>▼</span>
                      📅 {date}
                    </button>
                    <span style={{fontSize:12,color:C.gray}}>{items.length}건</span>
                    <div style={{flex:1}}/>
                    <button onClick={()=>reExport(items,date)} style={{border:`1px solid ${C.success}`,background:C.white,color:C.success,borderRadius:980,fontSize:12,fontWeight:600,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit"}}>📊 이 날짜 재출력</button>
                  </div>
                  {open&&(
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",minWidth:800}}>
                        <thead><tr>
                          <th style={{...TH,width:40,textAlign:"center"}}><input type="checkbox" style={CHK} checked={dateAllSel} onChange={()=>adSelDate(items)}/></th>
                          <th style={{...TH,minWidth:220}}>상품명</th>
                          <th style={TH}>수취인</th>
                          <th style={TH}>연락처</th>
                          <th style={TH}>주소</th>
                          <th style={{...TH,width:230,textAlign:"center"}}>관리</th>
                        </tr></thead>
                        <tbody>
                          {items.map((o,i)=>(
                            <tr key={o.id} style={{background:adSel.includes(o.id)?"#eef8f0":(i%2===0?C.white:"#FAFAFA")}}>
                              <td style={chkCell}
                                onMouseDown={()=>adDrag.start(o.id,adSel.includes(o.id))}
                                onMouseEnter={()=>adDrag.enter(o.id)}>
                                <input type="checkbox" style={CHK} readOnly checked={adSel.includes(o.id)}/>
                              </td>
                              <td style={{...TD,fontSize:12,color:C.amberDark,fontWeight:600}}>{buildProductName(o)}</td>
                              <td style={TD}>{o.주문자}</td>
                              <td style={{...TD,fontSize:12}}>{o.연락처||"-"}</td>
                              <td style={{...TD,fontSize:12,color:C.gray}}>{o.주소||"-"}</td>
                              <td style={{...TD,textAlign:"center"}}>
                                <div style={{display:"flex",gap:5,justifyContent:"center",flexWrap:"wrap"}}>
                                  <button onClick={()=>reExport([o],date)} style={{border:`1px solid ${C.success}`,background:C.white,color:C.success,borderRadius:8,fontSize:11,fontWeight:600,padding:"4px 9px",cursor:"pointer",fontFamily:"inherit"}}>재출력</button>
                                  {isAdmin&&<button onClick={()=>setEditModal(o)} style={{border:`1px solid ${C.border}`,background:C.white,color:C.ink,borderRadius:8,fontSize:11,fontWeight:600,padding:"4px 9px",cursor:"pointer",fontFamily:"inherit"}}>수정</button>}
                                  {isAdmin&&<button onClick={()=>backToOrder(o)} style={{border:`1px solid ${C.amber}`,background:C.white,color:C.amber,borderRadius:8,fontSize:11,fontWeight:600,padding:"4px 9px",cursor:"pointer",fontFamily:"inherit"}}>↩️ 주문서로</button>}
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {editModal&&<OrderModal order={editModal} onSave={saveArchiveEdit} onClose={()=>setEditModal(null)} currentUser={currentUser} notify={notify}/>}
    </div>
  );
}

// ===================== DELIVERY LABEL TAB =====================
function DeliveryLabelTab({orders,onSave,notify,currentUser}) {
  const today=todayStr();
  // 인쇄 대기: 포장에서 넘어온 비택배(송장대기) 중 아직 라벨 인쇄 안 한 건
  const active=useMemo(()=>orders
    .filter(o=>o.배송방법!=="택배"&&o.상태==="송장대기"&&!o.labelPrinted)
    .sort((a,b)=>(a.배송일||"").localeCompare(b.배송일||"")||((a.seq||0)-(b.seq||0)))
  ,[orders]);
  // 인쇄 완료 아카이브: 라벨 인쇄된 건 (월별 정리)
  const archived=useMemo(()=>orders.filter(o=>o.labelPrinted),[orders]);
  const [sel,setSel]=useState([]);
  const [editModal,setEditModal]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const [openMonths,setOpenMonths]=useState({});
  const selOne=(id)=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const selAll=()=>setSel(s=>s.length===active.length&&active.length>0?[]:active.map(o=>o.id));
  const setSelVal=(id,val)=>setSel(s=>val?Array.from(new Set([...s,id])):s.filter(x=>x!==id));
  const dragSel=useDragSelect(setSelVal);

  const tone={
    "퀵":{bg:"#FFF7E6",bd:"#F59E0B",tx:"#1d1d1f",badge:{bg:"#F59E0B",color:"#fff"}},
    "방문수령":{bg:"#e6f5ea",bd:"#059669",tx:"#1c7a34",badge:{bg:"#059669",color:"#fff"}},
    "직접배송":{bg:"#F5F0FF",bd:"#7C3AED",tx:"#4b45c6",badge:{bg:"#7C3AED",color:"#fff"}},
    "택배":{bg:"#eef4ff",bd:"#0058b8",tx:"#0058b8",badge:{bg:"#0058b8",color:"#fff"}},
  };

  // 라벨 HTML 인쇄 (target 주문 배열)
  const doPrint=(target)=>{
    if(!target.length){notify("출력할 라벨을 선택하세요.","warn");return;}
    printHTML(`<html><head><title>원사부쿠키 배송 라벨</title>
    <style>
    @page{size:A4 landscape;margin:0}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:sans-serif}
    .page{width:297mm;height:210mm;padding:12mm;page-break-after:always;display:flex;align-items:stretch;justify-content:stretch;overflow:hidden}
    .page:last-child{page-break-after:auto}
    .label{width:100%;height:100%;border:3px solid #333;border-radius:6mm;padding:14mm;display:flex;flex-direction:column}
    .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8mm;padding-bottom:6mm;border-bottom:3px solid}
    .ddate{font-size:38px;font-weight:900}.dtype{font-size:24px;font-weight:800;color:#fff;padding:6px 24px;border-radius:26px}
    .row{margin:5mm 0;font-size:26px;display:flex;gap:12px}.rk{font-weight:700;color:#555;min-width:90px}.rv{flex:1;word-break:break-all}
    .name{font-size:58px;font-weight:900;color:#111;margin:6mm 0}
    .product{border-radius:4mm;padding:6mm 8mm;font-size:26px;font-weight:700;margin-top:auto}
    .memo{margin-top:5mm;font-size:24px}
    </style></head><body>
    ${target.map(o=>{const t=tone[o.배송방법]||{bg:"#fff",bd:"#333",tx:"#111"};return `<div class="page"><div class="label" style="background:${t.bg};border-color:${t.bd}">
    <div class="hdr" style="border-color:${t.bd}"><span class="ddate" style="color:${t.tx}">📅 ${o.배송일||""}</span>
    <span class="dtype" style="background:${t.bd}">${o.배송방법}</span></div>
    <div class="name">${o.주문자}</div>
    <div class="row"><span class="rk">연락처</span><span class="rv">${o.연락처||"-"}${o.연락처2?` / ${o.연락처2}`:""}</span></div>
    <div class="row"><span class="rk">주소</span><span class="rv">${o.주소||"-"}</span></div>
    ${o.배송메모||o.배송메모2?`<div class="row"><span class="rk">메모</span><span class="rv">${[o.배송메모,o.배송메모2].filter(Boolean).join(" / ")}</span></div>`:""}
    <div class="product" style="background:#fff;border:1px solid ${t.bd};color:${t.tx}">📦 ${o.상품명}${o.추가?` + ${o.추가}`:""} × ${o.수량}개${o.박스?` / ${o.박스}박스`:""}${o.스티커?` / 스티커:${o.스티커}`:""}</div>
    ${o.문구?`<div class="memo" style="color:${t.tx}">💌 "${o.문구}"</div>`:""}
    </div></div>`;}).join("")}
    </body></html>`);
  };

  // 인쇄 → 배송완료 + labelPrinted 기록 (하단 아카이브로 이동)
  const printAndArchive=()=>{
    const target=sel.length?active.filter(o=>sel.includes(o.id)):active;
    if(!target.length){notify("출력할 라벨을 선택하세요.","warn");return;}
    doPrint(target);
    const ids=new Set(target.map(o=>o.id));
    onSave(orders.map(o=>ids.has(o.id)?{...o,상태:"배송완료",labelPrinted:true,updatedBy:currentUser.name,updatedAt:nowSec()}:o));
    setSel([]);
    notify(`🖨️ ${target.length}건 인쇄 완료 · 하단 목록으로 이동했습니다.`);
  };
  // 재인쇄 (아카이브에서)
  const reprint=(o)=>{ doPrint([o]); notify("🖨️ 재인쇄합니다."); };
  // 아카이브 삭제 (주문 자체 삭제)
  const delArchived=(o)=>{ onSave(orders.filter(x=>x.id!==o.id)); setConfirmDel(null); notify("🗑️ 삭제했습니다."); };
  const saveEdit=(saved)=>{ onSave(orders.map(o=>o.id===saved.id?saved:o)); setEditModal(null); notify("✅ 수정되었습니다."); };

  // 아카이브 월별 그룹
  const archMonths=useMemo(()=>{
    const m={};
    archived.forEach(o=>{const ym=(o.배송일||"").slice(0,7)||"기타";(m[ym]=m[ym]||[]).push(o);});
    Object.values(m).forEach(arr=>arr.sort((a,b)=>(a.배송일||"").localeCompare(b.배송일||"")||((a.seq||0)-(b.seq||0))));
    return m;
  },[archived]);
  const monthKeys=Object.keys(archMonths).sort((a,b)=>b.localeCompare(a));

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
        <div>
          <h2 style={{margin:0,fontSize:22,fontWeight:600,color:C.amberDark}}>배송 라벨</h2>
          <p style={{margin:"2px 0 0",fontSize:12,color:C.gray}}>포장에서 넘어온 퀵·방문수령·직접배송 {active.length}건 · 인쇄하면 하단 목록으로 이동</p>
        </div>
        <div style={{flex:1}}/>
        {active.length>0&&<button onClick={selAll} style={btn(C.white,{color:C.amber,border:`1px solid ${C.amber}`})}>{sel.length===active.length?"전체 해제":"전체 선택"}</button>}
        {active.length>0&&<button onClick={printAndArchive} style={btn(C.amber,{fontWeight:600})}>🖨️ 라벨 인쇄 → 완료 ({sel.length||active.length})</button>}
      </div>

      {active.length===0?(
        <div style={{background:C.white,borderRadius:18,padding:40,textAlign:"center",color:C.gray,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:40,marginBottom:8}}>🚚</div>
          인쇄 대기 중인 배송 라벨이 없습니다. (포장에서 택배가 아닌 건을 완료하면 이곳으로 넘어옵니다)
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14}}>
          {active.map(o=>{
            const t=tone[o.배송방법]||{bg:C.white,bd:C.border,tx:"#111",badge:{bg:"#888",color:"#fff"}};
            const on=sel.includes(o.id);
            return(
              <div key={o.id} onClick={()=>selOne(o.id)} style={{background:t.bg,borderRadius:18,border:`2.5px solid ${on?C.amber:t.bd}`,padding:20,cursor:"pointer",position:"relative",boxShadow:on?"0 0 0 3px rgba(0,102,204,0.18)":"none"}}>
                <div style={{position:"absolute",top:12,right:12,width:22,height:22,borderRadius:6,border:on?"none":`2px solid ${t.bd}`,background:on?C.amber:"transparent",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900}}>{on?"✓":""}</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,paddingBottom:8,borderBottom:`2px solid ${t.bd}`,paddingRight:28}}>
                  <span style={{fontWeight:700,color:t.tx,fontSize:16}}>📅 {o.배송일}</span>
                  <span style={{padding:"3px 12px",borderRadius:20,fontSize:12,fontWeight:600,background:t.badge.bg,color:t.badge.color}}>{o.배송방법}</span>
                </div>
                <div style={{fontSize:20,fontWeight:700,color:"#111",marginBottom:4}}>{o.주문자}</div>
                <div style={{fontSize:13,color:"#1d1d1f",marginBottom:3}}>{o.연락처||"연락처 없음"}{o.연락처2?` / ${o.연락처2}`:""}</div>
                <div style={{fontSize:13,color:"#1d1d1f",marginBottom:8,lineHeight:1.4}}>{o.주소||"주소 없음"}</div>
                <div style={{background:C.white,borderRadius:8,padding:"8px 12px",fontSize:13,fontWeight:700,color:t.tx,border:`1px solid ${t.bd}`}}>
                  📦 {o.상품명}{o.추가?` +${o.추가}`:""} × {o.수량}개{o.박스?` / ${o.박스}`:""}{o.스티커?` / 스티커:${o.스티커}`:""}
                </div>
                {o.문구&&<div style={{marginTop:6,fontSize:12,color:t.tx}}>💌 {o.문구}</div>}
                {(o.배송메모||o.배송메모2)&&<div style={{marginTop:4,fontSize:12,color:C.gray}}>📝 {[o.배송메모,o.배송메모2].filter(Boolean).join(" / ")}</div>}
              </div>
            );
          })}
        </div>
      )}

      {/* ===== 인쇄 완료 아카이브 (월별) ===== */}
      {monthKeys.length>0&&(
        <div style={{marginTop:28}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:C.ink}}>🗂️ 인쇄 완료 내역</h3>
            <span style={{fontSize:12,color:C.gray}}>총 {archived.length}건 · 월별 정리 · 수정 · 삭제 · 재인쇄</span>
          </div>
          {monthKeys.map(ym=>{
            const arr=archMonths[ym];
            const open=openMonths[ym]!==false; // 기본 펼침
            return(
              <div key={ym} style={{marginBottom:12,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
                <div onClick={()=>setOpenMonths(m=>({...m,[ym]:!open}))}
                  style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:C.parchment,cursor:"pointer"}}>
                  <span style={{transform:open?"none":"rotate(-90deg)",transition:"transform 0.15s",color:C.amber}}>▼</span>
                  <span style={{fontWeight:700,color:C.amberDark}}>{ym}</span>
                  <span style={{fontSize:12,color:C.gray}}>{arr.length}건</span>
                </div>
                {open&&(
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",minWidth:720}}>
                      <thead><tr>
                        <th style={TH}>배송일</th><th style={TH}>방법</th><th style={TH}>주문자</th><th style={TH}>상품</th>
                        <th style={TH}>연락처</th><th style={TH}>주소</th><th style={{...TH,width:170,textAlign:"center"}}>관리</th>
                      </tr></thead>
                      <tbody>
                        {arr.map((o,i)=>(
                          <tr key={o.id} style={{background:i%2===0?C.white:"#FAFAFA"}}>
                            <td style={TD}>{o.배송일}</td>
                            <td style={TD}><Badge text={o.배송방법} style={deliveryStyle[o.배송방법]}/></td>
                            <td style={{...TD,fontWeight:700}}>{o.주문자}</td>
                            <td style={TD}>{o.상품명}{o.추가?` +${o.추가}`:""} ×{o.수량}</td>
                            <td style={TD}>{o.연락처||"-"}</td>
                            <td style={{...TD,maxWidth:220,fontSize:12}}>{o.주소||"-"}</td>
                            <td style={{...TD,textAlign:"center",whiteSpace:"nowrap"}}>
                              <button onClick={()=>reprint(o)} style={{border:`1px solid ${C.amber}`,background:C.white,color:C.amber,borderRadius:7,fontSize:11,padding:"4px 8px",cursor:"pointer",marginRight:4,fontFamily:"inherit"}}>🖨️ 재인쇄</button>
                              <button onClick={()=>setEditModal(o)} style={{border:`1px solid ${C.border}`,background:C.white,color:"#1d1d1f",borderRadius:7,fontSize:11,padding:"4px 8px",cursor:"pointer",marginRight:4,fontFamily:"inherit"}}>✏️ 수정</button>
                              <button onClick={()=>setConfirmDel(o)} style={{border:`1px solid ${C.error}`,background:C.white,color:C.error,borderRadius:7,fontSize:11,padding:"4px 8px",cursor:"pointer",fontFamily:"inherit"}}>🗑️</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {editModal&&<OrderModal order={editModal} matrix={{}} onClose={()=>setEditModal(null)} onSave={saveEdit} currentUser={currentUser} notify={notify}/>}
      {confirmDel&&<ConfirmDialog msg={`'${confirmDel.주문자}'님의 배송 라벨 내역을 삭제하시겠습니까?\n주문서에서도 삭제됩니다.`} onYes={()=>delArchived(confirmDel)} onNo={()=>setConfirmDel(null)}/>}
    </div>
  );
}

// ===================== USER SETTINGS (내 정보 변경 + 관리자 직원 관리) =====================
function UserSettings({users,currentUser,onSave,onSelf,onClose,notify}) {
  const me = users.find(u=>u.id===currentUser.id) || currentUser;
  const isAdmin = currentUser.role==="admin";
  const [name,setName]=useState(me.name||"");
  const [pw,setPw]=useState(me.password||"");
  const [pw2,setPw2]=useState(me.password||"");
  const [tab,setTab]=useState("me");         // me | staff (관리자만)
  const [edit,setEdit]=useState(null);       // 직원 수정 대상
  const [confirmDel,setConfirmDel]=useState(null);

  const save=async()=>{
    if(!name.trim()){notify("이름을 입력하세요.","warn");return;}
    if(!pw){notify("비밀번호를 입력하세요.","warn");return;}
    if(pw!==pw2){notify("비밀번호가 서로 다릅니다.","warn");return;}
    const updated={...me,name:name.trim(),password:pw};
    await onSave(users.map(u=>u.id===currentUser.id?updated:u));

}

// ===================== 실시간 활동 롤링 알림 =====================
function ActivityTicker({activity,onOpen}) {
  const today=todayStr();
  const items=(activity||[]).filter(a=>a.day===today);
  const [idx,setIdx]=useState(0);
  useEffect(()=>{
    if(items.length<=1)return;
    const iv=setInterval(()=>setIdx(i=>(i+1)%items.length),2800);
    return ()=>clearInterval(iv);
  },[items.length]);
  useEffect(()=>{setIdx(0);},[items.length]);
  if(!items.length)return null;
  const a=items[Math.min(idx,items.length-1)];
  const color=a.type==="등록"?"#4ADE80":a.type==="수정"?"#FBBF24":"#F87171";
  const timePart=(a.at||"").split(" ").slice(-1)[0]||a.at;
  return(
    <div onClick={onOpen} title="클릭하여 전체 활동 내역 보기"
      style={{display:"flex",alignItems:"center",gap:8,marginLeft:12,padding:"4px 12px",background:"rgba(255,255,255,0.1)",borderRadius:980,maxWidth:340,overflow:"hidden",cursor:"pointer"}}>
      <span style={{width:7,height:7,borderRadius:"50%",background:color,flexShrink:0}}/>
      <span style={{fontSize:12,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
        <strong style={{color}}>{a.type}</strong> · {a.name||"-"} · {a.who} <span style={{opacity:0.55}}>{timePart}</span>
      </span>
      <span style={{fontSize:10,opacity:0.5,flexShrink:0}}>{items.length}건 📋</span>
    </div>
  );
}

    <div style={{position:"fixed",inset:0,background:"#00000075",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>

        </div>
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
          <select value={day} onChange={e=>setDay(e.target.value)} style={{...inp,width:"auto",fontSize:13,padding:"6px 10px"}}>
            {(days.length?days:[today]).map(d=><option key={d} value={d}>{d===today?`${d} (오늘)`:d}</option>)}

          <div style={{display:"flex",gap:4}}>
            {["전체","등록","수정","삭제"].map(t=>(
              <button key={t} onClick={()=>setFilter(t)} style={{border:`1px solid ${filter===t?C.amber:C.border}`,background:filter===t?C.amber:C.white,color:filter===t?"#fff":C.gray,borderRadius:980,fontSize:12,fontWeight:600,padding:"5px 12px",cursor:"pointer",fontFamily:"inherit"}}>
                {t}{t!=="전체"?` ${cnt[t]||0}`:""}
              </button>
            ))}
          </div>
        </div>
        {items.length===0?(
          <div style={{padding:"30px",textAlign:"center",color:C.gray,fontSize:13,background:C.parchment,borderRadius:10}}>이 날짜의 활동 내역이 없습니다.</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {items.map(a=>{
              const timePart=(a.at||"").split(" ").slice(-1)[0]||a.at;
              return(
                <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:10}}>
                  <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:980,background:bg(a.type),color:color(a.type),flexShrink:0}}>{a.type}</span>

                    <div style={{fontSize:11,color:C.gray,marginTop:1}}>{a.who} · {a.at}</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
        <p style={{marginTop:12,fontSize:11,color:"#a1a1a6",textAlign:"center"}}>최근 활동 150건까지 보관됩니다.</p>

    </div>
  );
}

// 오늘 변경 요약 → 문자(SMS) 발송용 텍스트 생성
function buildChangeSMS(activity) {
  const today=todayStr();
  const items=(activity||[]).filter(a=>a.day===today);
  if(!items.length)return "";
  const c={등록:0,수정:0,삭제:0};
  items.forEach(a=>{c[a.type]=(c[a.type]||0)+1;});
  const head=`[원사부쿠키] ${today} 변경요약\n등록 ${c.등록} · 수정 ${c.수정} · 삭제 ${c.삭제}`;
  const lines=items.slice(0,10).map(a=>`- ${a.type} ${a.name||""} (${a.who})`).join("\n");
  return head+"\n"+lines+(items.length>10?`\n외 ${items.length-10}건`:"");
}

                  )

    </div>
  );
}

function WeekGoalBar({weeklyGoals,onSaveGoals,currentUser,notify,seed=WEEK1_2026_11_GOALS,title="🎯 주간 목표",unit="개",monday:mondayProp,setMonday:setMondayProp}) {
  const [mondayState,setMondayState]=useState(mondayOf());
  // 상위(탭)에서 주차를 내려주면 그걸 사용 → 바와 아래 표가 같은 주를 봄
  const monday = mondayProp!==undefined ? mondayProp : mondayState;
  const setMonday = setMondayProp || setMondayState;
  const wk = weeklyGoals[monday];
  const goals = wk ? wk.goals : {};
  const [draft,setDraft]=useState(null);
  const editing = draft!==null;
  const isAdmin = currentUser.role==="admin";
  const startEdit = ()=>{
    if(wk) setDraft({...goals});
    else if(monday==="2026-11-02") setDraft({...seed});
    else setDraft(PROD_COOKIES.reduce((a,c)=>({...a,[c]:""}),{}));
  };
  const saveEdit = ()=>{
    const cleaned={}; PROD_COOKIES.forEach(c=>{const n=parseInt(draft[c])||0; if(n)cleaned[c]=n;});
    const entry = { goals:cleaned, 수정자:currentUser.name, 수정시각:nowSec(),
      history:[...(wk&&wk.history||[]), {at:nowSec(), by:currentUser.name, before:goals, after:cleaned}].slice(-20) };
    onSaveGoals({...weeklyGoals,[monday]:entry});
    setDraft(null); notify(`✅ ${weekLabel(monday)} 목표를 저장했습니다.`);
  };
  const copyToNext = ()=>{
    const next=mondayOf(addDays(monday,7));
    if(weeklyGoals[next]){ notify(`⚠️ ${weekLabel(next)}에 이미 목표가 있어 덮어쓰지 않았습니다.`,"warn"); return; }
    onSaveGoals({...weeklyGoals,[next]:{goals:{...goals},수정자:currentUser.name,수정시각:nowSec(),history:[{at:nowSec(),by:currentUser.name,before:{},after:goals,note:`${weekLabel(monday)}복사`}]}});
    notify(`📋 ${weekLabel(next)}로 목표를 복사했습니다.`);
  };
  const total = PROD_COOKIES.reduce((s,c)=>s+(parseInt(editing?draft[c]:goals[c])||0),0);
  return(
    <div style={{background:C.white,borderRadius:16,border:`1px solid ${C.border}`,padding:"14px 16px",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:editing?12:0}}>
        <span style={{fontSize:15,fontWeight:700,color:C.amberDark}}>{title}</span>
        <button onClick={()=>{setMonday(mondayOf(addDays(monday,-7)));setDraft(null);}} style={{border:`1px solid ${C.border}`,background:C.white,borderRadius:8,width:30,height:30,cursor:"pointer"}}>‹</button>
        <input type="date" value={monday} onChange={e=>{setMonday(mondayOf(e.target.value));setDraft(null);}} style={{...inp,width:"auto",fontSize:13,padding:"6px 10px"}}/>
        <span style={{fontSize:13,fontWeight:700,color:C.ink}}>{weekLabel(monday)}</span>
        <button onClick={()=>{setMonday(mondayOf(addDays(monday,7)));setDraft(null);}} style={{border:`1px solid ${C.border}`,background:C.white,borderRadius:8,width:30,height:30,cursor:"pointer"}}>›</button>
        <span style={{fontSize:12,color:C.gray}}>합계 <b style={{color:C.amber}}>{total.toLocaleString()}</b>{unit}</span>
        {wk&&!editing&&<span style={{fontSize:11,color:C.gray}}>· 최종수정 {wk.수정자} {wk.수정시각}</span>}
        {!editing&&<span style={{fontSize:11,color:"#9a5b00"}}>· 재고 차감 전 기본 목표</span>}
        <div style={{flex:1}}/>
        {!editing&&isAdmin&&<button onClick={startEdit} style={btn(C.amber,{padding:"6px 14px",fontSize:13})}>✏️ {wk?"목표 수정":"목표 입력"}</button>}
        {!editing&&isAdmin&&wk&&<button onClick={copyToNext} style={{...btn(C.white),color:C.amber,border:`1px solid ${C.amber}`,padding:"6px 12px",fontSize:13}}>다음 주로 복사</button>}
        {!editing&&!isAdmin&&<span style={{fontSize:11,color:"#9a5b00"}}>🔒 목표 수정은 관리자만</span>}
        {editing&&<><button onClick={()=>setDraft(null)} style={{...btn(C.white),color:C.gray,border:`1px solid ${C.border}`,padding:"6px 12px",fontSize:13}}>취소</button>
          <button onClick={saveEdit} style={btn(C.amber,{padding:"6px 14px",fontSize:13,fontWeight:700})}>💾 저장</button></>}
      </div>
      {editing&&(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:8}}>
          {PROD_COOKIES.map(c=>(
            <div key={c} style={{display:"flex",alignItems:"center",gap:6}}>
              <label style={{fontSize:12,color:C.gray,width:72,flexShrink:0}}>{c}</label>
              <input type="number" min={0} value={draft[c]==null?"":draft[c]} onChange={e=>setDraft({...draft,[c]:e.target.value})} style={{...inp,fontSize:13,padding:"6px 8px",textAlign:"right"}}/>
            </div>
          ))}
        </div>
      )}
      {!editing&&!wk&&<div style={{marginTop:8,fontSize:12,color:C.gray}}>이 주차 목표가 아직 없습니다. {isAdmin?"[목표 입력]으로 설정하세요.":"관리자가 설정해야 합니다."}</div>}
      {!editing&&wk&&(
        <div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:6}}>
          {PROD_COOKIES.map(c=>goals[c]>0&&<span key={c} style={{fontSize:12,padding:"3px 10px",borderRadius:8,background:C.parchment,color:C.ink}}>{c} <b>{goals[c].toLocaleString()}</b></span>)}
        </div>
      )}
    </div>
  );
}

function SettingsCard({prodSettings,onSaveSettings,isAdmin,notify}) {
  const [open,setOpen]=useState(false);
  const [d,setD]=useState(null);
  const start=()=>{
    const base=JSON.parse(JSON.stringify(prodSettings));
    base.panBatch=base.panBatch||{}; base.doughYield=base.doughYield||{};
    // 팬당 배치수량: 미설정이면 PAN_SIZE 제안값 채움(검토 후 저장)
    PROD_COOKIES.forEach(c=>{ if(base.panBatch[c]==null && PAN_SIZE[c]!=null) base.panBatch[c]=PAN_SIZE[c]; });
    // 반죽 회당수율: 미설정이면 제안값 채움 — 저장 전까지는 '설정 필요' 유지, 자동 횟수계산 안 함
    PROD_COOKIES.forEach(c=>{ if(base.doughYield[c]==null && DOUGH_YIELD_SEED[c]!=null) base.doughYield[c]=DOUGH_YIELD_SEED[c]; });
    setD(base);
  };
  const save=()=>{
    // 빈칸은 미설정으로 유지(저장 안 함), 0 이상 숫자는 보존
    const clean=JSON.parse(JSON.stringify(d));
    const pb={},dy={};
    PROD_COOKIES.forEach(c=>{ const v=clean.panBatch&&clean.panBatch[c]; if(v!=null&&v!==""&&!isNaN(parseInt(v)))pb[c]=parseInt(v); });
    PROD_COOKIES.forEach(c=>{ const v=clean.doughYield&&clean.doughYield[c]; if(v!=null&&v!==""&&!isNaN(parseInt(v)))dy[c]=parseInt(v); });
    onSaveSettings({...clean,panBatch:pb,doughYield:dy});
    setD(null); notify("✅ 생산 설정을 저장했습니다.");
  };
  return(
    <div style={{marginTop:16,background:C.white,borderRadius:16,border:`1px solid ${C.border}`,overflow:"hidden"}}>
      <div style={{padding:"10px 16px",display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:C.parchment}} onClick={()=>setOpen(!open)}>
        <span style={{fontSize:14,fontWeight:700,color:C.ink}}>⚙️ 생산 설정</span>
        <span style={{fontSize:12,color:C.gray}}>팬당 배치수량 · 반죽 회당수율 · 출고 기준일</span>
        <div style={{flex:1}}/>
        <span style={{fontSize:13,color:C.amber,fontWeight:700}}>{open?"접기 ▲":"펼치기 ▼"}</span>
      </div>
      {open&&(
        <div style={{padding:"14px 16px"}}>
          {!isAdmin&&<div style={{fontSize:11,color:"#9a5b00",marginBottom:10}}>🔒 설정 변경은 관리자만 가능합니다.</div>}
          <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
            <label style={{fontSize:13,color:C.gray}}>출고 최소 잔여 소비기한</label>
            {d?<input type="number" min={0} value={d.shipMinDays} onChange={e=>setD({...d,shipMinDays:parseInt(e.target.value)||0})} style={{...inp,width:70,padding:"5px 8px"}}/>:<b>{prodSettings.shipMinDays}</b>}
            <span style={{fontSize:13,color:C.gray}}>일</span>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:420}}>
              <thead><tr><th style={TH}>쿠키</th><th style={{...TH,textAlign:"right"}}>팬당 배치수량</th><th style={{...TH,textAlign:"right"}}>반죽 회당수율(개분/회)</th></tr></thead>
              <tbody>
                {PROD_COOKIES.map(c=>(
                  <tr key={c}>
                    <td style={{...TD,fontWeight:600}}>{c}</td>
                    <td style={{...TD,textAlign:"right"}}>{d?<input type="number" min={1} value={(d.panBatch&&d.panBatch[c])==null?"":d.panBatch[c]} onChange={e=>setD({...d,panBatch:{...d.panBatch,[c]:parseInt(e.target.value)||0}})} style={{...inp,width:80,padding:"5px 8px",textAlign:"right"}}/>:((prodSettings.panBatch&&prodSettings.panBatch[c])||<span style={{color:"#c0342b",fontSize:12}}>설정 필요</span>)}</td>

// [S3] 반죽 요일별 + 반죽 원장: 남은 = 시작잔량 + 만든 − 사용(생산완료 연결). derivation 기반(중복차감 없음).
function DoughLedgerCard({prodSettings,prodActuals,onSaveActuals,currentUser,notify}) {
  const isAdmin=currentUser.role==="admin";
  const pa=prodActuals||DEFAULT_PROD_ACTUALS;
  const doughStock=prodSettings.doughStock||{};
  const has=(o,c)=>Object.prototype.hasOwnProperty.call(o||{},c);
  const start=(c)=> has(doughStock,c)?doughStock[c]:null;                 // 시작잔량(반죽재고에서)
  const made=(c)=> has(pa.doughMade,c)?pa.doughMade[c]:null;             // 만든(누계)
  const used=(c)=> has(pa.doughUsedOv,c)?pa.doughUsedOv[c]:(has(pa.prodDone,c)?pa.prodDone[c]:0); // 사용: override>생산완료>0
  const usedIsOv=(c)=> has(pa.doughUsedOv,c);
  const remain=(c)=> (start(c)!=null&&made(c)!=null)?(start(c)+made(c)-used(c)):null;
  const [edit,setEdit]=useState(null);
  const startEdit=()=>setEdit({doughMade:{...(pa.doughMade||{})},doughUsedOv:{...(pa.doughUsedOv||{})}});
  const clean=(o)=>{const r={};PROD_COOKIES.forEach(c=>{const v=o[c];if(v!==""&&v!=null&&!isNaN(parseInt(v)))r[c]=parseInt(v);});return r;};
  const saveEdit=()=>{ onSaveActuals({...pa,doughMade:clean(edit.doughMade),doughUsedOv:clean(edit.doughUsedOv)}); setEdit(null); notify("✅ 반죽 원장(만든·사용)을 저장했습니다."); };
  const cellNum=(v)=> v!=null?v.toLocaleString():<span style={{fontSize:11,color:"#b8860b",fontWeight:600}}>미입력</span>;
  return(
    <div style={{marginTop:16}}>
      <div style={{background:C.white,borderRadius:16,border:`1px solid ${C.border}`,padding:"12px 16px",marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:700,color:C.amberDark,marginBottom:8}}>🗓️ 요일별 반죽 스케줄 <span style={{fontSize:11,fontWeight:400,color:C.gray}}>(만든 반죽은 다음날부터 사용 가능)</span></div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:8}}>
          {WEEKDAYS.map(wd=>(
            <div key={wd} style={{border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 10px"}}>
              <div style={{fontSize:12,fontWeight:700,color:C.ink,marginBottom:4}}>{wd}</div>
              <div style={{fontSize:12,color:C.gray,lineHeight:1.6}}>{(DOUGH_DAYS[wd]||[]).join(" · ")||"-"}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{background:"#fff4e5",border:"1px solid #f0c48a",borderRadius:12,padding:"10px 14px",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:"#9a5b00",marginBottom:4}}>➕ 이번 계획용 추가 반죽 필요 (제안 — 실제 완료 아님, 재고에 더하지 않음)</div>
        <div style={{fontSize:12,color:"#7a4a00",lineHeight:1.6}}>{DOUGH_EXTRA_SUGGEST.map((s,i)=><span key={i}>{s.요일} {s.품목} {s.개분.toLocaleString()}개분{i<DOUGH_EXTRA_SUGGEST.length-1?" / ":""}</span>)}</div>
      </div>
      <div style={{background:C.white,borderRadius:16,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:15,fontWeight:700,color:C.amberDark}}>🥣 반죽 원장 (개분)</span>
          <span style={{fontSize:12,color:C.gray}}>남은 = 시작잔량 + 만든 − 사용 · 사용=생산완료 연결</span>
          <div style={{flex:1}}/>
          {isAdmin&&!edit&&<button onClick={startEdit} style={btn(C.amber,{padding:"5px 12px",fontSize:12})}>✏️ 만든·사용 입력</button>}
          {isAdmin&&edit&&<><button onClick={()=>setEdit(null)} style={{...btn(C.white),color:C.gray,border:`1px solid ${C.border}`,padding:"5px 10px",fontSize:12}}>취소</button>
            <button onClick={saveEdit} style={btn(C.amber,{padding:"5px 12px",fontSize:12,fontWeight:700})}>💾 저장</button></>}
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:820}}>
            <thead><tr>
              <th style={TH}>쿠키</th>

              <th style={{...TH,textAlign:"right"}}>만든 반죽(누계)</th>

              <th style={{...TH,textAlign:"right"}}>남은 반죽</th>
              <th style={{...TH,textAlign:"center"}}>상태</th>
            </tr></thead>
            <tbody>
              {PROD_COOKIES.map(c=>{

                return(

                    <td style={{...TD,textAlign:"right",fontWeight:700,color:rem==null?"#b8860b":rem<0?"#c0342b":"#0058b8"}}>{rem==null?"확인 필요":rem.toLocaleString()}</td>
                    <td style={{...TD,textAlign:"center"}}>{rem==null?<span style={{fontSize:11,color:"#b8860b"}}>시작·만든 확인</span>:rem<0?<span style={{fontSize:11,color:"#c0342b"}}>부족</span>:<span style={{fontSize:11,color:"#1c7a34"}}>보유</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{padding:"8px 16px",fontSize:12,color:C.gray,lineHeight:1.6}}>※ 시작잔량은 위 ‘반죽재고’ 입력값을 사용합니다. 사용량은 생산 탭의 <b>실제 생산완료</b>와 연결되며(계획만으로 차감 안 함), 실제 사용이 다르면 직접 수정할 수 있습니다. 남은 반죽은 derivation(재계산) 방식이라 되돌림·새로고침에도 <b>중복 차감되지 않습니다</b>. 시작·만든 미입력은 0이 아닌 ‘확인 필요’로 둡니다.</div>
      </div>
    </div>
  );
}
function DoughTab({orders,prodSettings,onSaveSettings,doughGoals,onSaveDoughGoals,prodActuals,onSaveActuals,currentUser,notify,syncState}) {

    const cleaned={}; PROD_COOKIES.forEach(c=>{ const v=edit[c]; if(v!==""&&v!=null&&!isNaN(parseInt(v))) cleaned[c]=parseInt(v); });

// [S1] 요일별 생산계획 카드 — 품목×요일 계획량, 목표 대비 부족/초과. 계획 전용(실적·재고 아님).
function ProdPlanCard({weeklyGoals,prodPlan,onSavePlan,prodActuals,onSaveActuals,currentUser,notify,monday}) {
  const isAdmin=currentUser.role==="admin";
  const wkEntry=prodPlan[monday];
  const plan = wkEntry ? wkEntry.plan : null;
  const seedPlan = monday==="2026-11-02" ? WEEK1_PROD_PLAN : null;
  const shown = plan || seedPlan || {};            // 저장값 > 제안값 > 빈값
  const goals = (weeklyGoals[monday]&&weeklyGoals[monday].goals)||{};
  const cell=(src,wd,c)=> (src[wd]&&src[wd][c]!=null) ? src[wd][c] : null;
  const planSum=(src,c)=> WEEKDAYS.reduce((s,wd)=>s+((src[wd]&&src[wd][c])||0),0);
  const [edit,setEdit]=useState(null);
  const startEdit=()=>{
    const base={}; WEEKDAYS.forEach(wd=>{ base[wd]={...((plan||seedPlan||{})[wd]||{})}; });
    setEdit(base);
  };
  const saveEdit=()=>{
    const clean={}; WEEKDAYS.forEach(wd=>{ clean[wd]={}; PROD_COOKIES.forEach(c=>{ const v=edit[wd][c]; if(v!==""&&v!=null&&!isNaN(parseInt(v))) clean[wd][c]=parseInt(v); }); });
    onSavePlan({...prodPlan,[monday]:{plan:clean,수정자:currentUser.name,수정시각:nowSec(),history:[...(wkEntry&&wkEntry.history||[]),{at:nowSec(),by:currentUser.name}].slice(-20)}});
    setEdit(null); notify(`✅ ${weekLabel(monday)} 요일별 생산계획을 저장했습니다.`);
  };
  const copyNext=()=>{
    const next=mondayOf(addDays(monday,7));
    if(prodPlan[next]){ notify(`⚠️ ${weekLabel(next)}에 이미 계획이 있어 덮어쓰지 않았습니다.`,"warn"); return; }
    onSavePlan({...prodPlan,[next]:{plan:JSON.parse(JSON.stringify(shown)),수정자:currentUser.name,수정시각:nowSec(),history:[{at:nowSec(),by:currentUser.name,note:`${weekLabel(monday)}복사`}]}});
    notify(`📋 ${weekLabel(next)}로 계획을 복사했습니다.`);
  };
  const dayTotal=(wd)=> PROD_COOKIES.reduce((s,c)=>s+((edit?(parseInt(edit[wd][c])||0):(shown[wd]&&shown[wd][c])||0)),0);
  const grand=WEEKDAYS.reduce((s,wd)=>s+dayTotal(wd),0);
  // [C] 계획 '수행' → 재고원장 생산완료 반영 (appliedDays로 중복 차단·정확 역산)
  const dayDate=(wd)=> addDays(monday, WEEKDAYS.indexOf(wd));
  const isApplied=(wd)=> !!(prodActuals&&prodActuals.appliedDays&&prodActuals.appliedDays[dayDate(wd)]);
  const applyDay=(wd)=>{
    const pa=prodActuals||DEFAULT_PROD_ACTUALS; const date=dayDate(wd);
    const applied={...(pa.appliedDays||{})};
    if(applied[date]){ notify(`이미 ${date}(${wd}) 생산이 반영되어 있습니다.`,"warn"); return; }
    const dayPlan=(shown[wd])||{}; const newDone={...(pa.prodDone||{})}; const rec={};
    PROD_COOKIES.forEach(c=>{ const q=dayPlan[c]; if(q){ newDone[c]=(newDone[c]||0)+q; rec[c]=q; } });
    applied[date]=rec;
    onSaveActuals({...pa,prodDone:newDone,appliedDays:applied});
    notify(`✅ ${date}(${wd}) 계획을 생산완료로 반영했습니다.`);
  };
  const cancelDay=(wd)=>{
    const pa=prodActuals||DEFAULT_PROD_ACTUALS; const date=dayDate(wd);
    const applied={...(pa.appliedDays||{})}; const rec=applied[date]; if(!rec)return;
    const newDone={...(pa.prodDone||{})};
    Object.keys(rec).forEach(c=>{ newDone[c]=Math.max(0,(newDone[c]||0)-rec[c]); });
    delete applied[date];
    onSaveActuals({...pa,prodDone:newDone,appliedDays:applied});
    notify(`↩️ ${date}(${wd}) 수행 반영을 취소했습니다.`);
  };
  return(
    <div style={{background:C.white,borderRadius:16,border:`1px solid ${C.border}`,overflow:"hidden",marginBottom:16}}>
      <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:15,fontWeight:700,color:C.amberDark}}>🗓️ 요일별 생산계획 (계획 전용)</span>
        <span style={{fontSize:12,color:C.gray}}>월~금 품목별 계획 · 합계 {grand.toLocaleString()}개</span>
        {!plan&&seedPlan&&<span style={{fontSize:11,color:"#9a5b00"}}>· 제안값(미저장)</span>}
        <div style={{flex:1}}/>
        {isAdmin&&!edit&&<button onClick={startEdit} style={btn(C.amber,{padding:"5px 12px",fontSize:12})}>✏️ 계획 입력</button>}
        {isAdmin&&!edit&&(plan||seedPlan)&&<button onClick={copyNext} style={{...btn(C.white),color:C.amber,border:`1px solid ${C.amber}`,padding:"5px 10px",fontSize:12}}>다음 주로 복사</button>}
        {isAdmin&&edit&&<><button onClick={()=>setEdit(null)} style={{...btn(C.white),color:C.gray,border:`1px solid ${C.border}`,padding:"5px 10px",fontSize:12}}>취소</button>
          <button onClick={saveEdit} style={btn(C.amber,{padding:"5px 12px",fontSize:12,fontWeight:700})}>💾 저장</button></>}
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:920}}>
          <thead><tr>
            <th style={TH}>쿠키</th>
            {WEEKDAYS.map(wd=><th key={wd} style={{...TH,textAlign:"right"}}>{wd}</th>)}
            <th style={{...TH,textAlign:"right"}}>계획합</th>
            <th style={{...TH,textAlign:"right"}}>주간목표</th>
            <th style={{...TH,textAlign:"center"}}>부족/초과</th>
          </tr></thead>
          <tbody>
            {PROD_COOKIES.map(c=>{
              const psum = edit ? WEEKDAYS.reduce((s,wd)=>s+(parseInt(edit[wd][c])||0),0) : planSum(shown,c);
              const g = goals[c]||0;
              const diff = psum - g;   // +초과 / -부족
              return(
                <tr key={c}>
                  <td style={{...TD,fontWeight:600}}>{c}</td>
                  {WEEKDAYS.map(wd=>(
                    <td key={wd} style={{...TD,textAlign:"right"}}>
                      {edit?<input type="number" min={0} value={edit[wd][c]==null?"":edit[wd][c]} onChange={e=>setEdit({...edit,[wd]:{...edit[wd],[c]:e.target.value}})} style={{...inp,width:64,padding:"3px 5px",textAlign:"right",fontSize:12}}/>
                        :(cell(shown,wd,c)!=null?cell(shown,wd,c).toLocaleString():<span style={{color:"#d8d8d8"}}>·</span>)}
                    </td>
                  ))}
                  <td style={{...TD,textAlign:"right",fontWeight:700}}>{psum?psum.toLocaleString():<span style={{color:C.gray}}>-</span>}</td>
                  <td style={{...TD,textAlign:"right",color:C.gray}}>{g?g.toLocaleString():"-"}</td>
                  <td style={{...TD,textAlign:"center",fontSize:12,fontWeight:700,color:diff===0?"#1c7a34":diff<0?"#c0342b":"#b8860b"}}>{!g&&!psum?"-":diff===0?"일치":diff<0?`부족 ${(-diff).toLocaleString()}`:`초과 ${diff.toLocaleString()}`}</td>
                </tr>
              );
            })}
            <tr style={{background:C.parchment}}>
              <td style={{...TD,fontWeight:700}}>합계</td>
              {WEEKDAYS.map(wd=><td key={wd} style={{...TD,textAlign:"right",fontWeight:700}}>{dayTotal(wd).toLocaleString()}</td>)}
              <td style={{...TD,textAlign:"right",fontWeight:700,color:C.amberDark}}>{grand.toLocaleString()}</td>
              <td style={{...TD,textAlign:"right",fontWeight:700,color:C.gray}}>{PROD_COOKIES.reduce((s,c)=>s+(goals[c]||0),0).toLocaleString()}</td>
              <td style={{...TD}}></td>
            </tr>
            {isAdmin&&!edit&&(
              <tr>
                <td style={{...TD,fontWeight:700,fontSize:11,color:"#1c7a34"}}>수행</td>
                {WEEKDAYS.map(wd=>(
                  <td key={wd} style={{...TD,textAlign:"center"}}>
                    {isApplied(wd)
                      ? <button onClick={()=>cancelDay(wd)} style={{...btn(C.white),color:"#c0342b",border:"1px solid #e0a0a0",padding:"3px 8px",fontSize:11}}>수행됨 ↩</button>
                      : <button onClick={()=>applyDay(wd)} style={btn("#1c7a34",{padding:"3px 10px",fontSize:11,color:"#fff"})}>수행</button>}
                  </td>
                ))}
                <td colSpan={3} style={{...TD,fontSize:11,color:C.gray}}>→ 해당 요일 계획을 ‘재고 원장’ 생산완료에 1회 반영(중복·되돌림 안전)</td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
      <div style={{padding:"8px 16px",fontSize:12,color:C.gray,lineHeight:1.6}}>※ 계획 전용입니다 — 생산완료·현재고로 등록되지 않습니다. 목표는 재고·주문이 줄어도 자동 축소되지 않습니다. 하루 최대 4품목 기준. 생산능력(오븐·인력) 검증은 아직 완료되지 않았습니다.</div>
    </div>
  );
}
// [S2] 쿠키 재고 원장 — 현재잔량 = 시작재고 + 생산완료 − 포장완료(주문상태에서 유도, 멱등).
// 포장완료/미포장은 주문의 현재 상태에서 그때그때 계산 → 새로고침·되돌림·중복클릭 안전.
function InventoryLedgerCard({orders,weeklyGoals,prodSettings,prodActuals,onSaveActuals,currentUser,notify,monday}) {
  const isAdmin=currentUser.role==="admin";
  const pa=prodActuals||DEFAULT_PROD_ACTUALS;
  const panBatch=(prodSettings&&prodSettings.panBatch)||{};
  const baseline = pa.baselineDate || monday;      // 기준일 없으면 선택 주차 월요일
  const goals=(weeklyGoals[monday]&&weeklyGoals[monday].goals)||{};
  // 포장완료(차감): 포장 끝난 상태 & 배송일>=기준일 → 주문상태에서 유도(멱등)
  const packed=useMemo(()=> expandOrdersToCookies((orders||[]).filter(o=>PACKED_STATES.includes(o.상태)&&o.배송일&&o.배송일>=baseline),{onlyActive:false}).byCookie,[orders,baseline]);
  // 미포장(앞으로 포장할 수량): 아직 포장 전 & 배송일이 '이번 주 월~토' 범위
  const weekEnd = addDays(monday,5);   // 토요일
  const inWeek=(o)=> o.배송일 && o.배송일>=monday && o.배송일<=weekEnd;
  const unpacked=useMemo(()=> expandOrdersToCookies((orders||[]).filter(o=>UNPACKED_STATES.includes(o.상태)&&inWeek(o)),{onlyActive:false}).byCookie,[orders,monday,weekEnd]);
  // 납기: 미포장 주문(이번 주 월~토)의 가장 이른 배송일(쿠키별) — 추가생산이 '언제까지' 필요한지
  const dueByCookie=useMemo(()=>{
    const m={};
    (orders||[]).filter(o=>UNPACKED_STATES.includes(o.상태)&&inWeek(o)).forEach(o=>{
      const cks=expandOrdersToCookies([o],{onlyActive:false}).byCookie;
      Object.keys(cks).forEach(c=>{ if(!m[c]||o.배송일<m[c]) m[c]=o.배송일; });
    });
    return m;
  },[orders,monday,weekEnd]);
  const has=(obj,c)=>Object.prototype.hasOwnProperty.call(obj||{},c);
  const num=(v)=> (v===""||v==null||isNaN(parseInt(v)))?null:parseInt(v);
  const [edit,setEdit]=useState(null);
  const startEdit=()=>setEdit({startStock:{...(pa.startStock||{})},prodDone:{...(pa.prodDone||{})},baselineDate:pa.baselineDate||monday});
  const clean=(o)=>{const r={};PROD_COOKIES.forEach(c=>{const v=o[c];if(v!==""&&v!=null&&!isNaN(parseInt(v)))r[c]=parseInt(v);});return r;};
  const saveEdit=()=>{
    onSaveActuals({...pa,startStock:clean(edit.startStock),prodDone:clean(edit.prodDone),baselineDate:edit.baselineDate||""});
    setEdit(null); notify("✅ 재고 원장(시작재고·생산완료·기준일)을 저장했습니다.");
  };
  const row=(c)=>{
    const SS = edit? num(edit.startStock[c]) : (has(pa.startStock,c)?pa.startStock[c]:null);
    const PD = edit? num(edit.prodDone[c])   : (has(pa.prodDone,c)?pa.prodDone[c]:null);
    const PACK = packed[c]||0, UNP = unpacked[c]||0, G = goals[c]||0;
    const cur = (SS!=null&&PD!=null) ? (SS+PD-PACK) : null;          // 현재잔량(실제)
    const expReal = cur!=null ? cur-UNP : null;                      // 예상잔량(실제 기준)
    const needProd = expReal!=null ? Math.max(0,-expReal) : null;    // 추가 생산 필요(주문 기준)
    const needGoal = cur!=null ? Math.max(0, G-cur) : null;          // 필요생산량(목표 − 현재잔량)
    const pan = (panBatch[c]!=null && panBatch[c]>0) ? panBatch[c] : null;
    const pansGoal = needGoal==null ? null : (pan ? Math.ceil(needGoal/pan) : (needGoal>0?null:0)); // 필요 팬수
    const due = (needProd && needProd>0) ? (dueByCookie[c]||null) : null;   // 납기(언제까지)
    return {SS,PD,PACK,UNP,G,cur,expReal,needProd,needGoal,pan,pansGoal,due};
  };
  const cellNum=(v)=> v!=null ? v.toLocaleString() : <span style={{fontSize:11,color:"#b8860b",fontWeight:600}}>미입력</span>;
  return(
    <div style={{background:C.white,borderRadius:16,border:`1px solid ${C.border}`,overflow:"hidden",marginBottom:16}}>
      <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:15,fontWeight:700,color:C.amberDark}}>📦 쿠키 재고 원장</span>
        <span style={{fontSize:12,color:C.gray}}>현재잔량 = 시작재고 + 생산완료 − 포장완료 · 기준일 {baseline} 이후</span>
        <div style={{flex:1}}/>
        {isAdmin&&!edit&&<button onClick={startEdit} style={btn(C.amber,{padding:"5px 12px",fontSize:12})}>✏️ 시작재고·생산완료 입력</button>}
        {isAdmin&&edit&&<><button onClick={()=>setEdit(null)} style={{...btn(C.white),color:C.gray,border:`1px solid ${C.border}`,padding:"5px 10px",fontSize:12}}>취소</button>
          <button onClick={saveEdit} style={btn(C.amber,{padding:"5px 12px",fontSize:12,fontWeight:700})}>💾 저장</button></>}
      </div>
      {edit&&(
        <div style={{padding:"8px 16px",borderBottom:`1px solid ${C.border}`,background:"#fffdf7",fontSize:12,color:C.ink,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <label>기준일(이 날짜 이후 배송분만 차감)</label>
          <input type="date" value={edit.baselineDate} onChange={e=>setEdit({...edit,baselineDate:e.target.value})} style={{...inp,width:"auto",fontSize:12,padding:"4px 8px"}}/>
          <span style={{color:C.gray}}>※ 기준일 이전 출고분은 시작재고에 이미 반영된 것으로 보고 다시 빼지 않습니다.</span>
        </div>
      )}
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:1440}}>
          <thead><tr>
            <th style={TH}>쿠키</th>
            <th style={{...TH,textAlign:"right"}}>시작재고</th>
            <th style={{...TH,textAlign:"right"}}>생산완료</th>
            <th style={{...TH,textAlign:"right"}}>포장완료(자동)</th>
            <th style={{...TH,textAlign:"right"}}>현재잔량</th>
            <th style={{...TH,textAlign:"right"}}>미포장 주문(이번주 월~토)</th>
            <th style={{...TH,textAlign:"right"}}>예상잔량(실제)</th>
            <th style={{...TH,textAlign:"right"}}>추가생산 필요</th>
            <th style={{...TH,textAlign:"center"}}>납기(언제까지)</th>
            <th style={{...TH,textAlign:"right"}}>이번주 목표</th>
            <th style={{...TH,textAlign:"right"}}>필요생산(목표)</th>
            <th style={{...TH,textAlign:"right"}}>팬당 배치</th>
            <th style={{...TH,textAlign:"right"}}>필요 팬수</th>
            <th style={{...TH,textAlign:"center"}}>상태</th>
          </tr></thead>
          <tbody>
            {PROD_COOKIES.map(c=>{
              const r=row(c);
              return(
                <tr key={c}>
                  <td style={{...TD,fontWeight:600}}>{c}</td>
                  <td style={{...TD,textAlign:"right"}}>{edit?<input type="number" min={0} placeholder="미입력" value={edit.startStock[c]==null?"":edit.startStock[c]} onChange={e=>setEdit({...edit,startStock:{...edit.startStock,[c]:e.target.value}})} style={{...inp,width:80,padding:"4px 6px",textAlign:"right",fontSize:13}}/>:cellNum(r.SS)}</td>
                  <td style={{...TD,textAlign:"right"}}>{edit?<input type="number" min={0} placeholder="미입력" value={edit.prodDone[c]==null?"":edit.prodDone[c]} onChange={e=>setEdit({...edit,prodDone:{...edit.prodDone,[c]:e.target.value}})} style={{...inp,width:80,padding:"4px 6px",textAlign:"right",fontSize:13}}/>:cellNum(r.PD)}</td>
                  <td style={{...TD,textAlign:"right",color:r.PACK>0?"#c0342b":C.gray}}>{r.PACK?("−"+r.PACK.toLocaleString()):"0"}</td>
                  <td style={{...TD,textAlign:"right",fontWeight:700,color:r.cur==null?"#b8860b":r.cur<0?"#c0342b":"#0058b8"}}>{r.cur==null?"확인 필요":r.cur.toLocaleString()}</td>
                  <td style={{...TD,textAlign:"right",color:r.UNP>0?"#9a5b00":C.gray}}>{r.UNP?r.UNP.toLocaleString():"0"}</td>
                  <td style={{...TD,textAlign:"right",fontWeight:700,color:r.expReal==null?"#b8860b":r.expReal<0?"#c0342b":"#1c7a34"}}>{r.expReal==null?"확인 필요":r.expReal.toLocaleString()}</td>
                  <td style={{...TD,textAlign:"right",fontWeight:700,color:r.needProd?"#c0342b":C.gray}}>{r.needProd==null?"-":r.needProd>0?r.needProd.toLocaleString():"0"}</td>
                  <td style={{...TD,textAlign:"center",fontWeight:700,color:r.due?"#c0342b":C.gray}}>{r.due?`${r.due}까지`:(r.needProd===0?"여유":"-")}</td>
                  <td style={{...TD,textAlign:"right",color:C.gray}}>{r.G?r.G.toLocaleString():"-"}</td>
                  <td style={{...TD,textAlign:"right",fontWeight:700,color:r.needGoal==null?"#b8860b":r.needGoal>0?"#0058b8":"#1c7a34"}}>{r.needGoal==null?"확인 필요":r.needGoal>0?r.needGoal.toLocaleString():"0"}</td>
                  <td style={{...TD,textAlign:"right",color:C.gray}}>{r.pan?r.pan.toLocaleString():<span style={{color:"#c0342b",fontSize:11}}>설정 필요</span>}</td>
                  <td style={{...TD,textAlign:"right",fontWeight:700,color:"#0058b8"}}>{r.pansGoal==null?"-":`${r.pansGoal}판`}</td>
                  <td style={{...TD,textAlign:"center"}}>{r.cur==null?<span style={{fontSize:11,color:"#b8860b"}}>재고 확인 필요</span>:r.needProd>0?<span style={{fontSize:11,color:"#c0342b"}}>추가생산 {r.needProd.toLocaleString()}{r.due?` · ~${r.due}`:""}</span>:<span style={{fontSize:11,color:"#1c7a34"}}>충분</span>}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{padding:"8px 16px",fontSize:12,color:C.gray,lineHeight:1.6}}>※ 포장완료·미포장은 <b>주문의 현재 상태</b>에서 자동 계산됩니다(송장대기·배송완료=포장완료, 그 외=미포장). 되돌림·새로고침·배송완료 전환에도 <b>중복 차감되지 않습니다</b>. 시작재고·생산완료 미입력 시 현재잔량은 ‘확인 필요’로 두고 0으로 처리하지 않습니다. 실제 재고 이동이 아니며 개발 사본에만 저장됩니다.</div>
    </div>
  );
}
function ProduceTab({orders,prodSettings,onSaveGoals,weeklyGoals,prodPlan,onSavePlan,prodActuals,onSaveActuals,currentUser,notify,syncState}) {
  const [monday,setMonday]=useState(defaultWeekMonday());   // 당일 기준 기본 주차(바와 표 공유)

  const {byCookie:orderNeed,unresolved}=useMemo(()=>expandOrdersToCookies(orders),[orders]);

      <UnresolvedBanner unresolved={unresolved}/>
