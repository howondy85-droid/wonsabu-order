// ISO 주차 키: 그 주 월요일의 날짜(YYYY-MM-DD)로 주를 식별
const mondayOf = (dateStr) => {
  const d = dateStr ? new Date(dateStr+"T00:00:00") : new Date();
  const day = (d.getDay()+6)%7;            // 월=0 … 일=6
  d.setDate(d.getDate()-day);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const weekLabel = (monday) => {            // "11월 1주차" 형태 라벨
  const d=new Date(monday+"T00:00:00");
  const first=new Date(d.getFullYear(),d.getMonth(),1);
  const wk=Math.floor((d.getDate()+((first.getDay()+6)%7)-1)/7)+1;
  return `${d.getMonth()+1}월 ${wk}주차`;
};
const addDays = (dateStr,n) => { const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
// 당일 기준 기본 주차: 평일=이번 주 월요일, 주말(토·일)=다음 주 월요일(앞당겨 준비)
const defaultWeekMonday = () => {
  const d=new Date(); const dow=d.getDay(); // 0=일,6=토
  const base=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  if(dow===0) return mondayOf(addDays(base,1));
  if(dow===6) return mondayOf(addDays(base,2));
  return mondayOf(base);
};

// 포장 완료 상태(=재고에서 차감) vs 미포장(=앞으로 포장할 수량)
const PACKED_STATES = ["송장대기","배송완료"];
const UNPACKED_STATES = ["주문접수","생산중","포장대기"];

// 커스텀 축약 표기 → 쿠키 매핑 (긴 글자를 먼저 두어 우선 매칭)
const CUSTOM_ABBR = [
  ["가나","초코가나슈"],
  ["레드","레드벨벳"],   // 예비: '레드'로 적어도 인식
  ["바","바닐라꽃"],
  ["얼","얼그레이꽃"],
  ["카","카라멜롱"],
  ["레","레얼쿠키"],
  ["ㅋ","ㅋㅋ쿠키"],
  ["코","코오코오넛"],
  ["땅","심심풀이땅콩"],
  ["칩","땅콩칩"],
  ["초","낭만초코"],
  ["말","감성말차"],
  ["로","로터리쿠키"],
  ["씐","씐이나몬"],
  ["딸","철없는딸기"],
  ["더","묻고더블"],
  ["오","오즈말차"],
  ["황","황치즈"],
  ["벨","레드벨벳"],
  ["휘","휘낭시에"],
];
// "바+레+카2+초,말 3" 같은 문자열 → {쿠키:수량} 파싱
const parseCustomCookies = (text) => {
  const out={};
  if(!text)return out;
  // 구분자(+ , 공백/줄바꿈)로 토큰 분리
  const tokens=String(text).split(/[+,\s]+/).filter(Boolean);
  tokens.forEach(tok=>{
    // 뒤에 붙은 숫자 분리 (예: 바2 → 바,2 / 레드3 → 레드,3)
    const m=tok.match(/^(.+?)(\d+)?$/);
    if(!m)return;
    const label=m[1].trim();
    const qty=m[2]?parseInt(m[2],10):1;
    if(!label||qty<=0)return;
    // 매핑에서 라벨과 정확히 일치하는 축약 찾기 (긴 것 우선)
    const hit=CUSTOM_ABBR.find(([ab])=>ab===label);
    if(hit){ out[hit[1]]=(out[hit[1]]||0)+qty; }
  });
  return out;
};

// 상품명 표기 정규화 (확인된 동의어만 — 임의 추정 아님)
// 예: "(시) 3 종" / "(시)3종" → "시3종",  "(견) 4 종" → "견4종"
const normalizeProductName = (raw) => {
  let s = String(raw||"").trim();
  const nospace = s.replace(/\s+/g,"");         // 내부 공백 제거
  const map = {
    "(시)3종":"시3종", "시3종":"시3종",
    "(견)4종":"견4종", "견4종":"견4종",
  };
  if(map[nospace]) return map[nospace];
  // 괄호 접두 제거 후 BOM에 바로 있으면 그걸로 (예: "(5)종" 류 방어)
  return s;
};

// ===================== [1단계] 주문 → 쿠키별 필요량 전개 =====================
// 요청 3번: 기존 BOM 공통 사용. '이름+숫자'=주문 전체 추가, '이름만'=상자당 추가.
// 반환: { byCookie:{쿠키:수량}, unresolved:[{주문자,상품명,사유}] } — 추정 금지, 미해결은 확인필요로.
const expandOrdersToCookies = (orders, {onlyActive=true} = {}) => {
  const byCookie = {};
  const unresolved = [];
  const add = (c,q) => { if(q)byCookie[c]=(byCookie[c]||0)+q; };
  (orders||[]).forEach(o=>{
    if(onlyActive && (o.상태==="배송완료"))return;   // 이미 출고된 건 수요 제외
    const qty = parseInt(o.수량)||0;
    if(qty<=0)return;
    const prod = normalizeProductName(o.상품명||"");   // 표기 정규화 ((시)3종 → 시3종 등)
    const bom = BASE_MATRIX[prod];
    if(bom && Object.keys(bom).length){
      Object.entries(bom).forEach(([c,per])=>add(c, per*qty));   // 상자당 × 주문수량
    } else if(bom && Object.keys(bom).length===0){
      const parsed = parseCustomCookies(o.추가);
      if(Object.keys(parsed).length){
        Object.entries(parsed).forEach(([c,n])=>add(c, n*qty));
      } else if(prod==="커스텀"||prod==="낱개쿠키"){
        unresolved.push({주문자:o.주문자,상품명:prod,수량:qty,사유:"구성 미입력(확인 필요)"});
      }
    } else {
      unresolved.push({주문자:o.주문자,상품명:prod,수량:qty,사유:"미등록 상품(확인 필요)"});
    }
    // 추가 문구: '이름+숫자'=주문 전체 추가 / '이름만'=상자당 추가 (BOM 있는 상품에 가산)
    if(bom && Object.keys(bom).length){
      const addTxt=String(o.추가||"").trim();
      if(addTxt){
        addTxt.split(/[+,\s]+/).filter(Boolean).forEach(tok=>{
          const m=tok.match(/^(.+?)(\d+)?$/); if(!m)return;
          const hit=CUSTOM_ABBR.find(([ab])=>ab===m[1].trim());
          if(!hit)return;
          if(m[2])add(hit[1], parseInt(m[2],10));   // 이름+숫자 = 전체 추가
          else add(hit[1], qty);                     // 이름만 = 상자당 × 주문수량
        });
      }
    }
  });
  return { byCookie, unresolved };
};

// [2-A] 한 주문을 쿠키별 수량으로 전개 (위 로직과 동일 규칙, 날짜별 집계에서 재사용)
const expandOneOrder = (o) => {
  const out={};
  const add=(c,q)=>{ if(q)out[c]=(out[c]||0)+q; };
  const qty=parseInt(o.수량)||0;
  if(qty<=0)return out;
  const prod=normalizeProductName(o.상품명||"");
  const bom=BASE_MATRIX[prod];
  if(bom&&Object.keys(bom).length){
    Object.entries(bom).forEach(([c,per])=>add(c,per*qty));
    const addTxt=String(o.추가||"").trim();
    if(addTxt){
      addTxt.split(/[+,\s]+/).filter(Boolean).forEach(tok=>{
        const m=tok.match(/^(.+?)(\d+)?$/); if(!m)return;
        const hit=CUSTOM_ABBR.find(([ab])=>ab===m[1].trim()); if(!hit)return;
        if(m[2])add(hit[1],parseInt(m[2],10)); else add(hit[1],qty);
      });
    }
  } else if(bom&&Object.keys(bom).length===0){
    const parsed=parseCustomCookies(o.추가);
    Object.entries(parsed).forEach(([c,n])=>add(c,n*qty));
  }
  return out;
};
// [2-A] 미출고 주문을 배송일별 쿠키 수요로 집계. 반환 {byDate:{날짜:{쿠키:수량}}, byCookie, dates[]}
const expandOrdersByDate = (orders) => {
  const byDate={}; const byCookie={};
  (orders||[]).forEach(o=>{
    if(o.상태==="배송완료")return;                 // 이미 출고분 제외
    const d=(o.배송일||"").slice(0,10)||"미정";
    const one=expandOneOrder(o);
    if(!Object.keys(one).length)return;
    byDate[d]=byDate[d]||{};
    Object.entries(one).forEach(([c,q])=>{ byDate[d][c]=(byDate[d][c]||0)+q; byCookie[c]=(byCookie[c]||0)+q; });
  });
  const dates=Object.keys(byDate).filter(d=>d!=="미정").sort();
  return { byDate, byCookie, dates };
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const todayStr = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
// 짧은 날짜 표기: 2026-09-01 → 26-09-01
const shortDate = (d) => { const s=String(d||""); return /^\d{4}-\d{2}-\d{2}$/.test(s)?s.slice(2):s; };
const nowStr = () => new Date().toLocaleString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
// 초까지 포함한 시각 (수정자/코멘트용)
const nowSec = () => new Date().toLocaleString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
// 특이사항: 과거 배열 데이터도 텍스트로 안전 변환
const specText = (v) => Array.isArray(v) ? v.join(", ") : (v||"");
// 특이사항: 문자열이면 배열로 (드롭다운용)
const specArr = (v) => Array.isArray(v) ? v : (v ? String(v).split(/[,/]/).map(s=>s.trim()).filter(Boolean) : []);
// 기존 데이터 호환: 출고일 → 배송일 자동 이전 (배송일 없으면 출고일 값 사용)
const migrateOrders = (arr) => {
  if(!Array.isArray(arr))return arr;
  return arr.map((o,i)=>{
    if(!o)return o;
    const next={...o};
    // 출고일 → 배송일
    if(next.배송일===undefined||next.배송일===null)next.배송일=next.출고일||"";
    // 등록 순서(seq)가 없던 기존 데이터: 저장된 배열 순서를 그대로 순번으로 부여
    if(typeof next.seq!=="number")next.seq=i;
    // 구 상태값 호환: 포장완료 → 포장대기(5단계 흐름)
    if(next.상태==="포장완료")next.상태="포장대기";
    // 구 상품명 → 신 상품명 (바닐라→(틴)바닐라 등)
    if(next.상품명&&PRODUCT_RENAME[next.상품명])next.상품명=PRODUCT_RENAME[next.상품명];
    return next;
  });
};

// DEV_MODE=false : 운영 적용 — 핵심 데이터는 운영(wonsabu)에 정상 저장. (★ 지금은 운영 모드)
const DEV_MODE  = false;
const PROD_COLL = "wonsabu";        // 운영 컬렉션(주문·재고·매트릭스 등)
const DEV_COLL  = "wonsabu_dev";    // 신규 기능 데이터(목표·계획·설정·실적) 전용 — 기존 입력 보존
// 신규 기능 키 — 운영 모드에서도 이 컬렉션(wonsabu_dev)에 그대로 저장(이미 입력한 값 유지).
const DEV_WRITE_KEYS = new Set(["weekly_goals","weekly_dough_goals","prod_settings","prod_actuals","weekly_prod_plan"]);
// 주문 쓰기 가능 여부 — 운영 모드면 true(주문서·포장·송장 정상 저장).
const ORDERS_WRITABLE = !DEV_MODE;
const _db = () => (window.__db || null);
const _docProd = (key) => _db().collection(PROD_COLL).doc(key);
const _docDev  = (key) => _db().collection(DEV_COLL).doc(key);
// 읽기: 신규 기능 키는 wonsabu_dev, 나머지는 운영(wonsabu).
const sGet = async (key) => {
  if(!_db())return null;
  try {
    if(DEV_WRITE_KEYS.has(key)){ const d=await _docDev(key).get(); return d.exists?d.data().value:null; }
    const snap = await _docProd(key).get(); return snap.exists ? snap.data().value : null;
  } catch(e){ console.error("read error",e); return null; }
};
// 쓰기: 신규 기능 키→wonsabu_dev. 운영 키→개발 모드면 차단, 운영 모드면 wonsabu 저장.
const sSet = async (key,val) => {
  if(!_db())return false;
  if(DEV_WRITE_KEYS.has(key)){
    try { await _docDev(key).set({value:val, updatedAt: Date.now()}); return true; }
    catch(e){ console.error("write error(dev)",e); return false; }
  }
  if(DEV_MODE){ console.warn(`[개발 사본] 운영 키 '${key}' 쓰기 차단됨 — 운영 데이터는 변경되지 않습니다.`); return false; }
  try { await _docProd(key).set({value:val, updatedAt: Date.now()}); return true; }
  catch(e){ console.error("write error(prod)",e); return false; }
};
const subscribeDoc = (key,cb) => {
  if(!_db())return ()=>{};
  const ref = DEV_WRITE_KEYS.has(key) ? _docDev(key) : _docProd(key);
  return ref.onSnapshot(snap=>cb(snap.exists?snap.data().value:null),err=>console.error("subscribe error",err));
};

// ===================== 저장 구조 (A: 월별 분할) =====================
// orders를 배송일의 YYYY-MM 단위로 쪼개어 "orders_2026-01" 처럼 저장.
// 문서 1개 용량 한도(1MB)를 피하고, 월 단위로만 읽고 써서 속도도 개선.
const ymOf = (o) => {
  const d=String((o&&o.배송일)||(o&&o.출고일)||"").slice(0,7);
  return /^\d{4}-\d{2}$/.test(d)?d:"unknown";
};
const groupByMonth = (orders) => {
  const g={};
  (orders||[]).forEach(o=>{ const k=ymOf(o); (g[k]=g[k]||[]).push(o); });
  return g;
};
// 어떤 월들이 저장돼 있는지 목록 (인덱스 문서)
const loadIndex = async () => (await sGet("orders_index")) || [];
const saveIndex = async (list) => sSet("orders_index",list);

// 전체 주문 읽기 (월별 문서를 모두 합침). 구버전(단일 orders) 자동 이전.
const loadAllOrders = async () => {
  const idx = await loadIndex();
  if(idx && idx.length){
    const parts = await Promise.all(idx.map(ym=>sGet("orders_"+ym)));
    const all=[];
    parts.forEach((p,i)=>{
      if(Array.isArray(p)){
        all.push(...p);
        try{ _monthCache[idx[i]]=JSON.stringify(p); }catch(e){}   // 캐시 채움(불필요한 재저장 방지)
      }
    });
    return migrateOrders(all);
  }
  // 구버전 단일 문서 → 월별로 이전
  const legacy = await sGet("orders");
  if(Array.isArray(legacy) && legacy.length){
    const mig = migrateOrders(legacy);
    await saveAllOrders(mig);
    return mig;
  }
  return [];
};

// 전체 주문 쓰기 — 실제로 내용이 바뀐 월 문서만 기록 (편집 1건마다 전체 재저장 방지)
const _monthCache = {};   // {ym: 마지막으로 저장한 JSON 문자열}
const saveAllOrders = async (orders) => {
  const g = groupByMonth(orders);
  const months = Object.keys(g).sort();
  const prevIdx = await loadIndex();
  let ok=true;
  let wrote=0;
  // 내용이 달라진 월만 저장
  for(const ym of months){
    const json = JSON.stringify(g[ym]);
    if(_monthCache[ym]===json) continue;      // 변경 없음 → 쓰기 생략
    const r = await sSet("orders_"+ym, g[ym]);
    if(r){ _monthCache[ym]=json; wrote++; }
    else ok=false;
  }
  // 이번에 사라진 월(모든 주문 삭제됨) → 빈 배열로 정리
  for(const ym of prevIdx){
    if(!g[ym]){ await sSet("orders_"+ym, []); delete _monthCache[ym]; }
  }
  // 월 목록이 바뀐 경우에만 인덱스 갱신
  if(prevIdx.length!==months.length || months.some((m,i)=>prevIdx[i]!==m)){
    await saveIndex(months);
  }
  return ok;
};

// ===================== 백업 (B: 스냅샷) =====================
// 스냅샷 본문은 문서를 나눠 저장(backup_<id>), 목록은 메타만 보관해 1MB 한도를 피함.
const MAX_SNAPSHOTS = 10;
const loadSnapshots = async () => (await sGet("backups")) || [];   // 메타 목록
const loadSnapshotData = async (id) => (await sGet("backup_"+id)); // 본문

const pushSnapshot = async (orders,who,reason) => {
  try{
    const list = await loadSnapshots();
    const id = uid();
    // 본문은 월별로 쪼개 저장 (한 문서에 몰지 않음)
    const g = groupByMonth(orders||[]);
    const months = Object.keys(g).sort();
    for(const ym of months){
      const r = await sSet(`backup_${id}_${ym}`, g[ym]);
      if(!r) return false;
    }
    await sSet("backup_"+id, {months});
    const meta = {id, at:nowSec(), who:who||"", reason:reason||"자동 백업", count:(orders||[]).length, months};
    const next=[meta,...list].slice(0,MAX_SNAPSHOTS);
    // 한도 초과분 정리
    const dropped=[...list,meta].filter(m=>!next.some(n=>n.id===m.id));
    for(const d of dropped){
      if(d.months)for(const ym of d.months){ await sSet(`backup_${d.id}_${ym}`, []); }
      await sSet("backup_"+d.id, null);
    }
    return await sSet("backups",next);
  }catch(e){ return false; }
};

// 스냅샷 복원용 데이터 조립
const restoreSnapshot = async (meta) => {
  if(!meta||!meta.months)return null;
  const parts = await Promise.all(meta.months.map(ym=>sGet(`backup_${meta.id}_${ym}`)));
  const all=[];
  parts.forEach(p=>{ if(Array.isArray(p))all.push(...p); });
  return migrateOrders(all);
};

// 숨김 iframe으로 인쇄 (샌드박스 window.open 차단 대응)
const printHTML = (html) => {
  const old = document.getElementById("wsb-print-frame");
  if(old) old.remove();
  const f = document.createElement("iframe");
  f.id = "wsb-print-frame";
  f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
  document.body.appendChild(f);
  const doc = f.contentDocument || f.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} }, 350);
};

// 드래그로 여러 행 체크/해제하는 공통 훅
function useDragSelect(setValue) {
  const drag = useRef({on:false,val:true});
  useEffect(()=>{
    const up=()=>{drag.current.on=false;};
    window.addEventListener("mouseup",up);
    window.addEventListener("touchend",up);
    return ()=>{window.removeEventListener("mouseup",up);window.removeEventListener("touchend",up);};
  },[]);
  const start=(id,isSelected)=>{ drag.current={on:true,val:!isSelected}; setValue(id,drag.current.val); };
  const enter=(id)=>{ if(drag.current.on)setValue(id,drag.current.val); };
  return {start,enter};
}

function LoginScreen({onLogin}) {
  const [users,setUsers] = useState(INIT_USERS);
  const [mode,setMode] = useState("login"); // login | signup
  const [un,setUn] = useState(()=>lsGet("wsb_savedId")||"");
  const [pw,setPw] = useState(""); const [err,setErr] = useState("");
  const [loading,setLoading] = useState(true);
  const [saveId,setSaveId] = useState(()=>!!lsGet("wsb_savedId"));
  const [autoLogin,setAutoLogin] = useState(()=>!!lsGet("wsb_autoLogin"));
  // 가입 폼
  const [sName,setSName]=useState(""); const [sEmp,setSEmp]=useState(""); const [sPhone,setSPhone]=useState("");
  const [sUn,setSUn]=useState(""); const [sPw,setSPw]=useState(""); const [sPw2,setSPw2]=useState("");
  const [msg,setMsg]=useState("");

  useEffect(()=>{
    let alive=true;
    sGet("users").then(list=>{
      if(!alive)return;
      const us=(list&&list.length)?list:INIT_USERS;
      setUsers(us);
      setLoading(false);
      // 자동 로그인: 저장된 사용자 id로 자동 진입
      const autoId=lsGet("wsb_autoLogin");
      if(autoId){
        const u=us.find(x=>x.id===autoId);
        if(u){onLogin(u);return;}
      }
    }).catch(()=>{if(alive)setLoading(false);});
    return ()=>{alive=false;};
  },[]);

  const persist=(u)=>{
    if(saveId)lsSet("wsb_savedId",u.username); else lsDel("wsb_savedId");
    if(autoLogin)lsSet("wsb_autoLogin",u.id); else lsDel("wsb_autoLogin");
  };

  const login = () => {
    const u = users.find(x=>x.username===un.trim()&&x.password===pw);
    if(!u){setErr("아이디 또는 비밀번호가 올바르지 않습니다.");return;}
    // 관리자 승인 대기 계정은 로그인 불가 (관리자는 항상 허용)
    if(u.role!=="admin"&&u.approved===false){setErr("⏳ 관리자 승인 대기 중입니다. 승인 후 로그인할 수 있습니다.");return;}
    setErr("");persist(u);onLogin(u);
  };

  const signup = async () => {
    setErr("");
    if(!sName.trim()||!sEmp.trim()||!sPhone.trim()||!sUn.trim()||!sPw){setErr("모든 항목을 입력하세요.");return;}
    if(sPw!==sPw2){setErr("비밀번호가 서로 다릅니다.");return;}
    if(users.some(u=>u.username===sUn.trim())){setErr("이미 사용 중인 아이디입니다.");return;}
    if(users.some(u=>u.empNo===sEmp.trim())){setErr("이미 등록된 사원번호입니다.");return;}
    const nu={id:uid(),name:sName.trim(),username:sUn.trim(),password:sPw,role:"staff",empNo:sEmp.trim(),phone:sPhone.trim(),approved:false,appliedAt:nowSec()};
    const next=[...users,nu];
    setUsers(next);
    await sSet("users",next);
    setMsg(`✅ ${sName.trim()}님 가입 신청 완료! 관리자 승인 후 로그인할 수 있습니다.`);
    setUn(sUn.trim());setPw("");
    setSName("");setSEmp("");setSPhone("");setSUn("");setSPw("");setSPw2("");
    setMode("login");
  };

  const field=(label,val,setter,type="text",ph="",onEnter)=>(
    <div style={{marginBottom:12}}>
      <label style={lbl}>{label}</label>
      <input type={type} value={val} onChange={e=>setter(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&onEnter&&onEnter()}
        style={{...inp,padding:"10px 14px",fontSize:14}} placeholder={ph} disabled={loading}/>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:C.parchment,display:"flex",alignItems:"center",justifyContent:"center",padding:16,fontFamily:FONT}}>
      <div style={{background:C.white,borderRadius:18,border:`1px solid ${C.border}`,padding:40,width:"100%",maxWidth:380}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:56,marginBottom:6,lineHeight:1}}>🍪</div>
          <h1 style={{fontSize:28,fontWeight:600,color:C.ink,margin:"8px 0 4px",letterSpacing:"-0.5px"}}>원사부쿠키</h1>
          <p style={{color:C.gray,fontSize:14,margin:0,letterSpacing:"-0.2px"}}>주문 관리 시스템</p>
        </div>

        {/* 탭 전환 */}
        <div style={{display:"flex",gap:4,marginBottom:20,background:C.parchment,padding:4,borderRadius:12}}>
          {[["login","로그인"],["signup","직원가입"]].map(([m,t])=>(
            <button key={m} onClick={()=>{setMode(m);setErr("");setMsg("");}} style={{
              flex:1,padding:"9px",border:"none",borderRadius:9,cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:14,letterSpacing:"-0.2px",
              background:mode===m?C.white:"transparent",color:mode===m?C.ink:C.gray,
              boxShadow:mode===m?"0 1px 3px #0000001a":"none"}}>{t}</button>
          ))}
        </div>

        {msg&&<p style={{color:C.success,fontSize:13,textAlign:"center",marginBottom:12,padding:"9px",background:"#e6f5ea",borderRadius:8}}>{msg}</p>}

        {mode==="login"?(
          <>
            {field("아이디",un,setUn,"text","아이디 입력",login)}
            {field("비밀번호",pw,setPw,"password","비밀번호 입력",login)}
            <div style={{display:"flex",gap:16,marginBottom:14,fontSize:13,color:C.gray}}>
              <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                <input type="checkbox" style={{width:17,height:17,cursor:"pointer",accentColor:C.amber}} checked={saveId} onChange={e=>{setSaveId(e.target.checked);if(!e.target.checked)lsDel("wsb_savedId");}}/>

              </label>
              <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                <input type="checkbox" style={{width:17,height:17,cursor:"pointer",accentColor:C.amber}} checked={autoLogin} onChange={e=>{const v=e.target.checked;setAutoLogin(v);if(v)setSaveId(true);else lsDel("wsb_autoLogin");}}/>
                자동 로그인
              </label>
            </div>
            {err&&<p style={{color:C.error,fontSize:13,textAlign:"center",marginBottom:10,padding:"9px",background:"#fdeaec",borderRadius:8}}>{err}</p>}
            <button onClick={login} disabled={loading}
              style={{width:"100%",padding:13,background:C.amber,opacity:loading?0.6:1,color:C.white,border:"none",borderRadius:980,fontWeight:600,fontSize:15,cursor:loading?"wait":"pointer",fontFamily:"inherit",letterSpacing:"-0.2px"}}>
              {loading?"로딩 중...":"로그인"}
            </button>
          </>
        ):(
          <>
            {field("이름",sName,setSName,"text","실명 입력")}
            {field("사원번호",sEmp,setSEmp,"text","예: 1006")}
            {field("핸드폰 번호",sPhone,setSPhone,"tel","010-0000-0000")}
            {field("아이디",sUn,setSUn,"text","로그인 아이디")}
            {field("비밀번호",sPw,setSPw,"password","비밀번호")}
            {field("비밀번호 확인",sPw2,setSPw2,"password","비밀번호 다시 입력",signup)}
            {err&&<p style={{color:C.error,fontSize:13,textAlign:"center",marginBottom:10,padding:"9px",background:"#fdeaec",borderRadius:8}}>{err}</p>}

          </>

// ===================== ORDER MODAL =====================
function OrderModal({order:init,onSave,onClose,currentUser,notify,allOrders}) {
  const [o,setO] = useState({...init,특이사항:specArr(init.특이사항),splits:Array.isArray(init.splits)?init.splits:[]});
  const set = (k,v)=>setO(p=>({...p,[k]:v}));
  const toggleSpec = (s)=>setO(p=>({...p,특이사항:p.특이사항.includes(s)?p.특이사항.filter(x=>x!==s):[...p.특이사항,s]}));
  const isSplit=o.특이사항.includes("분할배송");
  const isMerge=o.특이사항.includes("합배송");
  // 분할배송 배송지 조작
  const addSplit=()=>setO(p=>({...p,splits:[...(p.splits||[]),{수취인:"",연락처:"",주소:""}]}));
  const setSplit=(i,k,v)=>setO(p=>{const s=[...(p.splits||[])];s[i]={...s[i],[k]:v};return{...p,splits:s};});
  const delSplit=(i)=>setO(p=>({...p,splits:(p.splits||[]).filter((_,idx)=>idx!==i)}));
  // 합배송 후보: 같은 배송일·택배, 자기 자신 제외
  const mergeCandidates=(allOrders||[]).filter(x=>x.id!==o.id&&x.배송방법==="택배"&&x.배송일===o.배송일&&x.상태==="주문접수");
  const [mergeSel,setMergeSel]=useState(()=>{
    if(!init.mergeId||!allOrders)return [];
    return allOrders.filter(x=>x.mergeId===init.mergeId&&x.id!==init.id).map(x=>x.id);
  });
  const toggleMerge=(id)=>setMergeSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);

  const save = ()=>{
    if(!o.주문자.trim()){notify("주문자 이름을 입력하세요.","warn");return;}
    o.수량=Math.max(1,parseInt(o.수량)||1);   // 수량 최종 보정
    const auto=resolveShipping(o);
    // 분할배송이 아니면 splits 비움
    const splits=isSplit?(o.splits||[]).filter(s=>(s.수취인||s.주소||s.연락처)):[];
    let out={...o,발송인:auto.발송인,수취인:auto.수취인,배송메모:auto.배송메모,splits};
    // 합배송: 선택한 주문들과 같은 그룹으로 묶고 수취인·연락처·주소 공유
    if(isMerge&&mergeSel.length){
      const gid=o.mergeId||uid();
      out.mergeId=gid;
      // onSave가 추가 갱신 주문 배열도 처리하도록 두 번째 인자로 전달
      const shareFields={수취인:o.수취인||"",연락처:o.연락처||"",연락처2:o.연락처2||"",주소:o.주소||"",mergeId:gid};
      onSave({...out,updatedBy:currentUser.name,updatedAt:nowSec(),lockBy:null,lockAt:null},
        {mergeIds:mergeSel,shareFields});
      return;
    }
    // 합배송 해제 시 그룹 id 제거
    if(!isMerge)out.mergeId=null;
    onSave({...out,updatedBy:currentUser.name,updatedAt:nowSec(),lockBy:null,lockAt:null});
  };

  return (
    <div style={{position:"fixed",inset:0,background:"#00000075",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:C.white,borderRadius:20,width:"100%",maxWidth:680,maxHeight:"92vh",overflow:"auto",padding:28,boxShadow:"0 12px 40px rgba(0,0,0,0.12)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
          <div>
            <h2 style={{margin:0,fontSize:22,fontWeight:600,color:C.amberDark}}>{!init.주문자?"새 주문 추가":"주문 수정"}</h2>
            <p style={{margin:"2px 0 0",fontSize:12,color:C.gray}}>* 표시 항목은 필수입력</p>
          </div>
          <button onClick={onClose} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,color:C.gray,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {[
            ["배송일","date","배송일",null,false],
            ["배송방법","select","배송방법",DELIVERIES,false],
            ["주문자 *","text","주문자","주문하신 분",false],
            ["상품명","select","상품명",PRODUCTS,false],
            ["추가","text","추가","추가 상품/옵션",false],
            ["수량","number","수량",null,false],
            ["박스","select","박스",BOXES,false],
            ["스티커","select","스티커",STICKERS,false],
            ["문구","text","문구","박스 문구",true],
            ["특이사항2","text","특이사항2","특이사항 추가 (자유 입력, 선택)",true],
            ["수취인","text","수취인","받는 분 (선물이면 입력, 본인수령은 비움)",false],
            ["연락처","text","연락처","010-0000-0000",false],
            ["연락처2","text","연락처2","추가 연락처 (선택)",false],
            ["주소","text","주소","배송 주소",true],
            ["배송메모","text","배송메모","선물이면 자동 문구, 본인수령은 직접 입력",true],
            ["배송메모2","text","배송메모2","추가 배송메모 (선택)",true],
            ["상태","select","상태",STATUSES,false],
          ].map(([label,type,key,opts,full])=>(
            <div key={key} style={full?{gridColumn:"1/-1"}:undefined}>
              <label style={lbl}>{label}</label>
              {type==="select"?(
                <select value={o[key]} onChange={e=>set(key,e.target.value)} style={inp}>
                  {opts.map(v=><option key={v||"none"} value={v}>{v||"(선택안함)"}</option>)}
                </select>
              ):(
                <input type={type} value={o[key]??""}
                  min={type==="number"?1:(type==="date"?todayStr():undefined)}
                  onChange={e=>set(key,type==="number"?(e.target.value===""?"":(parseInt(e.target.value.replace(/[^\d]/g,""))||"")):e.target.value)}
                  onBlur={type==="number"?(e=>set(key,Math.max(1,parseInt(e.target.value)||1))):undefined}
                  style={inp} placeholder={key==="추가"&&(o.상품명==="커스텀"||o.상품명==="낱개쿠키")?"예: 바+레+카2+초+말":(opts||"")}/>
              )}
              {key==="추가"&&(o.상품명==="커스텀"||o.상품명==="낱개쿠키")&&(()=>{
                const parsed=parseCustomCookies(o.추가);
                const keys=Object.keys(parsed);
                return <div style={{marginTop:4,fontSize:11,color:keys.length?"#0058b8":C.gray}}>
                  {keys.length?`🍪 인식: ${keys.map(c=>`${c} ${parsed[c]}개`).join(", ")}`:"바+레+카 형식으로 입력 (숫자로 개수 지정 가능: 바2)"}
                </div>;
              })()}
            </div>
          ))}

          <div style={{gridColumn:"1/-1",padding:"10px 14px",background:C.parchment,borderRadius:10,fontSize:12,color:C.ink,lineHeight:1.7}}>
            {(()=>{const a=resolveShipping(o);const gift=(o.수취인||"").trim()&&(o.수취인||"").trim()!==(o.주문자||"").trim();
              return <>
                <b>📦 송장 자동 기재 미리보기</b> <span style={{color:gift?"#c0348a":"#0058b8",fontWeight:600}}>{gift?"선물 발송":"본인 수령"}</span><br/>
                발송인: <b>{a.발송인}</b> · 수취인: <b>{a.수취인||"(주문자)"}</b><br/>
                배송메모1: {a.배송메모?<b>{a.배송메모}</b>:<span style={{color:C.gray}}>(공란)</span>}
              </>;
            })()}
          </div>

          <div style={{gridColumn:"1/-1"}}>
            <label style={lbl}>특이사항 (선택)</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:2}}>
              {SPECIALS.map(s=>(
                <button key={s} onClick={()=>toggleSpec(s)} style={{
                  padding:"5px 11px",borderRadius:20,fontSize:12,cursor:"pointer",border:"1px solid",transition:"all 0.15s",
                  background:o.특이사항.includes(s)?C.amber:C.white,
                  color:o.특이사항.includes(s)?C.white:C.gray,
                  borderColor:o.특이사항.includes(s)?C.amber:C.border,
                  fontFamily:"inherit",
                }}>{s}</button>
              ))}
            </div>
          </div>

          {/* 분할배송: 추가 배송지 입력 (1개 주문, 배송지 2곳 이상 · 수량/날짜 나눔) */}
          {isSplit&&(()=>{
            const splitQtySum=(o.splits||[]).reduce((s,x)=>s+(parseInt(x.수량)||0),0);
            const baseQty=Math.max(0,(o.수량||0)-splitQtySum);
            return(
            <div style={{gridColumn:"1/-1",padding:"12px 14px",border:`1px dashed ${C.amber}`,borderRadius:12,background:"#fffaf2"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
                <b style={{fontSize:13,color:C.amberDark}}>✂️ 분할배송 (배송지·수량·날짜 나눔)</b>
                <span style={{fontSize:11,color:C.gray}}>총 수량 {o.수량||0}개 · 기본 배송지 {baseQty}개 + 추가 {splitQtySum}개</span>
                {splitQtySum>(o.수량||0)&&<span style={{fontSize:11,color:C.error,fontWeight:600}}>⚠️ 추가 수량이 총 수량을 초과했습니다</span>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr 70px 130px auto",gap:6,marginBottom:4,fontSize:11,color:C.gray,fontWeight:600}}>
                <div>수취인</div><div>연락처</div><div>주소</div><div>수량</div><div>배송일</div><div></div>
              </div>
              {(o.splits||[]).map((s,i)=>(
                <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr 70px 130px auto",gap:6,marginBottom:6}}>
                  <input value={s.수취인||""} onChange={e=>setSplit(i,"수취인",e.target.value)} style={{...inp,fontSize:12}} placeholder={`수취인 ${i+2}`}/>
                  <input value={s.연락처||""} onChange={e=>setSplit(i,"연락처",e.target.value)} style={{...inp,fontSize:12}} placeholder="연락처"/>
                  <input value={s.주소||""} onChange={e=>setSplit(i,"주소",e.target.value)} style={{...inp,fontSize:12}} placeholder="주소"/>
                  <input type="number" min={1} value={s.수량||""} onChange={e=>setSplit(i,"수량",e.target.value)} style={{...inp,fontSize:12}} placeholder="수량"/>
                  <input type="date" min={todayStr()} value={s.배송일||""} onChange={e=>setSplit(i,"배송일",e.target.value)} style={{...inp,fontSize:12}}/>
                  <button onClick={()=>delSplit(i)} style={{border:`1px solid ${C.error}`,background:C.white,color:C.error,borderRadius:8,fontSize:12,cursor:"pointer",padding:"0 10px",fontFamily:"inherit"}}>삭제</button>
                </div>
              ))}
              <button onClick={addSplit} style={{border:`1px solid ${C.amber}`,background:C.white,color:C.amber,borderRadius:980,fontSize:12,fontWeight:600,padding:"5px 14px",cursor:"pointer",fontFamily:"inherit",marginTop:2}}>+ 배송지 추가</button>
            </div>
            );
          })()}

          {/* 합배송: 함께 보낼 주문 선택 (송장 1건으로 합쳐짐) */}
          {isMerge&&(
            <div style={{gridColumn:"1/-1",padding:"12px 14px",background:"#f2f7ff",border:`1px dashed #0058b8`,borderRadius:12}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <b style={{fontSize:13,color:"#0058b8"}}>📦 합배송으로 함께 보낼 주문</b>
                <span style={{fontSize:11,color:C.gray}}>선택한 주문은 수취인·연락처·주소가 이 주문과 묶이고, 송장은 1건으로 출력됩니다.</span>
              </div>
              {mergeCandidates.length===0?(
                <div style={{fontSize:12,color:C.gray}}>같은 배송일({o.배송일})의 택배·주문접수 건이 없습니다.</div>
              ):(
                <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:160,overflow:"auto"}}>
                  {mergeCandidates.map(c=>(
                    <label key={c.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,padding:"5px 8px",borderRadius:8,background:mergeSel.includes(c.id)?"#e3edff":C.white,cursor:"pointer",border:`1px solid ${mergeSel.includes(c.id)?"#0058b8":C.border}`}}>
                      <input type="checkbox" style={CHK} checked={mergeSel.includes(c.id)} onChange={()=>toggleMerge(c.id)}/>
                      <b>{c.주문자}</b> · {c.상품명}{c.추가?`+${c.추가}`:""} {c.수량}개 {c.주소?`· ${c.주소.slice(0,16)}…`:""}
                    </label>
                  ))}
                </div>
              )}
              {mergeSel.length>0&&<div style={{marginTop:6,fontSize:11,color:"#0058b8"}}>✔ {mergeSel.length}건이 이 주문과 합배송으로 묶입니다.</div>}
            </div>
          )}
        </div>

        <div style={{display:"flex",gap:8,marginTop:24,justifyContent:"flex-end",paddingTop:16,borderTop:`1px solid ${C.border}`}}>
          <button onClick={onClose} style={{...btn(C.white),color:"#1d1d1f",border:`1px solid ${C.border}`}}>취소</button>
          <button onClick={save} style={btn(C.amber,{fontWeight:700,padding:"9px 20px"})}>💾 저장</button>
        </div>
      </div>
    </div>
  );
}

// ===================== ORDER TAB =====================
function OrderTab({orders,onSave,currentUser,onGoToProduction,setForProduction,notify,matrix,onMatrixChange}) {
  const now = new Date();
  const [year,setYear] = useState(now.getFullYear());
  const [month,setMonth] = useState(now.getMonth()+1);
  const [search,setSearch] = useState("");
  const [modal,setModal] = useState(null);
  const [selected,setSelected] = useState([]);
  const [expandedId,setExpandedId] = useState(null);
  const [collapsedDates,setCollapsedDates] = useState({});   // 날짜별 접기 상태
  // 인원수 파악 (인원 유형별 1인당 기준 × 인원수 = 생산능력)
  // count(인원수)는 기기별 로컬, rate(1인당 기준)·label은 Firebase 공유(관리자만 수정)
  const staffConfig = (matrix && matrix.__staffConfig) || null;
  const [staff,setStaff] = useState(()=>{
    try{const v=lsGet("wsb_staffCount");if(v)return JSON.parse(v);}catch(e){}
    return [{id:"t1",label:"직원",rate:300,count:0},{id:"t2",label:"아르바이트",rate:300,count:0},{id:"t3",label:"당근아르바이트",rate:300,count:0}];
  });
  // Firebase의 공유 설정(label·rate)을 로컬 count와 병합
  useEffect(()=>{
    if(!staffConfig||!Array.isArray(staffConfig))return;
    setStaff(prev=>{
      const countMap={};prev.forEach(x=>{countMap[x.id]=x.count||0;});
      return staffConfig.map(c=>({...c,count:countMap[c.id]||0}));
    });
  },[JSON.stringify(staffConfig)]);
  const isAdminStaff = currentUser.role==="admin";
  // 인원수(count)만 변경 → 로컬 저장
  const setStaffCount=(id,v)=>setStaff(s=>{const n=s.map(x=>x.id===id?{...x,count:Math.max(0,parseInt(v)||0)}:x);try{lsSet("wsb_staffCount",JSON.stringify(n));}catch(e){}return n;});
  // 공유 설정(label·rate·행 추가/삭제) 변경 → Firebase 저장 (관리자만)
  const saveStaffConfig=(next)=>{
    const config=next.map(x=>({id:x.id,label:x.label,rate:x.rate}));
    onMatrixChange({...(matrix||{}),__staffConfig:config});
    try{lsSet("wsb_staffCount",JSON.stringify(next));}catch(e){}
  };
  const setStaffRate=(id,v)=>{if(!isAdminStaff)return;setStaff(s=>{const n=s.map(x=>x.id===id?{...x,rate:Math.max(1,parseInt(v)||1)}:x);saveStaffConfig(n);return n;});};
  const setStaffLabel=(id,v)=>{if(!isAdminStaff)return;setStaff(s=>{const n=s.map(x=>x.id===id?{...x,label:v}:x);saveStaffConfig(n);return n;});};
  const addStaffRow=()=>{if(!isAdminStaff)return;setStaff(s=>{const n=[...s,{id:uid(),label:"인원",rate:300,count:0}];saveStaffConfig(n);return n;});};
  const delStaffRow=(id)=>{if(!isAdminStaff)return;setStaff(s=>{const n=s.filter(x=>x.id!==id);saveStaffConfig(n);return n;});};
  const [showDone,setShowDone] = useState({});               // 날짜별 '처리된 건' 펼침 상태(기본 접힘)
  const [confirmDel,setConfirmDel] = useState(null);
  const [doneEdit,setDoneEdit] = useState(null);      // 완료 건 수정 모달
  const [doneDel,setDoneDel] = useState(null);        // 완료 건 삭제 확인
  const [doneOpen,setDoneOpen] = useState(false);     // 완료 리스트 펼침
  const [importPreview,setImportPreview] = useState(null);
  const [bulkModal,setBulkModal] = useState(null);
  const fileRef = useRef(null);

  const YEARS = [now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1];

  const filtered = useMemo(()=>{
    const pfx = `${year}-${String(month).padStart(2,"0")}`;
    return orders.filter(o=>(o.배송일||"").startsWith(pfx))
      .filter(o=>!search||[o.주문자,o.상품명,o.연락처||"",o.주소||""].some(v=>v.includes(search)))
      // 배송일 순 → 같은 날짜 안에서는 등록(업로드) 순서 그대로
      .sort((a,b)=>(a.배송일||"").localeCompare(b.배송일||"")||((a.seq||0)-(b.seq||0)));
  },[orders,year,month,search]);

  const handleEdit = (order)=>{
    if(currentUser.role!=="admin"){notify("수정 권한은 관리자에게 있습니다.","warn");return;}
    if(order.lockBy&&order.lockBy!==currentUser.name){
      const age=order.lockAt?Date.now()-new Date(order.lockAt).getTime():Infinity;
      if(age<600000){notify(`🔒 ${order.lockBy}님이 수정 중입니다. 잠금은 10분 후 자동 해제됩니다.`,"warn");return;}
    }
    const locked={...order,lockBy:currentUser.name,lockAt:new Date().toISOString()};
    onSave(orders.map(o=>o.id===order.id?locked:o));
    setModal(locked);
  };

  const handleSave=(saved,extra)=>{
    const exists=orders.find(o=>o.id===saved.id);
    let next=exists?orders.map(o=>o.id===saved.id?saved:o):[...orders,saved];
    // 합배송: 선택된 다른 주문들에 그룹 id·공유 배송정보 반영
    if(extra&&extra.mergeIds&&extra.mergeIds.length){
      const set=new Set(extra.mergeIds);
      next=next.map(o=>set.has(o.id)?{...o,...extra.shareFields,updatedBy:currentUser.name,updatedAt:nowSec()}:o);
    }
    onSave(next);
    setModal(null);
    notify(extra&&extra.mergeIds&&extra.mergeIds.length?`✅ 저장 완료 · ${extra.mergeIds.length}건 합배송으로 묶었습니다.`:"✅ 주문이 저장되었습니다.");
  };

  const handleClose=()=>{
    if(modal&&modal.id&&orders.find(o=>o.id===modal.id))
      onSave(orders.map(o=>o.id===modal.id?{...o,lockBy:null,lockAt:null}:o));
    setModal(null);
  };

  // 체크 대상은 '신규 접수(주문접수)' 건만 — 생산중/포장완료 등은 체크박스 없음
  const isNew=(o)=>o.상태==="주문접수";
  const selectable=useMemo(()=>filtered.filter(isNew),[filtered]);
  // 선택 목록을 Set으로 (행마다 includes 탐색하면 데이터가 많을 때 매우 느려짐)
  const selSet=useMemo(()=>new Set(selected),[selected]);
  // 날짜별 통계 사전 계산 (행마다 filter를 돌리면 O(n²)이 되어 버벅임의 주원인)
  const dateStats=useMemo(()=>{
    const m={};
    filtered.forEach(o=>{
      const d=o.배송일||"";
      if(!m[d])m[d]={all:0,newIds:[],done:0};
      m[d].all++;
      if(isNew(o))m[d].newIds.push(o.id); else m[d].done++;
    });
    return m;
  },[filtered]);
  const selAll=()=>setSelected(s=>s.length===selectable.length&&selectable.length>0?[]:selectable.map(o=>o.id));
  const selOne=(id)=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const setSelVal=(id,val)=>setSelected(s=>val?Array.from(new Set([...s,id])):s.filter(x=>x!==id));
  const dragSel=useDragSelect(setSelVal);
  // 날짜 접기 토글
  const toggleDate=(d)=>setCollapsedDates(m=>({...m,[d]:!m[d]}));
  const toggleDone=(d)=>setShowDone(m=>({...m,[d]:!m[d]}));
  // 특정 날짜의 신규(주문접수) 건 id 목록
  const newIdsOfDate=(d)=>(dateStats[d]&&dateStats[d].newIds)||[];
  // 날짜별 전체선택 여부
  const isDateAllSel=(d)=>{const ids=newIdsOfDate(d);return ids.length>0&&ids.every(id=>selSet.has(id));};
  // 날짜별 일괄 선택/해제
  const toggleDateSel=(d)=>{
    const ids=newIdsOfDate(d);
    if(!ids.length)return;
    setSelected(s=>{
      const cur=new Set(s);
      const all=ids.every(id=>cur.has(id));
      if(all){ids.forEach(id=>cur.delete(id));}
      else{ids.forEach(id=>cur.add(id));}
      return Array.from(cur);
    });
  };

  // 상단 수정: 1건이면 개별 모달, 여러 건이면 일괄수정 모달
  const bulkEdit=()=>{
    if(selected.length===0){notify("수정할 주문을 선택하세요.","warn");return;}
    if(selected.length===1){
      const order=orders.find(o=>o.id===selected[0]);
      if(order)handleEdit(order);
      return;
    }
    // 일괄수정: 적용할 필드만 켜서 선택 전체에 반영
    setBulkModal({
      배송일:{on:false,val:todayStr()},
      배송방법:{on:false,val:"택배"},
      상품명:{on:false,val:PRODUCTS[0]},
      박스:{on:false,val:""},
      스티커:{on:false,val:""},
      상태:{on:false,val:"주문접수"},
      문구:{on:false,val:""},
      특이사항:{on:false,val:""},
      특이사항2:{on:false,val:""},
    });
  };
  const applyBulk=()=>{
    const patch={};
    Object.entries(bulkModal).forEach(([k,v])=>{ if(v.on)patch[k]=v.val; });
    if(!Object.keys(patch).length){notify("적용할 항목을 하나 이상 선택하세요.","warn");return;}

  // 상단 일괄 삭제: 선택된 전체 삭제

  const printSelected=()=>{
    const sel=filtered.filter(o=>selected.includes(o.id));

    <style>body{font-family:sans-serif;font-size:11px;margin:16px;color:#111}
    table{width:100%;border-collapse:collapse;table-layout:auto}th,td{border:1px solid #ccc;padding:5px 7px;font-size:10px;vertical-align:top}

    <h2>🍪 원사부쿠키 주문서</h2>
    <div class="meta">출력일: ${nowStr()} | 담당: ${currentUser.name} | ${year}년 ${month}월 | 총 ${sel.length}건</div>

    <h3 style="color:#1d1d1f;margin:10px 0 4px">📋 주문 목록</h3>
    <table><thead><tr>
    <th class="nowrap">배송일</th><th class="nowrap">배송</th><th class="nowrap">주문자</th><th class="nowrap">상품명</th><th class="nowrap">추가</th><th class="nowrap">수량</th>
    <th class="nowrap">박스</th><th class="nowrap">스티커</th><th>문구</th><th>특이사항</th>
    </tr></thead><tbody>
    ${sel.map(o=>`<tr>
    <td class="nowrap">${o.배송일||""}</td><td class="nowrap">${o.배송방법}</td><td class="nowrap"><b>${o.주문자}</b></td><td class="nowrap">${o.상품명}</td>

    </tr>`).join("")}

    notify("🖨️ 인쇄 창을 열었습니다.");
  };

  // ── 엑셀 다운로드 (현재 조회 중인 월 전체) ──
  const EXCEL_COLS = ["배송일","배송방법","주문자","상품명","추가","수량","박스","스티커","문구","특이사항","특이사항2","수취인","연락처","연락처2","주소","배송메모","배송메모2","상태"];
  const exportExcel=()=>{
    if(!filtered.length){notify("다운로드할 주문이 없습니다.","warn");return;}
    try{
      const data=filtered.map(o=>({
        배송일:o.배송일,배송방법:o.배송방법,주문자:o.주문자,수취인:o.수취인||"",연락처:o.연락처||"",연락처2:o.연락처2||"",
        상품명:o.상품명,추가:o.추가||"",수량:o.수량,박스:o.박스||"",스티커:o.스티커||"",
        문구:o.문구||"",특이사항:specText(o.특이사항),특이사항2:o.특이사항2||"",주소:o.주소||"",
        배송메모:o.배송메모||"",배송메모2:o.배송메모2||"",상태:o.상태,
      }));
      const ws=XLSX.utils.json_to_sheet(data,{header:EXCEL_COLS});
      ws["!cols"]=EXCEL_COLS.map(c=>({wch:c==="주소"?28:c==="상품명"||c.startsWith("배송메모")?14:10}));
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"주문서");
      XLSX.writeFile(wb,`원사부_주문서_${year}년${month}월.xlsx`);

    }catch(e){notify("엑셀 생성 중 오류가 발생했습니다.","error");}
  };

  // ── 빈 양식(템플릿) 다운로드 ──
  const downloadTemplate=()=>{
    try{
      const sample=[{배송일:todayStr(),배송방법:"택배",주문자:"홍길동",수취인:"김영수",연락처:"010-1234-5678",연락처2:"",
        상품명:PRODUCTS[0],추가:"",수량:1,박스:"화이트",스티커:"하트",문구:"감사합니다",
        특이사항:"스티커동봉",특이사항2:"",주소:"서울시 강남구 …",배송메모:"부재시 문앞",배송메모2:"",상태:"주문접수"}];
      const ws=XLSX.utils.json_to_sheet(sample,{header:EXCEL_COLS});

      notify("📄 업로드용 빈 양식을 다운로드했습니다. (배송일은 배송일 기준으로 넣으세요)");
    }catch(e){notify("양식 생성 중 오류가 발생했습니다.","error");}
  };

  // ── 엑셀 업로드: 파일 선택 → 파싱 → 미리보기 ──
  const onFilePick=(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{defval:"",raw:false,dateNF:"yyyy-mm-dd"});
        if(!raw.length){notify("엑셀에 데이터가 없습니다.","warn");return;}
        // 현재 선택된 연·월 탭을 기준으로 (엑셀에 일자만 있으면 이 달로 인식)
        const selY=year, selM=month;
        const selYM=`${selY}-${String(selM).padStart(2,"0")}`;
        // 월(月) 정보가 명시된 완전한 날짜만 파싱. 일(日)만 있으면 null 반환.
        const toFullDate=(v)=>{
          if(v===undefined||v===null||v==="")return "";
          if(v instanceof Date){const y=v.getFullYear(),m=v.getMonth()+1,d=v.getDate();return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
          if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:"";}
          let s=String(v).trim();
          if(/^\d{5}$/.test(s)){const d=XLSX.SSF.parse_date_code(+s);if(d)return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;}
          s=s.replace(/\([^)]*\)/g,"").replace(/[년월]/g,"-").replace(/일/g,"").replace(/[.\/]/g,"-").trim();
          let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);            // YYYY-MM-DD
          if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
          m=s.match(/\b(\d{4})(\d{2})(\d{2})\b/);                  // YYYYMMDD
          if(m)return `${m[1]}-${m[2]}-${m[3]}`;
          m=s.match(/^\s*(\d{1,2})-(\d{1,2})\s*$/);                // MM-DD → 선택 연도
          if(m)return `${selY}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
          return "";  // 일(日)만 있는 경우 등은 여기서 못 잡음
        };
        // 값에서 일(日)만 추출 (1~31)
        const dayOnly=(v)=>{
          if(v===undefined||v===null||v==="")return 0;
          if(v instanceof Date)return v.getDate();
          const s=String(v).replace(/[^\d]/g,"");
          const n=parseInt(s,10);
          return (n>=1&&n<=31&&s.length<=2)?n:0;
        };
        // 최종 배송일 결정: 완전한 날짜 우선 → 일자만 있으면 선택 연월과 결합
        const resolveDate=(v)=>{
          const full=toFullDate(v);
          if(full)return full;
          const d=dayOnly(v);
          if(d)return `${selYM}-${String(d).padStart(2,"0")}`;
          return "";
        };
        // 헤더 공백/유사명칭 대응: 행의 실제 키 중 keyword를 포함하는 첫 값을 반환
        const rowKeys=Object.keys(raw[0]||{});
        const seqBase=Date.now();
        const parsed=raw.map((r,ri)=>{
          const pick=(...keys)=>{
            for(const k of keys){ if(r[k]!==undefined&&r[k]!=="")return r[k]; }
            // 정확 매칭 실패 시, 공백 제거 후 포함(contains) 매칭
            for(const key of keys){
              const nk=key.replace(/\s/g,"");
              const hit=rowKeys.find(rk=>rk.replace(/\s/g,"").includes(nk)&&r[rk]!==undefined&&r[rk]!=="");
              if(hit)return r[hit];
            }
            return "";
          };
          // 배송일: 배송일 계열 컬럼만 사용 (완전날짜는 그대로, 일자만 있으면 선택 연월과 결합)
          let 배송일=resolveDate(pick("배송일","희망배송일","배송희망일","배송예정일","희망일","도착희망일","발송일","발송예정일","출고예정일","날짜","배송일정","일정","일자"));
          // 날짜를 못 찾아도 오늘/다른 열로 넣지 않음 → 선택한 달의 1일로 (미리보기에서 확인·수정)
          if(!배송일)배송일=`${selYM}-01`;
          const 배송=String(pick("배송방법","배송")||"택배").trim();
          
          return{
            ...emptyOrder(currentUser),
            seq:seqBase+ri,   // 엑셀 파일의 행 순서를 그대로 유지
            배송일,
            배송방법:DELIVERIES.includes(배송)?배송:"택배",
            주문자:String(pick("주문자","이름")||"").trim(),
            수취인:String(pick("수취인","받는분","받는사람")||"").trim(),
            연락처:String(pick("연락처","전화","전화번호")||"").trim(),
            연락처2:String(pick("연락처2","추가연락처","보조연락처")||"").trim(),
            상품명:String(pick("상품명","상품")||PRODUCTS[0]).trim(),
            추가:String(pick("추가")||"").trim(),
            수량:Math.max(1,parseInt(pick("수량"))||1),
            박스:String(pick("박스")||"").trim(),
            스티커:String(pick("스티커")||"").trim(),
            문구:String(pick("문구")||"").trim(),
            특이사항:String(pick("특이사항")||"").trim(),
            특이사항2:String(pick("특이사항2")||"").trim(),
            주소:String(pick("주소")||"").trim(),
            배송메모:String(pick("배송메모","메모")||"").trim(),
            배송메모2:String(pick("배송메모2","추가배송메모","메모2")||"").trim(),
            송장번호:String(pick("송장번호","송장")||"").trim(),
            상태:STATUSES.includes(String(pick("상태")).trim())?String(pick("상태")).trim():"주문접수",
          };
        }).filter(o=>o.주문자);
        if(!parsed.length){notify("주문자 이름이 있는 행이 없습니다. 양식을 확인해주세요.","warn");return;}
        setImportPreview(parsed);
      }catch(err){notify("엑셀을 읽는 중 오류가 발생했습니다. 양식을 확인해주세요.","error");}
    };
    reader.readAsArrayBuffer(file);
    e.target.value="";
  };

  const confirmImport=()=>{
    onSave([...orders,...importPreview]);
    notify(`✅ ${importPreview.length}건이 주문서에 추가되었습니다.`);
    setImportPreview(null);
  };

  const statusCounts=STATUSES.reduce((a,s)=>({...a,[s]:filtered.filter(o=>o.상태===s).length}),{});

  // 선택 주문 → (상품명+추가)별 · 박스종류별 개수 집계
  // 예) 상품명 "5종" + 추가 "로+말"  →  "5종+로+말"
  const boxSummary=useMemo(()=>{
    const sel=orders.filter(o=>selected.includes(o.id));
    const map={}; // {"5종+로+말": {박스종류:개수, _total:합계}}
    let prodLoad=0;   // 생산량 환산 총합(카테고리 가중치 곱, 제외 대상은 0)
    const catSum={답례품:0,호텔:0,틴:0,선물세트:0};
    sel.forEach(o=>{
      const base=o.상품명||"(미지정)";
      const add=String(o.추가||"").trim();
      const p=add?`${base}+${add}`:base;   // 추가가 있으면 상품명에 붙여 하나의 항목으로
      const b=o.박스||"미지정";
      const q=o.수량||1;
      if(!map[p])map[p]={_total:0};
      map[p][b]=(map[p][b]||0)+q;
      map[p]._total+=q;
      // 생산량 환산 (제외 대상은 카테고리 없음 → 0)
      const cat=prodCategoryOf(o.상품명);
      if(cat){ prodLoad+=q*cat.weight; catSum[cat.key]+=q*cat.weight; }
    });
    const products=Object.keys(map).sort((a,b)=>map[b]._total-map[a]._total);
    const grand=sel.reduce((s,o)=>s+(o.수량||1),0);
    return{map,products,grand,count:sel.length,prodLoad,catSum};
  },[orders,selected]);

  // 완료 리스트(배송완료) 상품명별 수량 집계 — 이 달 기준
  const doneSummary=useMemo(()=>{
    const pfx=`${year}-${String(month).padStart(2,"0")}`;
    const done=orders.filter(o=>(o.배송일||"").startsWith(pfx)&&o.상태==="배송완료");
    const map={};
    done.forEach(o=>{const p=o.상품명||"(미지정)";map[p]=(map[p]||0)+(o.수량||1);});
    const products=Object.keys(map).sort((a,b)=>map[b]-map[a]);
    const grand=done.reduce((s,o)=>s+(o.수량||1),0);
    return{map,products,grand,count:done.length};
  },[orders,year,month]);
  // 완료 건 개별 목록 (관리자 수정·삭제용)
  const doneList=useMemo(()=>{
    const pfx=`${year}-${String(month).padStart(2,"0")}`;
    return orders.filter(o=>(o.배송일||"").startsWith(pfx)&&o.상태==="배송완료")
      .sort((a,b)=>(a.배송일||"").localeCompare(b.배송일||"")||((a.seq||0)-(b.seq||0)));
  },[orders,year,month]);
  const deleteDone=(o)=>{
    onSave(orders.filter(x=>x.id!==o.id));
    setDoneDel(null);
    notify(`🗑️ '${o.주문자}'님 완료 건을 삭제했습니다.`);
  };
  const saveDoneEdit=(saved)=>{
    onSave(orders.map(o=>o.id===saved.id?saved:o));
    setDoneEdit(null);
    notify("✅ 완료 건이 수정되었습니다.");
  };

  // 인라인 즉시 저장 (수정자·시각 자동 기록) — 수정/삭제는 관리자 전용
  const isAdmin = currentUser.role==="admin";
  const canEdit = isAdmin;
  const saveField=(id,patch)=>{
    if(!canEdit){notify("수정 권한은 관리자에게 있습니다.","warn");return;}
    onSave(orders.map(o=>o.id===id?{...o,...patch,updatedBy:currentUser.name,updatedAt:nowSec()}:o));
  };
  // 인라인 셀 스타일
  const cIn={...inp,padding:"5px 7px",fontSize:12};
  const cSel={...inp,padding:"5px 6px",fontSize:12,cursor:"pointer"};
  // 화면에 보이는 날짜 목록 (접기 전체 제어용)
  const visibleDates=useMemo(()=>Array.from(new Set(filtered.map(o=>o.배송일))),[filtered]);
  const allCollapsed=visibleDates.length>0&&visibleDates.every(d=>collapsedDates[d]);
  const toggleAllDates=()=>{
    if(allCollapsed)setCollapsedDates({});
    else{const m={};visibleDates.forEach(d=>{m[d]=true;});setCollapsedDates(m);}
  };

  return (
    <div>

// ===================== PRODUCTION TAB =====================
function ProductionTab({orders,onSave,matrix,onMatrixChange,stock,onStockChange,currentUser,notify,goPacking}) {
  const canEdit=true; // 전 직원 편집 허용
  const [localMatrix,setLocalMatrix] = useState(matrix);
  const [editMatrix,setEditMatrix] = useState(false);
  const [checked,setChecked] = useState({});       // 쿠키별 완료체크
  const [extra,setExtra] = useState({});            // 쿠키별 여유분
  const [addProd,setAddProd] = useState([          // 추가생산 [{id,name,qty}] — 기본값(수정·삭제 가능)
    {id:uid(),name:"5종",qty:300},
    {id:uid(),name:"얼그레이꽃",qty:100},
    {id:uid(),name:"레얼쿠키",qty:100},
    {id:uid(),name:"감성말차",qty:100},
    {id:uid(),name:"로터리쿠키",qty:100},
  ]);
  const [selRows,setSelRows] = useState([]);        // 주문 선택(되돌리기용)
  const [prodEdit,setProdEdit] = useState(null);    // 생산표 주문 수정 모달

  const [naName,setNaName] = useState(ADDPROD_SETS[0]);
  const [naQty,setNaQty] = useState("");

  useEffect(()=>{if(!editMatrix)setLocalMatrix(matrix);},[matrix,editMatrix]);

  // 생산중 상태의 주문만 표시
  const prodOrders = useMemo(()=>orders.filter(o=>o.상태==="생산중"),[orders]);

  const production = useMemo(()=>{
    const rows=prodOrders.map(o=>{
      const cookieMap=localMatrix[o.상품명]||{};
      const qty={};
      COOKIES.forEach(c=>{qty[c]=(cookieMap[c]||0)*o.수량;});
      // 커스텀·낱개쿠키: '추가' 칸의 축약 표기(바+레+카2 등)를 쿠키로 전개
      if(o.상품명==="커스텀"||o.상품명==="낱개쿠키"){
        const parsed=parseCustomCookies(o.추가);
        Object.keys(parsed).forEach(c=>{ if(qty[c]!==undefined)qty[c]+=parsed[c]*(o.수량||1); });
      }
      return{...o,qty};
    });
    const baseTotals={}, addTotals={};
    COOKIES.forEach(c=>{baseTotals[c]=rows.reduce((s,r)=>s+(r.qty[c]||0),0);addTotals[c]=0;});
    // 추가생산(여유분): 상품명이면 매트릭스로 전개, 쿠키명이면 직접 가감 (음수면 차감)
    addProd.forEach(a=>{
      const q=parseInt(a.qty)||0;
      if(!q)return;
      if(PRODUCTS.includes(a.name)){
        const cm=localMatrix[a.name]||{};
        COOKIES.forEach(c=>{addTotals[c]+=(cm[c]||0)*q;});
      }else if(COOKIES.includes(a.name)){
        addTotals[a.name]+=q;
      }
    });
    const totals={};
    COOKIES.forEach(c=>{totals[c]=Math.max(0,baseTotals[c]+addTotals[c]);});   // 차감으로 음수가 되면 0
    const active=COOKIES.filter(c=>totals[c]>0);
    return{rows,baseTotals,addTotals,totals,active};
  },[prodOrders,localMatrix,addProd]);

  const {rows,baseTotals,addTotals,totals,active}=production;
  // 최종수량 = 필요(주문+추가생산) + 여유분
  const fin=(c)=>((totals[c]||0)+(extra[c]||0));
  // 전일 재고 (쿠키별 남은 개수)
  const stockOf=(c)=>Math.max(0,parseInt((stock&&stock[c])||0)||0);
  // ① 추가생산(+)은 fin에 이미 반영 → ② 전일재고(−) → 재고 차감 후 필요량
  const needAfterStock=(c)=>Math.max(0,fin(c)-stockOf(c));
  // ③ 팬수 자동맞춤(+): 재고 차감 후 필요량을 오븐팬 단위로 올림 → 실제 생산량(항상 판 단위)
  const pansOf=(c)=>{const n=needAfterStock(c);return n>0?Math.ceil(n/panSizeOf(c)):0;};
  const realFin=(c)=>pansOf(c)*panSizeOf(c);          // 실제 생산량(팬수 자동맞춤 완료)
  const fillAdd=(c)=>realFin(c)-needAfterStock(c);    // 팬 채우려 더해진 수량
  const grandTotal=active.reduce((s,c)=>s+(totals[c]||0),0);
  const finGrand=active.reduce((s,c)=>s+fin(c),0);
  const realGrand=active.reduce((s,c)=>s+realFin(c),0);
  const stockGrand=active.reduce((s,c)=>s+stockOf(c),0);
  const panGrand=active.reduce((s,c)=>s+pansOf(c),0);

  // 전일 재고 입력 변경
  const setStockVal=(c,v)=>{
    const n=Math.max(0,parseInt(v)||0);
    onStockChange({...(stock||{}),[c]:n});
  };
  // 재고 차감: 이번 생산에 쓴 만큼(전일재고 중 사용분) 재고에서 빼기
  const applyStockDeduction=()=>{
    if(!active.length){notify("생산 내역이 없습니다.","warn");return;}
    const next={...(stock||{})};
    let used=0;
    active.forEach(c=>{
      const cur=stockOf(c);
      const use=Math.min(cur,fin(c));   // 재고 중 사용분
      next[c]=Math.max(0,cur-use);
      used+=use;
    });
    onStockChange(next);
    notify(`📉 전일 재고에서 ${used}개를 차감했습니다.`);
  };

  const addProdRow=()=>{
    const q=parseInt(naQty)||0;
    if(!q){notify("추가생산 수량을 입력하세요. (차감은 음수, 예: -50)","warn");return;}
    setAddProd(p=>[...p,{id:uid(),name:naName,qty:q}]);
    setNaQty("");
  };
  const delProdRow=(id)=>setAddProd(p=>p.filter(x=>x.id!==id));

  // 선택 주문 → 주문서로 되돌리기 (상태 주문접수)
  const backToOrders=()=>{
    if(!selRows.length){notify("되돌릴 주문을 선택하세요.","warn");return;}
    const ids=new Set(selRows);
    onSave(orders.map(o=>ids.has(o.id)?{...o,상태:"주문접수",updatedBy:currentUser.name,updatedAt:nowSec()}:o));
    setSelRows([]);
    notify(`↩️ ${ids.size}건을 주문서로 되돌렸습니다.`);
  };

  // 오븐팬수는 항상 판 단위(자동맞춤 완료) → "N판"
  const panLabel=(c)=>`${pansOf(c)}판`;

  const autoFill=()=>{
    const nx={...extra};
    active.forEach(c=>{const base=totals[c]||0,ps=panSizeOf(c);nx[c]=Math.max(0,Math.ceil(base/ps)*ps-base);});
    setExtra(nx);
  };

  // 인쇄 → 생산중 주문을 포장대기로 이동 (생산내역 없어도 이동은 진행)
  const handlePrint=()=>{
    if(!active.length&&!prodOrders.length){notify("생산·포장할 내역이 없습니다.","warn");return;}
    if(!active.length){
      // 구울 쿠키 내역은 없지만(커스텀·추가접수 등) 포장 이동은 필요 → 바로 포장
      goPackDirect();
      return;
    }
    const pans=(c)=>panLabel(c);
    printHTML(`<html><head><title>원사부쿠키 생산표</title>
    <style>body{font-family:sans-serif;font-size:11px;margin:16px;color:#111}
    table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:5px 7px}
    th{background:#eef4ff;font-weight:700;color:#1d1d1f;text-align:center}
    td{text-align:center}.left{text-align:left}.total{background:#fafafc;font-weight:700;font-size:13px}
    .fin{background:#FFF3D6;font-weight:800}.pan{background:#eef4ff;color:#0058b8;font-size:10px}
    h2{color:#1d1d1f}h3{color:#1d1d1f;margin:10px 0 4px}.meta{color:#888;font-size:10px;margin-bottom:10px}</style></head><body>
    <h2>🍪 원사부쿠키 생산표</h2>
    <div class="meta">출력일: ${nowStr()} | 담당: ${currentUser.name} | 주문 ${rows.length}건 | 추가생산 ${addProd.length}건 | 최종생산 ${finGrand}개</div>
    <h3>✅ 생산 체크리스트</h3>
    <table style="margin-bottom:18px"><thead><tr>
    <th style="width:40px">완료</th><th class="left">제품명(쿠키)</th><th>필요수량</th><th>여유분</th><th>최종수량</th><th>전일재고</th><th>실제생산</th><th>1판당</th><th>오븐팬수</th>
    </tr></thead><tbody>
    ${active.map(c=>`<tr><td>☐</td><td class="left"><b>${c}</b></td>
    <td>${totals[c]||0}</td><td>${extra[c]||0}</td><td>${fin(c)}</td><td>${stockOf(c)}</td>
    <td class="fin"><b>${realFin(c)}</b></td><td>${panSizeOf(c)}개</td><td><b>${panLabel(c)}</b></td></tr>`).join("")}
    <tr class="total"><td>🍪</td><td class="left">총 합계</td><td>${grandTotal}</td>
    <td>${active.reduce((s,c)=>s+(extra[c]||0),0)}</td><td>${finGrand}</td><td>${stockGrand}</td>
    <td class="fin">${realGrand}</td><td></td><td>${panGrand}판</td></tr>
    </tbody></table>
    ${addProd.length?`<h3>➕ 추가생산</h3><table style="margin-bottom:18px"><thead><tr><th class="left">항목</th><th>수량</th></tr></thead><tbody>
    ${addProd.map(a=>`<tr><td class="left">${a.name}</td><td>${a.qty}</td></tr>`).join("")}</tbody></table>`:""}
    </body></html>`);

    // 생산중 → 포장대기 이동
    if(prodOrders.length){
      const ids=new Set(prodOrders.map(o=>o.id));
      onSave(orders.map(o=>ids.has(o.id)?{...o,상태:"포장대기",updatedBy:currentUser.name,updatedAt:nowSec()}:o));
      notify(`🖨️ 인쇄 완료 · ${ids.size}건이 포장으로 이동했습니다.`);
      if(goPacking)setTimeout(()=>goPacking(),300);
    }else{
      notify("🖨️ 인쇄 창을 열었습니다.");
    }
  };

  const saveMatrix=async()=>{await onMatrixChange(localMatrix);setEditMatrix(false);notify("✅ 생산 수량 설정이 저장되었습니다.");};

  // 인쇄 없이 바로 포장으로 (추가 접수건·생산내역 없는 건 대응)
  const goPackDirect=()=>{
    const targets=selRows.length?prodOrders.filter(o=>selRows.includes(o.id)):prodOrders;
    if(!targets.length){notify("포장으로 보낼 주문을 선택하세요.","warn");return;}
    const ids=new Set(targets.map(o=>o.id));
    onSave(orders.map(o=>ids.has(o.id)?{...o,상태:"포장대기",updatedBy:currentUser.name,updatedAt:nowSec()}:o));
    setSelRows([]);
    notify(`📦 ${ids.size}건을 바로 포장으로 보냈습니다.`);
    if(goPacking)setTimeout(()=>goPacking(),300);
  };

  const selRow=(id)=>setSelRows(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const selAllRows=()=>setSelRows(s=>s.length===prodOrders.length&&prodOrders.length>0?[]:prodOrders.map(o=>o.id));
  const setSelRowVal=(id,val)=>setSelRows(s=>val?Array.from(new Set([...s,id])):s.filter(x=>x!==id));
  const dragRow=useDragSelect(setSelRowVal);

  if(!prodOrders.length && !addProd.length){
    return(
      <div style={{background:C.white,borderRadius:18,padding:60,textAlign:"center",border:`1px solid ${C.border}`}}>
        <div style={{fontSize:56,marginBottom:12}}>🏭</div>
        <p style={{color:C.gray,fontSize:15,lineHeight:1.6}}>생산할 주문이 없습니다.<br/>주문서 탭에서 주문을 선택 후 [🏭 생산진행]을 누르면 이곳에 나타납니다.</p>
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
        <div>
          <h2 style={{margin:0,fontSize:22,fontWeight:600,color:C.amberDark}}>생산표</h2>
          <p style={{margin:"2px 0 0",fontSize:12,color:C.gray}}>생산중 {prodOrders.length}건 · 최종 {finGrand}개 · 전일재고 {stockGrand}개 · <span style={{color:"#0058b8",fontWeight:600}}>실제생산 {realGrand}개 ({panGrand}판)</span></p>
        </div>
        <div style={{flex:1}}/>
        {canEdit&&selRows.length>0&&<button onClick={backToOrders} style={btn("#6e6e73")}>↩️ 주문서로({selRows.length})</button>}
        {canEdit&&<button onClick={goPackDirect} style={btn(C.white,{color:"#7b3fb8",border:"1px solid #7b3fb8"})}>📦 바로 포장으로{selRows.length?`(${selRows.length})`:""}</button>}
        {canEdit&&<button onClick={applyStockDeduction} style={btn(C.white,{color:"#0058b8",border:"1px solid #0058b8"})}>📉 재고 차감</button>}
        {canEdit&&<button onClick={()=>setEditMatrix(!editMatrix)} style={btn("#1d1d1f")}>{editMatrix?"📋 생산표 보기":"⚙️ 수량 설정"}</button>}
        {canEdit&&editMatrix&&<button onClick={saveMatrix} style={btn(C.success)}>💾 설정 저장</button>}
        {canEdit&&<button onClick={handlePrint} style={btn(C.amber,{fontWeight:600})}>🖨️ 인쇄 → 포장</button>}
        {!canEdit&&<span style={{fontSize:12,color:C.gray,padding:"8px 14px",background:C.parchment,borderRadius:8}}>🔒 조회 전용 · 인쇄·이동은 관리자만</span>}
      </div>

      {!editMatrix&&active.length>0&&(()=>{
        const doneCount=active.filter(c=>checked[c]).length;
        return(
          <div style={{background:"#fafafc",borderRadius:18,border:`1px solid #cfe0ff`,padding:"16px 20px",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap"}}>
              <span style={{fontSize:16,fontWeight:700,color:C.amberDark}}>🍪 총 생산수량 체크리스트</span>
              <span style={{fontSize:12,color:C.gray}}>여유분을 넣어 팬수를 정수로 맞추세요 · 다 구우면 체크</span>
              <div style={{flex:1}}/>
              <button onClick={autoFill} style={btn("#0066cc",{padding:"5px 12px",fontSize:12})}>🎯 팬수 자동맞춤</button>
              <button onClick={()=>setExtra({})} style={btn(C.white,{padding:"5px 12px",fontSize:12,color:"#1d1d1f",border:`1px solid ${C.border}`})}>여유분 초기화</button>
              <span style={{padding:"4px 14px",borderRadius:20,fontSize:13,fontWeight:600,background:doneCount===active.length?"#D1FAE5":C.amberLight,color:doneCount===active.length?"#1c7a34":C.amberDark}}>
                {doneCount} / {active.length} 종 · 총 {finGrand}개
              </span>
            </div>
            <div style={{border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr>
                    <th style={{...TH,width:44,textAlign:"center"}}>완료</th>
                    <th style={TH}>제품명(쿠키)</th>
                    <th style={{...TH,textAlign:"center"}}>필요수량</th>
                    <th style={{...TH,textAlign:"center"}}>여유분</th>
                    <th style={{...TH,textAlign:"center"}}>최종수량</th>
                    <th style={{...TH,textAlign:"center"}}>전일재고</th>
                    <th style={{...TH,textAlign:"center"}}>실제생산</th>
                    <th style={{...TH,textAlign:"center"}}>1판당</th>
                    <th style={{...TH,textAlign:"center"}}>오븐팬수</th>
                  </tr>
                </thead>
                <tbody>
                  {active.map((c,idx)=>{
                    const on=!!checked[c];
                    const ps=panSizeOf(c);
                    return(
                      <tr key={c} style={{background:on?"#e6f5ea":(idx%2===0?C.white:"#FAFAFA")}}>
                        <td style={{...TD,textAlign:"center"}}>
                          <span onClick={()=>setChecked(p=>({...p,[c]:!p[c]}))} title="완료 체크"
                            style={{display:"inline-flex",width:22,height:22,borderRadius:6,cursor:"pointer",border:on?"none":`2px solid ${C.border}`,background:on?C.success:"transparent",color:"#fff",fontSize:14,alignItems:"center",justifyContent:"center",fontWeight:700}}>{on?"✓":""}</span>
                        </td>
                        <td style={{...TD,fontWeight:600,fontSize:14,color:on?C.success:"#1d1d1f",textDecoration:on?"line-through":"none"}}>{c}{addTotals[c]>0&&<span style={{fontSize:10,color:C.amber,marginLeft:5}}>(+추가 {addTotals[c]})</span>}</td>
                        <td style={{...TD,textAlign:"center",color:C.gray}}>{totals[c]||0}</td>
                        <td style={{...TD,textAlign:"center"}}>
                          <input type="number" min={0} value={extra[c]||""} placeholder="0"
                            onChange={e=>{const v=Math.max(0,parseInt(e.target.value)||0);setExtra(p=>({...p,[c]:v}));}}
                            style={{width:56,textAlign:"center",border:`1px solid ${C.border}`,borderRadius:8,padding:"4px 4px",fontSize:13,fontFamily:"inherit"}}/>
                        </td>
                        <td style={{...TD,textAlign:"center",fontWeight:700,fontSize:15,color:on?C.success:C.amberDark}}>{fin(c)}</td>
                        <td style={{...TD,textAlign:"center"}}>
                          <input type="number" min={0} value={(stock&&stock[c])||""} placeholder="0"
                            onChange={e=>setStockVal(c,e.target.value)}
                            style={{width:56,textAlign:"center",border:`1px solid #cfe0ff`,borderRadius:8,padding:"4px 4px",fontSize:13,fontFamily:"inherit",background:"#f7faff"}}/>
                        </td>
                        <td style={{...TD,textAlign:"center",fontWeight:700,fontSize:16,color:"#0058b8"}}>
                          {realFin(c)}{fillAdd(c)>0&&<span style={{fontSize:10,color:C.success,marginLeft:3}}>(+{fillAdd(c)})</span>}
                        </td>
                        <td style={{...TD,textAlign:"center",fontSize:12,color:C.gray}}>{ps}개</td>
                        <td style={{...TD,textAlign:"center",fontWeight:700,fontSize:14,color:C.success}}>{panLabel(c)}</td>
                      </tr>
                    );
                  })}
                  <tr style={{background:C.amberLight}}>
                    <td style={{...TD,textAlign:"center"}}>🍪</td>
                    <td style={{...TD,fontWeight:700,color:C.amberDark}}>총 합계</td>
                    <td style={{...TD,textAlign:"center",fontWeight:600,color:C.amberDark}}>{grandTotal}</td>
                    <td style={{...TD,textAlign:"center",fontWeight:600,color:C.amberDark}}>{active.reduce((s,c)=>s+(extra[c]||0),0)}</td>
                    <td style={{...TD,textAlign:"center",fontWeight:700,fontSize:15,color:C.amberDark}}>{finGrand}</td>
                    <td style={{...TD,textAlign:"center",fontWeight:600,color:"#0058b8"}}>{stockGrand}</td>
                    <td style={{...TD,textAlign:"center",fontWeight:700,fontSize:16,color:"#0058b8"}}>{realGrand}</td>
                    <td style={TD}></td>
                    <td style={{...TD,textAlign:"center",fontWeight:600,color:C.amberDark}}>{panGrand}판</td>
                  </tr>
                </tbody>
              </table>
            </div>

            {/* 추가생산 입력 */}
            <div style={{marginTop:14,padding:"12px 14px",background:"#eef4ff",borderRadius:10,border:`1px solid #cfe0ff`}}>
              <div style={{fontSize:13,fontWeight:600,color:"#0058b8",marginBottom:8}}>➕ 추가생산 (여유분과 별개 · 상품명 또는 쿠키명으로 계속 추가)</div>
              {addProd.length>0&&(
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
                  {addProd.map(a=>(
                    <span key={a.id} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 8px 4px 10px",borderRadius:20,background:"#fff",border:`1px solid #9dc4ff`,fontSize:12,fontWeight:700,color:"#0058b8"}}>
                      {a.name}
                      <input type="number" value={a.qty} title="음수 입력 시 차감 (예: -50)"
                        onChange={e=>setAddProd(p=>p.map(x=>x.id===a.id?{...x,qty:(e.target.value===""||e.target.value==="-")?e.target.value:(parseInt(e.target.value)||0)}:x))}
                        style={{width:56,textAlign:"center",border:`1px solid #cfe0ff`,borderRadius:6,padding:"2px 2px",fontSize:12,fontWeight:700,color:(parseInt(a.qty)||0)<0?C.error:"#0058b8",fontFamily:"inherit",background:"#f7faff"}}/>
                      개
                      <span onClick={()=>delProdRow(a.id)} title="삭제" style={{cursor:"pointer",color:C.error,fontSize:13,marginLeft:1}}>✕</span>
                    </span>
                  ))}
                </div>
              )}
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <select value={naName} onChange={e=>setNaName(e.target.value)} style={{...inp,width:"auto"}}>
                  <optgroup label="구성">
                    {ADDPROD_SETS.map(p=><option key={p} value={p}>{p}</option>)}
                  </optgroup>
                  <optgroup label="개별">
                    {ADDPROD_SINGLES.map(c=><option key={c} value={c}>{c==="로터리쿠키"?"로터리":c}</option>)}
                  </optgroup>
                </select>
                <input type="number" value={naQty} placeholder="수량(-차감)" onChange={e=>setNaQty(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addProdRow()}
                  placeholder="수량" style={{...inp,width:90}}/>
                <button onClick={addProdRow} style={btn("#0066cc",{fontWeight:700})}>추가</button>
                {addProd.length>0&&<button onClick={()=>setAddProd([])} style={btn(C.white,{color:"#1d1d1f",border:`1px solid ${C.border}`})}>전체 삭제</button>}
              </div>
            </div>
          </div>
        );
      })()}

      {editMatrix?(
        <div style={{background:C.white,borderRadius:18,overflow:"hidden",border:`1px solid ${C.border}`}}>
          <div style={{padding:"14px 20px",borderBottom:`1px solid ${C.border}`,background:C.amberLight}}>
            <p style={{margin:0,fontSize:13,color:C.amberDark,fontWeight:600}}>⚙️ 박스당 쿠키 생산 수량 · 생산표.xlsx 기준 · 빈 항목은 직접 입력하세요</p>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:1100}}>
              <thead>
                <tr>
                  <th style={{...TH,minWidth:90,position:"sticky",left:0,zIndex:2}}>상품명</th>
                  {COOKIES.map(c=><th key={c} style={{...TH,textAlign:"center",minWidth:64,fontSize:11}}>{c}</th>)}
                </tr>
              </thead>
              <tbody>
                {PRODUCTS.map((p,i)=>(
                  <tr key={p} style={{background:i%2===0?C.white:"#FAFAFA"}}>
                    <td style={{...TD,fontWeight:700,color:C.amberDark,position:"sticky",left:0,background:i%2===0?C.white:"#FAFAFA",zIndex:1}}>{p}</td>
                    {COOKIES.map(c=>(
                      <td key={c} style={{...TD,textAlign:"center",padding:"4px 6px"}}>
                        <input type="number" min={0} value={(localMatrix[p]&&localMatrix[p][c])||""}
                          onChange={e=>{const v=+e.target.value||0;setLocalMatrix(m=>({...m,[p]:{...(m[p]||{}),[c]:v}}));}}
                          style={{width:46,textAlign:"center",border:`1px solid ${C.border}`,borderRadius:4,padding:"4px 2px",fontSize:12,fontFamily:"inherit"}}/>
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ):prodOrders.length>0&&(
        <div style={{background:C.white,borderRadius:18,overflow:"hidden",border:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,color:C.gray,padding:"8px 14px",background:"#fafafc",borderBottom:`1px solid ${C.border}`}}>
            ☑️ 주문을 선택하면 [주문서로 되돌리기]가 가능합니다.
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:640}}>
              <thead>
                <tr>
                  <th style={{...TH,width:40,textAlign:"center"}}><input type="checkbox" style={CHK} checked={selRows.length===prodOrders.length&&prodOrders.length>0} onChange={selAllRows}/></th>
                  <th style={TH}>배송일</th><th style={TH}>주문자</th><th style={TH}>상품명</th>
                  <th style={{...TH,textAlign:"center"}}>수량</th>
                  {active.map(c=><th key={c} style={{...TH,textAlign:"center",fontSize:11}}>{c}</th>)}
                  <th style={{...TH,textAlign:"center"}}>합계</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i)=>{
                  const rowTotal=active.reduce((s,c)=>s+(r.qty[c]||0),0);
                  return(
                    <tr key={r.id} style={{background:selRows.includes(r.id)?"#eef4ff":(i%2===0?C.white:"#FAFAFA")}}>
                      <td style={chkCell}

                      <td style={{...TD,color:C.amberDark,fontWeight:500}}>{r.상품명}</td>

                      ))}

// ===================== PACKING TAB (포장) =====================
function PackingTab({orders,onSave,currentUser,notify,goInvoice,goLabel}) {
  const today=todayStr();
  const now=new Date();
  const [search,setSearch]=useState("");
  const [sel,setSel]=useState([]);
  const [editModal,setEditModal]=useState(null);
  const canEdit=true; // 전 직원 편집 허용

  // 생산표에서 넘어온 '포장대기' 건만 표시
  const list=useMemo(()=>{
    return orders.filter(o=>o.상태==="포장대기")
      .filter(o=>!search||[o.주문자,o.상품명,o.연락처||"",o.주소||""].some(v=>v.includes(search)))
      .sort((a,b)=>(a.배송일||"").localeCompare(b.배송일||"")||((a.seq||0)-(b.seq||0)));
  },[orders,search]);

  const selOne=(id)=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const selAll=()=>setSel(s=>s.length===list.length&&list.length>0?[]:list.map(o=>o.id));
  const setSelVal=(id,val)=>setSel(s=>val?Array.from(new Set([...s,id])):s.filter(x=>x!==id));
  const dragSel=useDragSelect(setSelVal);

  // 포장취소 → 생산표(생산중)로 되돌림
  const cancelPacking=()=>{
    if(!sel.length){notify("포장취소할 주문을 선택하세요.","warn");return;}
    const ids=new Set(sel);
    onSave(orders.map(o=>ids.has(o.id)?{...o,상태:"생산중",updatedBy:currentUser.name,updatedAt:nowSec()}:o));
    setSel([]);notify(`↩️ ${ids.size}건을 생산표로 되돌렸습니다.`);
  };
  // 수정 → 선택 1건 편집 모달
  const editSelected=()=>{
    if(sel.length!==1){notify("수정할 주문 1건만 선택하세요.","warn");return;}
    const o=orders.find(x=>x.id===sel[0]);
    if(o)setEditModal(o);
  };
  const saveEdit=(saved)=>{
    onSave(orders.map(o=>o.id===saved.id?saved:o));
    setEditModal(null);setSel([]);notify("✅ 주문이 수정되었습니다.");
  };
  // 포장완료 → 다음 단계로 자동 분기 (택배→송장입력 / 그 외→배송라벨)
  const nextStep=(targetSel)=>{
    const ids=new Set(targetSel||sel);
    if(!ids.size){notify("포장 완료할 주문을 선택하세요.","warn");return;}
    const picked=orders.filter(o=>ids.has(o.id));
    const hasTaekbae=picked.some(o=>o.배송방법==="택배");
    const hasOther=picked.some(o=>o.배송방법!=="택배");
    // 모두 '송장대기'로 (택배는 송장입력, 비택배는 배송라벨에서 처리)
    onSave(orders.map(o=>ids.has(o.id)?{...o,상태:"송장대기",updatedBy:currentUser.name,updatedAt:nowSec()}:o));
    setSel([]);
    const t=picked.filter(o=>o.배송방법==="택배").length;
    const e=picked.length-t;
    notify(`📦 포장완료 · 택배 ${t}건→송장입력, 그 외 ${e}건→배송라벨로 이동`);
    // 자동 이동: 택배가 있으면 송장입력, 없으면 배송라벨
    setTimeout(()=>{ if(hasTaekbae&&goInvoice)goInvoice(); else if(hasOther&&goLabel)goLabel(); },300);
  };

  // 포장 목록 인쇄 (선택 시 선택만, 없으면 전체)
  const handlePrint=()=>{
    const target=sel.length?list.filter(o=>sel.includes(o.id)):list;
    if(!target.length){notify("인쇄할 포장 건이 없습니다.","warn");return;}
    printHTML(`<html><head><title>원사부쿠키 포장 목록</title>
    <style>body{font-family:sans-serif;font-size:12px;margin:16px;color:#111}

    <!-- 1페이지: 선택 집계만 -->
    <h2>📦 원사부쿠키 포장 목록</h2>
    <div class="meta">출력일: ${nowStr()} | 담당: ${currentUser.name} | 총 ${target.length}건</div>
    ${boxSummaryPrintHTML(computeBoxSummary(target))}
    <!-- 2페이지부터: 포장 상세 -->
    <div class="detail-page">
    <h3 style="color:#1d1d1f;margin:0 0 6px">📋 포장 상세</h3>
    <table><thead><tr>
    <th class="nowrap">배송일</th><th class="nowrap">배송</th><th class="nowrap">주문자</th>
    <th class="nowrap">상품명</th><th class="nowrap">수량</th><th class="nowrap">박스</th><th class="nowrap">스티커</th>
    <th>문구</th><th>특이사항</th></tr></thead><tbody>
    ${target.map(o=>`<tr>
    <td class="nowrap">${o.배송일||""}</td><td class="nowrap">${o.배송방법||""}</td><td class="nowrap"><b>${o.주문자||""}</b></td>
    <td class="nowrap">${o.상품명||""}</td><td class="nowrap" style="text-align:center">${o.수량||1}</td>
    <td class="nowrap">${o.박스||""}</td><td class="nowrap">${o.스티커||""}</td>
    <td class="memo">${o.문구||""}</td><td class="wrap">${[specText(o.특이사항),o.특이사항2].filter(Boolean).join(" / ")}</td>
    </tr>`).join("")}
    </tbody></table>
    </div></body></html>`);
    notify(`🖨️ 포장 목록 ${target.length}건 인쇄`);
  };

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
        <div>
          <h2 style={{margin:0,fontSize:22,fontWeight:600,color:C.amberDark}}>포장</h2>
          <p style={{margin:"2px 0 0",fontSize:12,color:C.gray}}>생산표에서 넘어온 포장 대기 {list.length}건 · 포장완료 시 택배→송장입력, 그 외→배송라벨로 자동 이동</p>
        </div>
        <div style={{flex:1}}/>
        <input value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,width:170}} placeholder="🔍 주문자/상품명/연락처"/>
        <button onClick={handlePrint} style={btn(C.white,{color:C.ink,border:`1px solid ${C.border}`})}>🖨️ 인쇄{sel.length?`(${sel.length})`:""}</button>
        {sel.length>0&&<>
          <button onClick={cancelPacking} style={btn(C.white,{color:C.amber,border:`1px solid ${C.amber}`})}>↩️ 포장취소({sel.length})</button>
          <button onClick={editSelected} style={btn(C.white,{color:C.amber,border:`1px solid ${C.amber}`})}>✏️ 수정({sel.length})</button>
          <button onClick={()=>nextStep()} style={btn(C.success,{fontWeight:600})}>✅ 포장완료 → 다음({sel.length})</button>
        </>}
      </div>

      {list.length===0?(
        <div style={{background:C.white,borderRadius:18,padding:48,textAlign:"center",color:C.gray,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:40,marginBottom:8}}>📦</div>
          포장 대기 중인 주문이 없습니다. (생산표에서 인쇄하면 이곳으로 넘어옵니다)
        </div>
      ):(

          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:900,tableLayout:"auto"}}>
              <thead>
                <tr>
                  <th style={{...TH,width:40,textAlign:"center"}}><input type="checkbox" style={CHK} checked={sel.length===list.length&&list.length>0} onChange={selAll}/></th>

                        <span style={{cursor:"pointer",borderBottom:"1px dotted #bbb"}} title="클릭하여 수정" onClick={()=>setEditModal(o)}>{o.주문자}</span>
