  );
}

// ===================== 생산스케줄 탭 (C단계: 월·화·수 1차 / 목·금 소진율 기준 2차) =====================
// C-1: 1차 생산실적·실사 현재고 입력(미입력 vs 0 구분). C-2(제안): 소진(배송완료) 반영한 2차 추천.
// 운영 데이터는 읽기 전용(배송완료 읽기만). 입력값은 wonsabu_dev/prod_actuals 로만 저장.
function ScheduleTab({orders,weeklyGoals,prodActuals,onSaveActuals,currentUser,notify,syncState}) {
  const isAdmin=currentUser.role==="admin";
  const [monday,setMonday]=useState(defaultWeekMonday());   // 당일 기준 기본 주차
  const wk=weeklyGoals[monday];
  const goal=(c)=> (wk&&wk.goals[c])||0;
  const pa=prodActuals||DEFAULT_PROD_ACTUALS;
  // 소진 = 선택 주차에 배송완료된 주문을 쿠키로 전개
  const soldByCookie=useMemo(()=>{
    const end=addDays(monday,6);
    const done=(orders||[]).filter(o=> o.상태==="배송완료" && o.배송일 && o.배송일>=monday && o.배송일<=end );
    return expandOrdersToCookies(done,{onlyActive:false}).byCookie;
  },[orders,monday]);
  const has=(obj,c)=>Object.prototype.hasOwnProperty.call(obj||{},c);
  const [edit,setEdit]=useState(null);
  const startEdit=()=>setEdit({
    prod1:{...(pa.prod1||{})}, stock:{...(pa.stock||{})}, override2:{...(pa.override2||{})},
    stockIncludesP1: pa.stockIncludesP1!==false,
  });
  const clean=(obj)=>{ const r={}; PROD_COOKIES.forEach(c=>{const v=obj[c]; if(v!==""&&v!=null&&!isNaN(parseInt(v))) r[c]=parseInt(v);}); return r; };
  const saveEdit=()=>{
    onSaveActuals({...pa, prod1:clean(edit.prod1), stock:clean(edit.stock), override2:clean(edit.override2), stockIncludesP1:edit.stockIncludesP1});
    setEdit(null); notify("✅ 생산 실적·실사 현재고를 저장했습니다.");
  };
  const incP1 = edit?edit.stockIncludesP1:(pa.stockIncludesP1!==false);
  // 한 행 계산
  const calc=(c)=>{
    const G=goal(c);
    const rawP1 = edit?(edit.prod1[c]===""||edit.prod1[c]==null?null:parseInt(edit.prod1[c])):(has(pa.prod1,c)?pa.prod1[c]:null);
    const P1 = (rawP1!=null && !isNaN(rawP1))?rawP1:null;
    const rawSTK = edit?(edit.stock[c]===""||edit.stock[c]==null?null:parseInt(edit.stock[c])):(has(pa.stock,c)?pa.stock[c]:null);
    const STK = (rawSTK!=null && !isNaN(rawSTK))?rawSTK:null;
    const rawOV = edit?(edit.override2[c]===""||edit.override2[c]==null?null:parseInt(edit.override2[c])):(has(pa.override2,c)?pa.override2[c]:null);
    const OV = (rawOV!=null && !isNaN(rawOV))?rawOV:null;
    const SOLD = soldByCookie[c]||0;
    // 추정 현재고: 실사 우선, 없으면 1차−소진
    let cur=null, basis="";
    if(STK!=null){ cur = incP1 ? STK : Math.max(0, STK + (P1||0) - SOLD); basis = incP1?"실사":"실사+1차−소진"; }
    else if(P1!=null){ cur = Math.max(0, P1 - SOLD); basis="추정(1차−소진)"; }
    const R2 = cur==null ? null : Math.max(0, G - cur);
    const finalR2 = OV!=null ? OV : R2;
    return {G,P1,STK,OV,SOLD,cur,basis,R2,finalR2};
  };
  const numCell=(v)=> v!=null ? v.toLocaleString() : <span style={{fontSize:11,color:"#b8860b",fontWeight:600}}>미입력</span>;
  return(
    <div>
      <div style={{background:"#eef2ff",border:"1px solid #c7d2fe",borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#3730a3",lineHeight:1.6}}>
        📅 <b>생산스케줄 (월·화·수 1차 / 목·금 2차)</b> — 1차 생산 실적과 실사 현재고를 입력하면, 소진(배송완료)을 반영해 목·금 <b>2차 추천량</b>을 계산합니다. 운영 데이터는 읽기 전용이며 입력값은 개발 사본에만 저장됩니다.
      </div>
      <div style={{background:C.white,borderRadius:16,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:15,fontWeight:700,color:"#4f46e5"}}>📅 생산 스케줄 · 2차 추천</span>
          <button onClick={()=>{setMonday(mondayOf(addDays(monday,-7)));setEdit(null);}} style={{border:`1px solid ${C.border}`,background:C.white,borderRadius:8,width:28,height:28,cursor:"pointer"}}>‹</button>
          <span style={{fontSize:13,fontWeight:700,color:C.ink}}>{weekLabel(monday)}</span>
          <button onClick={()=>{setMonday(mondayOf(addDays(monday,7)));setEdit(null);}} style={{border:`1px solid ${C.border}`,background:C.white,borderRadius:8,width:28,height:28,cursor:"pointer"}}>›</button>
          <span style={{fontSize:12,color:C.gray}}>목표 합계 <b style={{color:"#4f46e5"}}>{PROD_COOKIES.reduce((s,c)=>s+goal(c),0).toLocaleString()}</b>개</span>
          <div style={{flex:1}}/>
          <SyncBadge syncState={syncState}/>
          {isAdmin&&!edit&&<button onClick={startEdit} style={btn("#4f46e5",{padding:"5px 12px",fontSize:12})}>✏️ 실적·현재고 입력</button>}
          {isAdmin&&edit&&<><button onClick={()=>setEdit(null)} style={{...btn(C.white),color:C.gray,border:`1px solid ${C.border}`,padding:"5px 10px",fontSize:12}}>취소</button>
            <button onClick={saveEdit} style={btn("#4f46e5",{padding:"5px 12px",fontSize:12,fontWeight:700,color:"#fff"})}>💾 저장</button></>}
        </div>
        {edit&&(
          <div style={{padding:"8px 16px",borderBottom:`1px solid ${C.border}`,background:"#f8f8ff",fontSize:12,color:C.ink,display:"flex",alignItems:"center",gap:8}}>
            <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
              <input type="checkbox" checked={edit.stockIncludesP1} onChange={e=>setEdit({...edit,stockIncludesP1:e.target.checked})}/>
              실사 현재고에 1차 생산분이 <b>이미 포함</b>돼 있음 (체크 해제 시: 현재고 = 실사 + 1차 − 소진)
            </label>
          </div>
        )}
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:1040}}>
            <thead><tr>
              <th style={TH}>쿠키</th>
              <th style={{...TH,textAlign:"right"}}>생산목표</th>
              <th style={{...TH,textAlign:"right"}}>1차 실적(월·화·수)</th>
              <th style={{...TH,textAlign:"right"}}>소진(배송완료)</th>
              <th style={{...TH,textAlign:"right"}}>실사 현재고</th>
              <th style={{...TH,textAlign:"right"}}>추정 현재고</th>
              <th style={{...TH,textAlign:"right"}}>2차 추천(목·금)</th>
              <th style={{...TH,textAlign:"right"}}>2차 확정</th>
              <th style={{...TH,textAlign:"center"}}>상태</th>
            </tr></thead>
            <tbody>
              {PROD_COOKIES.map(c=>{
                const r=calc(c);
                return(
                  <tr key={c}>
                    <td style={{...TD,fontWeight:600}}>{c}</td>
                    <td style={{...TD,textAlign:"right"}}>{r.G?r.G.toLocaleString():<span style={{color:C.gray}}>-</span>}</td>
                    <td style={{...TD,textAlign:"right"}}>
                      {edit?<input type="number" min={0} placeholder="미입력" value={edit.prod1[c]==null?"":edit.prod1[c]} onChange={e=>setEdit({...edit,prod1:{...edit.prod1,[c]:e.target.value}})} style={{...inp,width:84,padding:"4px 6px",textAlign:"right",fontSize:13}}/>:numCell(r.P1)}
                    </td>
                    <td style={{...TD,textAlign:"right",color:r.SOLD>0?"#c0342b":C.gray}}>{r.SOLD?r.SOLD.toLocaleString():"0"}</td>
                    <td style={{...TD,textAlign:"right"}}>
                      {edit?<input type="number" min={0} placeholder="미입력" value={edit.stock[c]==null?"":edit.stock[c]} onChange={e=>setEdit({...edit,stock:{...edit.stock,[c]:e.target.value}})} style={{...inp,width:84,padding:"4px 6px",textAlign:"right",fontSize:13}}/>:numCell(r.STK)}
                    </td>
                    <td style={{...TD,textAlign:"right",color:C.gray}}>{r.cur!=null?<span>{r.cur.toLocaleString()}<span style={{fontSize:10,color:"#9aa",marginLeft:4}}>{r.basis}</span></span>:<span style={{fontSize:11,color:"#b8860b"}}>확인 필요</span>}</td>
                    <td style={{...TD,textAlign:"right",fontWeight:700,color:r.R2==null?"#b8860b":r.R2>0?"#4f46e5":"#1c7a34"}}>{r.R2==null?"확인 필요":r.R2>0?r.R2.toLocaleString():"0 (충분)"}</td>
                    <td style={{...TD,textAlign:"right"}}>
                      {edit?<input type="number" min={0} placeholder="추천값" value={edit.override2[c]==null?"":edit.override2[c]} onChange={e=>setEdit({...edit,override2:{...edit.override2,[c]:e.target.value}})} style={{...inp,width:84,padding:"4px 6px",textAlign:"right",fontSize:13}}/>:(r.OV!=null?<b style={{color:"#4f46e5"}}>{r.OV.toLocaleString()}</b>:<span style={{color:C.gray}}>-</span>)}
                    </td>
                    <td style={{...TD,textAlign:"center"}}>{!r.G?<span style={{fontSize:11,color:C.gray}}>목표없음</span>:r.cur==null?<span style={{fontSize:11,color:"#b8860b"}}>실적/재고 확인</span>:r.finalR2===0?<span style={{fontSize:11,color:"#1c7a34"}}>충분</span>:<span style={{fontSize:11,color:"#4f46e5"}}>{r.OV!=null?"확정 2차":"추가 생산"} {r.finalR2.toLocaleString()}</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      <div style={{marginTop:12,fontSize:12,color:C.gray,lineHeight:1.7}}>
        ※ <b>2차 추천 공식(검토용)</b>: 추정 현재고 = 실사 현재고(입력 시) · 없으면 1차 실적 − 소진. &nbsp;2차 추천 = max(0, 생산목표 − 추정 현재고). &nbsp;‘2차 확정’에 값을 넣으면 추천 대신 그 값을 사용합니다.<br/>
        ※ 1차 실적·실사 현재고는 <b>미입력 / 0</b>을 구분합니다. 둘 다 미입력이면 2차는 ‘확인 필요’로 두고 임의 계산하지 않습니다. 실제 재고 이동이 아니며, 입력값은 개발 사본에만 저장됩니다.
      </div>
    </div>
  );
}
function ComingSoon({title,icon,desc}) {
  return(
    <div style={{background:C.white,borderRadius:18,padding:"70px 40px",textAlign:"center",border:`1px solid ${C.border}`}}>
      <div style={{fontSize:60,marginBottom:14}}>{icon}</div>
      <h2 style={{margin:"0 0 8px",fontSize:22,fontWeight:700,color:C.amberDark}}>{title}</h2>
      <div style={{display:"inline-block",padding:"5px 16px",borderRadius:20,background:C.amberLight,color:C.amberDark,fontSize:13,fontWeight:600,marginBottom:14}}>🚧 준비중</div>
      <p style={{color:C.gray,fontSize:14,lineHeight:1.7,maxWidth:420,margin:"0 auto"}}>{desc}</p>
    </div>
  );
}

// ===================== MAIN APP =====================
function App() {
  const [user,setUser]=useState(null);
  const [orders,setOrders]=useState([]);
  const [forProd,setForProd]=useState([]);
  const [tab,setTab]=useState("주문서");
  const [syncSt,setSyncSt]=useState("동기화됨");
  const [lastSync,setLastSync]=useState(null);
  const [matrix,setMatrix]=useState(BASE_MATRIX);
  const [stock,setStock]=useState({});   // 쿠키별 전일 재고(남은 개수)
  // [1단계] 주차별 목표 {월요일키:{수정자,수정시각,goals:{쿠키:수량},history:[]}} / 생산설정
  const [weeklyGoals,setWeeklyGoals]=useState({});
  const [doughGoals,setDoughGoals]=useState({});   // 반죽 탭 전용 주간 목표(생산 목표와 분리)
  const [prodPlan,setProdPlan]=useState({});        // [S1] 주차별 요일 생산계획 {월요일키:{plan:{요일:{쿠키:수량}},수정자,수정시각}}
  const [prodSettings,setProdSettings]=useState(DEFAULT_PROD_SETTINGS);
  const [prodActuals,setProdActuals]=useState(DEFAULT_PROD_ACTUALS);   // 실사 현재고·1차실적(개발 사본 전용)
  const [users,setUsers]=useState(INIT_USERS);
  const [comments,setComments]=useState([]);
  const [activity,setActivity]=useState([]);
  const [showUsers,setShowUsers]=useState(false);
  const [showBackup,setShowBackup]=useState(false);
  const [showActivity,setShowActivity]=useState(false);
  const [snapshots,setSnapshots]=useState([]);
  const [pending,setPending]=useState(false);   // D: 저장 실패 대기중
  const [monthEndBackup,setMonthEndBackup]=useState(false);  // 월말 백업 팝업
  const [toast,setToast]=useState(null);
  const prevOrd=useRef("");
  const ordersRef=useRef([]);
  const userRef=useRef(null);
  const pendingRef=useRef(null);                // D: 재전송할 데이터
  const toastTimer=useRef(null);
  const lastSnapAt=useRef(0);
  useEffect(()=>{ordersRef.current=orders;},[orders]);
  useEffect(()=>{userRef.current=user;},[user]);

  const notify=useCallback((msg,type="ok")=>{
    setToast({msg,type});
    if(toastTimer.current)clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(()=>setToast(null),2600);
  },[]);

  const loadData=useCallback(async()=>{
    const [allOrd,storedMat,storedUsers,storedCmt,storedAct,snaps,storedStock,storedGoals,storedPset,storedDoughGoals,storedActuals,storedPlan]=await Promise.all([
      loadAllOrders(),sGet("matrix"),sGet("users"),sGet("comments"),sGet("activity"),loadSnapshots(),sGet("stock"),sGet("weekly_goals"),sGet("prod_settings"),sGet("weekly_dough_goals"),sGet("prod_actuals"),sGet("weekly_prod_plan")
    ]);
    if(allOrd){
      const str=JSON.stringify(allOrd);
      if(str!==prevOrd.current){prevOrd.current=str;setOrders(allOrd);setLastSync(new Date());}
    }
    if(storedMat)setMatrix(storedMat);
    if(storedUsers&&storedUsers.length)setUsers(storedUsers);
    if(storedCmt)setComments(storedCmt);
    if(storedAct)setActivity(storedAct);
    if(snaps)setSnapshots(snaps);
    if(storedStock)setStock(storedStock);
    if(storedGoals)setWeeklyGoals(storedGoals);
    if(storedDoughGoals)setDoughGoals(storedDoughGoals);
    if(storedPlan)setProdPlan(storedPlan);
    if(storedActuals)setProdActuals(a=>({...DEFAULT_PROD_ACTUALS,...storedActuals,stock:{...(storedActuals.stock||{})},prod1:{...(storedActuals.prod1||{})},override2:{...(storedActuals.override2||{})},startStock:{...(storedActuals.startStock||{})},prodDone:{...(storedActuals.prodDone||{})},appliedDays:{...(storedActuals.appliedDays||{})},doughMade:{...(storedActuals.doughMade||{})},doughUsedOv:{...(storedActuals.doughUsedOv||{})}}));
    // 설정: 저장값과 기본값 병합(팬당수량 등 기본값 보존, 저장된 값 우선)
    if(storedPset)setProdSettings(ps=>({...DEFAULT_PROD_SETTINGS,...storedPset,panBatch:{...PAN_SIZE,...(storedPset.panBatch||{})},doughYield:{...DOUGH_YIELD_SEED,...(storedPset.doughYield||{})},doughStock:{...(storedPset.doughStock||{})}}));
  },[]);

  useEffect(()=>{
    if(!user)return;
    setSyncSt("동기화됨");
    loadData();
    const unsubs=[];
    unsubs.push(subscribeDoc("orders_index",()=>{ loadData(); }));
    ["matrix","users","comments","activity","backups","stock","weekly_goals","weekly_dough_goals","prod_settings","prod_actuals","weekly_prod_plan"].forEach(k=>unsubs.push(subscribeDoc(k,()=>{ loadData(); })));
    let monthUnsubs=[];
    loadIndex().then(idx=>{(idx||[]).forEach(ym=>{monthUnsubs.push(subscribeDoc("orders_"+ym,()=>{ loadData(); }));});});
    return ()=>{ unsubs.forEach(u=>u&&u()); monthUnsubs.forEach(u=>u&&u()); };
  },[user,loadData]);

  const saveOrders=useCallback(async(newOrders)=>{
    // 변경 감지 → 활동로그 기록 (등록/수정/삭제)
    let changed=0;
    try{
      const prev=ordersRef.current||[];
      const prevMap=new Map(prev.map(o=>[o.id,o]));
      const newMap=new Map(newOrders.map(o=>[o.id,o]));
      const who=(userRef.current&&userRef.current.name)||"";
      const at=nowSec();
      const day=todayStr();
      const logs=[];
      newOrders.forEach(o=>{
        const p=prevMap.get(o.id);
        if(!p)logs.push({id:uid(),type:"등록",name:o.주문자||"",who:o.createdBy||who,at,day});
        else if(p.updatedAt!==o.updatedAt)logs.push({id:uid(),type:"수정",name:o.주문자||"",who:o.updatedBy||who,at,day});
      });
      prev.forEach(o=>{ if(!newMap.has(o.id))logs.push({id:uid(),type:"삭제",name:o.주문자||"",who,at,day}); });
      changed=logs.length;
      if(logs.length){
        const nextAct=[...logs.reverse(),...activity].slice(0,150);
        setActivity(nextAct);
        sSet("activity",nextAct);
      }
    }catch(e){}

    // B: 저장 직전 상태를 자동 스냅샷 (최소 3분 간격, 변경 있을 때만)
    try{
      const prev=ordersRef.current||[];
      const now=Date.now();
      if(changed && prev.length && now-lastSnapAt.current>180000){
        lastSnapAt.current=now;
        pushSnapshot(prev,(userRef.current&&userRef.current.name)||"", "자동 백업(변경 전)")
          .then(()=>loadSnapshots().then(s=>s&&setSnapshots(s)));
      }
    }catch(e){}

    setOrders(newOrders);
    prevOrd.current=JSON.stringify(newOrders);
    if(!ORDERS_WRITABLE){
      // 개발 사본: 운영 주문 데이터 쓰기 차단 → 저장/재시도 없이 화면 표시만(빨간 '재시도 중' 루프 방지)
      setSyncSt("개발 사본 · 주문 저장 꺼짐");
      setLastSync(new Date());
      return;
    }
    setSyncSt("저장 중...");
    const ok=await saveAllOrders(newOrders);   // A: 월별 분할 저장
    if(ok){
      setSyncSt("동기화됨");
      setLastSync(new Date());
      setPending(false);
      pendingRef.current=null;
      lsDel("wsb_pending");
    }else{
      // D: 실패 시 브라우저에 임시 보관 후 자동 재시도
      setSyncSt("저장 실패 · 재시도 중");
      setPending(true);
      pendingRef.current=newOrders;
      try{ lsSet("wsb_pending",JSON.stringify(newOrders)); }catch(e){}
      notify("⚠️ 저장에 실패했습니다. 연결이 돌아오면 자동으로 다시 저장합니다.","warn");
    }
  },[activity,notify]);

  // D: 실패분 자동 재전송 (10초마다)
  useEffect(()=>{
    if(!user)return;
    if(!ORDERS_WRITABLE)return;   // 개발 사본: 주문 쓰기 차단이라 재시도 큐 자체를 돌리지 않음(운영 앱의 wsb_pending도 건드리지 않음)
    // 새로고침 후에도 대기분 복구
    if(!pendingRef.current){
      try{ const p=lsGet("wsb_pending"); if(p){pendingRef.current=JSON.parse(p);setPending(true);} }catch(e){}
    }
    const iv=setInterval(async()=>{
      if(!pendingRef.current)return;
      setSyncSt("재시도 중...");
      const ok=await saveAllOrders(pendingRef.current);
      if(ok){
        pendingRef.current=null;
        lsDel("wsb_pending");
        setPending(false);
        setSyncSt("동기화됨");
        setLastSync(new Date());
        notify("✅ 지연된 변경사항이 저장되었습니다.");
      }
    },10000);
    return ()=>clearInterval(iv);
  },[user,notify]);

  const saveMatrix=useCallback(async(m)=>{setMatrix(m);await sSet("matrix",m);},[]);
  const saveStock=useCallback(async(s)=>{setStock(s);await sSet("stock",s);},[]);
  const saveWeeklyGoals=useCallback(async(g)=>{setWeeklyGoals(g);await sSet("weekly_goals",g);},[]);
  const saveDoughGoals=useCallback(async(g)=>{setDoughGoals(g);await sSet("weekly_dough_goals",g);},[]);
  const saveProdPlan=useCallback(async(p)=>{setProdPlan(p);await sSet("weekly_prod_plan",p);},[]);
  const saveProdActuals=useCallback(async(a)=>{const v={...a,basis:nowSec()};setProdActuals(v);await sSet("prod_actuals",v);},[]);
  const saveProdSettings=useCallback(async(p)=>{setProdSettings(p);await sSet("prod_settings",p);},[]);
  const saveUsers=useCallback(async(u)=>{setUsers(u);await sSet("users",u);},[]);
  const saveComments=useCallback(async(c)=>{setComments(c);await sSet("comments",c);},[]);

  // ===== C: 전체 주문 엑셀 백업 다운로드 =====
  const downloadBackupExcel=useCallback((silent)=>{
    try{
      const list=ordersRef.current||[];
      if(!list.length){ if(!silent)notify("백업할 주문이 없습니다.","warn"); return; }
      const cols=["배송일","배송방법","주문자","연락처","연락처2","상품명","추가","수량","박스","스티커","문구","특이사항","특이사항2","주소","배송메모","배송메모2","상태","등록자","수정자","수정시각"];
      const data=list.map(o=>({
        배송일:o.배송일||"",배송방법:o.배송방법||"",주문자:o.주문자||"",연락처:o.연락처||"",연락처2:o.연락처2||"",
        상품명:o.상품명||"",추가:o.추가||"",수량:o.수량||1,박스:o.박스||"",스티커:o.스티커||"",
        문구:o.문구||"",특이사항:specText(o.특이사항),특이사항2:o.특이사항2||"",
        주소:o.주소||"",배송메모:o.배송메모||"",배송메모2:o.배송메모2||"",상태:o.상태||"",
        등록자:o.createdBy||"",수정자:o.updatedBy||"",수정시각:o.updatedAt||"",
      }));
      const ws=XLSX.utils.json_to_sheet(data,{header:cols});
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"주문백업");
      XLSX.writeFile(wb,`원사부_주문백업_${todayStr()}.xlsx`);
      lsSet("wsb_lastBackupDay",todayStr());
      if(!silent)notify(`💾 ${list.length}건을 엑셀로 백업했습니다.`);
    }catch(e){ if(!silent)notify("엑셀 백업에 실패했습니다.","warn"); }
  },[notify]);

  // C: 월말(그 달 마지막 날)에 1회, 팝업으로 백업 다운로드 안내
  useEffect(()=>{
    if(!user||!orders.length)return;
    const now=new Date();
    const isLastDay=now.getDate()===new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    if(!isLastDay)return;
    const ym=todayStr().slice(0,7);
    if(lsGet("wsb_monthBackup")===ym)return;   // 이번 달 이미 안내함
    const t=setTimeout(()=>setMonthEndBackup(true),3000);
    return ()=>clearTimeout(t);
  },[user,orders.length]);
  const doMonthEndBackup=()=>{
    downloadBackupExcel(false);
    lsSet("wsb_monthBackup",todayStr().slice(0,7));
    setMonthEndBackup(false);
  };
  const skipMonthEndBackup=()=>{
    lsSet("wsb_monthBackup",todayStr().slice(0,7));  // 이번 달은 다시 안 띄움
    setMonthEndBackup(false);
  };

  // B: 수동 백업 (지금 상태를 스냅샷으로)
  const makeBackup=async()=>{
    const ok=await pushSnapshot(ordersRef.current||[],user.name,"수동 백업");
    const s=await loadSnapshots();
    if(s)setSnapshots(s);
    notify(ok?"✅ 현재 상태를 백업했습니다.":"백업에 실패했습니다.",ok?"ok":"warn");
  };

  // B: 복원 (관리자 전용)
  const doRestore=async(meta)=>{
    if(user.role!=="admin"){notify("복원 권한은 관리자에게 있습니다.","warn");return;}
    const data=await restoreSnapshot(meta);
    if(!data){notify("복원할 데이터를 찾지 못했습니다.","warn");return;}
    // 복원 직전 상태도 백업해 되돌리기 가능하게
    await pushSnapshot(ordersRef.current||[],user.name,"복원 직전 자동 백업");
    setOrders(data);
    prevOrd.current=JSON.stringify(data);
    const ok=await saveAllOrders(data);
    const s=await loadSnapshots();
    if(s)setSnapshots(s);
    notify(ok?`↩️ ${meta.at} 시점(${meta.count}건)으로 복원했습니다.`:"복원 저장에 실패했습니다.",ok?"ok":"warn");
    setShowBackup(false);
  };

  // 오늘 변경 요약을 직원·관리자에게 문자로 발송 (기기 문자앱 연동)
  const sendChangeSMS=()=>{
    const body=buildChangeSMS(activity);
    if(!body){notify("오늘 변경 내역이 없습니다.","warn");return;}
    const phones=users.map(u=>u.phone).filter(Boolean).map(p=>p.replace(/[^0-9]/g,""));
    // 클립보드 복사(폴백)
    try{ if(navigator.clipboard)navigator.clipboard.writeText(body); }catch(e){}
    if(!phones.length){
      notify("등록된 핸드폰 번호가 없습니다. 요약을 클립보드에 복사했어요.","warn");
      return;
    }
    // 기기 문자앱 열기 (모바일). 여러 명은 콤마로.
    const sep=(navigator.userAgent||"").match(/iPhone|iPad|iPod|Mac/i)?"&":"?";
    const href=`sms:${phones.join(",")}${sep}body=${encodeURIComponent(body)}`;
    try{
      window.location.href=href;
      notify("문자앱을 여는 중입니다. (요약은 클립보드에도 복사됨)");
    }catch(e){
      notify("문자앱 연결에 실패했습니다. 요약을 클립보드에 복사했어요.","warn");
    }
  };

  if(!user) return <LoginScreen onLogin={setUser}/>;

  const TABS=[{k:"주문서",i:"📋"},{k:"반죽",i:"🥣"},{k:"생산",i:"🏭"},{k:"생산표",i:"📊"},{k:"포장",i:"📦"},{k:"송장입력",i:"🧾"},{k:"배송라벨",i:"🚚"},{k:"생산스케줄",i:"📅"}];
  const syncState={syncSt,lastSync};
  const todayOrdCount=orders.filter(o=>o.배송일===todayStr()).length;
  const syncColor=pending?"#F87171":(syncSt==="동기화됨"?"#4ADE80":syncSt.indexOf("저장 중")>=0||syncSt.indexOf("재시도")>=0?"#FBBF24":"#F87171");
  const tone=TAB_TONE[tab]||{accent:C.amber,bg:C.parchment};

  return(
    <div style={{minHeight:"100vh",background:tone.bg,fontFamily:FONT,WebkitFontSmoothing:"antialiased",color:C.ink,transition:"background 0.25s"}}>
      <style>{`
        *{ -webkit-font-smoothing:antialiased; }
        button:active{ transform:scale(0.97); }
        input:focus,select:focus,textarea:focus{ border-color:${C.blueFocus}!important; box-shadow:0 0 0 3px rgba(0,113,227,0.15); }
        ::selection{ background:rgba(0,102,204,0.15); }
      `}</style>
      <div style={{background:"#000000",color:C.white,padding:"11px 22px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100,flexWrap:"wrap"}}>
        <span style={{fontSize:20}}>🍪</span>
        <div>
          <div style={{fontWeight:600,fontSize:16,lineHeight:1,letterSpacing:"-0.4px"}}>원사부쿠키</div>
          <div style={{fontSize:10,opacity:0.6,marginTop:2,letterSpacing:"-0.1px"}}>주문관리시스템</div>
        </div>
        <div style={{marginLeft:12,padding:"3px 12px",background:"rgba(255,255,255,0.12)",borderRadius:980,fontSize:12,letterSpacing:"-0.1px"}}>
          오늘 출고 {todayOrdCount}건
        </div>
        <ActivityTicker activity={activity} onOpen={()=>setShowActivity(true)}/>
        <div style={{flex:1}}/>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:12}}>
          <span style={{width:7,height:7,borderRadius:"50%",background:syncColor,display:"inline-block"}}/>
          <span style={{opacity:0.85}}>{syncSt}</span>
          {lastSync&&<span style={{opacity:0.45}}>{lastSync.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginLeft:12}}>
          <span style={{fontSize:13,fontWeight:400}}>👤 {user.name}</span>
          <button onClick={()=>setShowBackup(true)} title="백업 · 복원"
            style={{padding:"6px 14px",background:pending?"#c2410c":"rgba(255,255,255,0.12)",border:"none",borderRadius:8,color:C.white,fontSize:13,cursor:"pointer",fontFamily:"inherit",letterSpacing:"-0.2px"}}>
            💾 백업{pending?" ⚠️":""}
          </button>
          <button onClick={sendChangeSMS} title="오늘 변경 요약을 직원·관리자에게 문자로"
            style={{padding:"6px 14px",background:C.amber,border:"none",borderRadius:8,color:C.white,fontSize:13,cursor:"pointer",fontFamily:"inherit",letterSpacing:"-0.2px"}}>
            ✉️ 변경 문자
          </button>
          <button onClick={()=>setShowUsers(true)}
            style={{padding:"6px 14px",background:C.ink,border:"none",borderRadius:8,color:C.white,fontSize:13,cursor:"pointer",fontFamily:"inherit",letterSpacing:"-0.2px"}}>
            ⚙️ 내 정보
          </button>
          <button onClick={()=>{lsDel("wsb_autoLogin");setUser(null);}}
            style={{padding:"6px 14px",background:"rgba(255,255,255,0.12)",border:"none",borderRadius:8,color:C.white,fontSize:13,cursor:"pointer",fontFamily:"inherit",letterSpacing:"-0.2px"}}>
            로그아웃
          </button>
        </div>
      </div>

      <div style={{background:"rgba(255,255,255,0.85)",backdropFilter:"saturate(180%) blur(20px)",WebkitBackdropFilter:"saturate(180%) blur(20px)",borderBottom:`1px solid ${C.border}`,display:"flex",overflowX:"auto",position:"sticky",top:0,zIndex:90}}>
        {TABS.map(t=>{
          const tt=TAB_TONE[t.k]||{accent:C.amber};
          return(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{
            padding:"13px 20px",border:"none",background:"none",cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",
            fontWeight:tab===t.k?600:400,
            color:tab===t.k?tt.accent:C.gray,
            borderBottom:tab===t.k?`2px solid ${tt.accent}`:"2px solid transparent",
            fontSize:14,letterSpacing:"-0.2px",
          }}>{t.i} {t.k}</button>
          );
        })}
        <div style={{flex:1}}/>
      </div>

      <div style={{height:4,background:tone.accent,transition:"background 0.25s"}}/>
      <div style={{padding:24,maxWidth:1440,margin:"0 auto"}}>
        <CommentBoard comments={comments} onSave={saveComments} currentUser={user} notify={notify}/>
        {tab==="주문서"&&<OrderTab orders={orders} onSave={saveOrders} currentUser={user} onGoToProduction={()=>setTab("생산표")} setForProduction={setForProd} notify={notify} matrix={matrix} onMatrixChange={saveMatrix}/>}
        {tab==="반죽"&&<DoughTab orders={orders} prodSettings={prodSettings} onSaveSettings={saveProdSettings} doughGoals={doughGoals} onSaveDoughGoals={saveDoughGoals} prodActuals={prodActuals} onSaveActuals={saveProdActuals} currentUser={user} notify={notify} syncState={syncState}/>}
        {tab==="생산"&&<ProduceTab orders={orders} prodSettings={prodSettings} onSaveGoals={saveWeeklyGoals} weeklyGoals={weeklyGoals} prodPlan={prodPlan} onSavePlan={saveProdPlan} prodActuals={prodActuals} onSaveActuals={saveProdActuals} currentUser={user} notify={notify} syncState={syncState}/>}
        {tab==="생산표"&&<ProductionTab orders={orders} onSave={saveOrders} matrix={matrix} onMatrixChange={saveMatrix} stock={stock} onStockChange={saveStock} currentUser={user} notify={notify} goPacking={()=>setTab("포장")}/>}
        {tab==="포장"&&<PackingTab orders={orders} onSave={saveOrders} currentUser={user} notify={notify} goInvoice={()=>setTab("송장입력")} goLabel={()=>setTab("배송라벨")}/>}
        {tab==="송장입력"&&<InvoiceTab orders={orders} onSave={saveOrders} currentUser={user} notify={notify}/>}
        {tab==="배송라벨"&&<DeliveryLabelTab orders={orders} onSave={saveOrders} currentUser={user} notify={notify}/>}
        {tab==="생산스케줄"&&<ScheduleTab orders={orders} weeklyGoals={weeklyGoals} prodActuals={prodActuals} onSaveActuals={saveProdActuals} currentUser={user} notify={notify} syncState={syncState}/>}
      </div>

      {showUsers&&<UserSettings users={users} currentUser={user} onSave={saveUsers} onSelf={setUser} onClose={()=>setShowUsers(false)} notify={notify}/>}
      {showBackup&&<BackupModal snapshots={snapshots} currentUser={user} pending={pending}
        onBackup={makeBackup} onRestore={doRestore} onExcel={downloadBackupExcel} onClose={()=>setShowBackup(false)}/>}
      {showActivity&&<ActivityModal activity={activity} onClose={()=>setShowActivity(false)}/>}
      {monthEndBackup&&(
        <div style={{position:"fixed",inset:0,background:"#00000075",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:C.white,borderRadius:18,width:"100%",maxWidth:400,padding:28,boxShadow:"0 12px 40px rgba(0,0,0,0.12)",textAlign:"center"}}>
            <div style={{fontSize:44,marginBottom:10}}>🗓️</div>
            <h2 style={{margin:"0 0 8px",fontSize:19,fontWeight:600,color:C.ink}}>이번 달 백업 안내</h2>
            <p style={{margin:"0 0 20px",fontSize:13,color:C.gray,lineHeight:1.7}}>
              오늘은 이번 달 마지막 날입니다.<br/>전체 주문({orders.length}건)을 엑셀 파일로<br/>백업해 두시겠어요?
            </p>
            <div style={{display:"flex",gap:8,justifyContent:"center"}}>
              <button onClick={skipMonthEndBackup} style={{...btn(C.white),color:C.gray,border:`1px solid ${C.border}`}}>다음에</button>
              <button onClick={doMonthEndBackup} style={btn(C.amber,{fontWeight:600})}>💾 지금 백업</button>
            </div>
            <p style={{marginTop:14,fontSize:11,color:"#a1a1a6"}}>[💾 백업] 버튼으로 언제든 다시 받을 수 있습니다.</p>
          </div>
        </div>
      )}
      <Toast msg={toast&&toast.msg} type={toast&&toast.type}/>
    </div>
  );
}

if(window.__db && _rootEl){ const _root = ReactDOM.createRoot(_rootEl); _root.render(React.createElement(App)); const b=document.getElementById("boot"); if(b) b.style.display="none"; }
</script></body></html>
